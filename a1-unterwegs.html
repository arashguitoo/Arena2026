<!DOCTYPE html>
<html lang="de" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2A44">
<title>Unterwegs – Lernwelt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --floor:#F4F1EA; --floor-line:#ECE6DA; --paper:#FFFFFF; --ink:#1E2A44; --muted:#6B7280;
  --board:#1E2A44; --board-2:#2A3A5E; --led:#F5B82E; --line:#E5E0D5; --ok:#14A37F; --bad:#E2483D;
  --der:#3B4FD8; --die:#E2483D; --das:#14A37F;
  --accent:#1E2A44;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);font-size:18px;line-height:1.45;color:var(--ink);min-height:100vh;
  background-color:var(--floor);}
:focus-visible{outline:3px solid var(--board);outline-offset:3px}
button{font:inherit;color:inherit}
.hidden{display:none!important}

/* Kopf */
.bar{background:var(--board);color:#fff;box-shadow:0 3px 0 var(--led);position:sticky;top:0;z-index:10}
.bar-in{max-width:720px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;min-height:54px}
.bar a{color:#c9d2e3;text-decoration:none;font-weight:700;font-size:15px}
.bar .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:15px;min-width:0}
.bar .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .who i{width:10px;height:22px;border-radius:3px;flex:none}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}

/* Titel */
.head{display:flex;align-items:center;gap:14px;margin:4px 0 16px}
.head .ic{width:64px;height:64px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:34px;flex:none;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.head h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,11vw,62px);line-height:.88;margin:0;color:var(--board)}
.head small{display:block;font-size:15px;color:var(--muted);font-family:var(--body);font-weight:700;letter-spacing:.02em;margin-bottom:2px}

/* Karten & Knöpfe */
.card{background:var(--paper);border-radius:18px;padding:20px 18px;box-shadow:0 3px 0 rgba(0,0,0,.14)}
.card h2{font-family:var(--display);font-weight:900;font-size:32px;line-height:1;margin:0 0 8px;color:var(--board)}
.card p{margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 20px;border-radius:12px;border:0;background:var(--board);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.btn.led{background:var(--led);color:var(--board)}
.btn.ghost{background:transparent;color:var(--board);box-shadow:inset 0 0 0 2px var(--board)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.stack{display:grid;gap:10px;margin-top:14px}
.codein{display:flex;gap:8px;margin-top:12px}
.codein input{flex:1;min-width:0;min-height:54px;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.14em;text-transform:uppercase;background:#fff;color:var(--ink)}
.codein input:focus{outline:none;border-color:var(--board)}
.err{color:var(--bad);font-weight:700;min-height:24px;margin-top:8px}
.rules{margin:0 0 14px;padding:0;list-style:none;display:grid;gap:8px}
.rules li{background:#fff;border-radius:10px;padding:9px 12px;border-left:5px solid var(--accent);font-size:17px}
.best{font-weight:700;color:var(--muted);font-size:16px;margin-bottom:12px}

/* Menü */
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{display:grid;grid-template-rows:auto 1fr;background:var(--paper);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 3px 0 rgba(0,0,0,.14)}
.tile-top{padding:14px 14px 10px;color:#fff;display:flex;align-items:center;gap:10px;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.1) 0 12px,transparent 12px 24px)}
.tile-top span{font-size:30px}
.tile-top b{font-family:var(--display);font-weight:900;font-size:26px;line-height:1}
.tile p{margin:0;padding:10px 14px 14px;font-size:15.5px;color:var(--muted)}

/* Spielfeld */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hud .pill{background:var(--board);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.hud .pill b{font-family:var(--display);font-size:22px;color:var(--led);margin-left:4px}
.hud .grow{flex:1}
.timer{height:12px;background:rgba(20,34,59,.15);border-radius:6px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .12s linear}
.timer.low i{background:var(--bad)}
.stage{background:var(--paper);border-radius:18px;padding:18px 16px 20px;box-shadow:0 3px 0 rgba(0,0,0,.14);position:relative;overflow:hidden}
.prompt{text-align:center;margin:8px 0 18px}
.prompt .emo{font-size:64px;line-height:1.1;display:block}
.prompt .big{font-family:var(--display);font-weight:900;font-size:clamp(34px,9vw,48px);line-height:1.02;display:block}
.prompt .hint{color:var(--muted);font-size:16px;display:block;margin-top:4px}
.gap{display:inline-block;min-width:2.6em;border-bottom:4px solid var(--accent);color:var(--accent)}
.opts{display:grid;gap:10px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{min-height:62px;border-radius:14px;border:3px solid var(--line);background:#fff;font-family:var(--display);font-weight:900;font-size:28px;cursor:pointer;color:var(--ink);padding:6px 8px;line-height:1.05;transition:transform .08s}
.opt:active{transform:scale(.97)}
.opt.txt{font-family:var(--body);font-weight:700;font-size:18px;text-align:left;padding:12px 14px}
.opt.right{border-color:var(--ok);background:#d6f2e5}
.opt.wrong{border-color:var(--bad);background:#fde6e2}
.opt.der{border-color:var(--der);color:var(--der)} .opt.die{border-color:var(--die);color:var(--die)} .opt.das{border-color:var(--das);color:var(--das)}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
.flash.ok{background:rgba(30,158,106,.18);opacity:1}
.flash.bad{background:rgba(228,65,47,.18);opacity:1}
.tip{min-height:26px;text-align:center;font-weight:700;margin-top:12px;font-size:17px}
.tip.bad{color:#a3281a} .tip.ok{color:#12704a}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .2s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s}

/* Einkaufswagen */
.baskets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.basket{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:6px;text-align:center;min-height:64px}
.basket b{display:block;font-size:13px;color:var(--muted)}
.basket div{font-size:22px;line-height:1.2;word-break:break-all}

/* Memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:3/4;border:0;border-radius:12px;cursor:pointer;position:relative;perspective:600px;background:transparent;padding:0}
.mc .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.mc.open .in,.mc.done .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;text-align:center}
.mc .f{background:var(--accent);color:rgba(255,255,255,.85);font-family:var(--display);font-weight:900;font-size:30px;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.1) 0 8px,transparent 8px 16px)}
.mc .b{background:#fff;border:3px solid var(--line);transform:rotateY(180deg);font-weight:700;font-size:clamp(12px,3.4vw,16px);line-height:1.15}
.mc .b .e{font-size:clamp(20px,6vw,30px);line-height:1.1}
.mc .b.p{background:#f4ecff;border-color:#c9b3ef}
.mc.done .b{border-color:var(--ok);background:#d6f2e5}

/* Satz-Baustelle */
.line{min-height:64px;background:#fff;border:3px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.line.ok{border-style:solid;border-color:var(--ok);background:#d6f2e5}
.line.bad{border-style:solid;border-color:var(--bad);background:#fde6e2}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;justify-content:center;min-height:52px}
.tile-w{min-height:46px;padding:6px 14px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:19px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.line .tile-w{background:var(--board)}
.tile-w.used{visibility:hidden}

/* Café */
.chat{display:flex;flex-direction:column;gap:8px;min-height:220px;max-height:46vh;overflow-y:auto;padding:4px 2px 8px}
.bub{max-width:82%;padding:9px 13px;border-radius:16px;font-size:17px;line-height:1.3}
.bub.them{background:#fff;border:2px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bub.me.wrong{background:#a3281a}
.bub small{display:block;font-size:12px;opacity:.7;font-weight:700}
.scene{display:flex;align-items:center;gap:10px;background:var(--board);color:#fff;border-radius:12px;padding:8px 12px;margin-bottom:10px}
.scene span{font-size:28px}
.scene b{font-family:var(--display);font-weight:800;font-size:22px}

/* Ende */
.score{font-family:var(--display);font-weight:900;font-size:104px;line-height:.9;color:var(--board);text-align:center;margin:8px 0 2px}
.score-sub{text-align:center;color:var(--muted);margin-bottom:12px}
.send{margin:12px 0 4px;padding:12px 14px;border-radius:12px;background:#efe5d3;font-weight:700;text-align:center}
.send.ok{background:#d6f2e5;color:#12704a}
.send.bad{background:#fde6e2;color:#a3281a}
.stars{text-align:center;font-size:34px;letter-spacing:4px}
/* ---------- Lese-Arena ---------- */
.tbadge{display:inline-block;background:var(--board);color:var(--led);font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;margin-bottom:4px}
.teil{font-weight:700;color:var(--muted);font-size:15.5px;margin-bottom:8px}
.order{display:grid;gap:6px;margin-bottom:10px}
.slot{display:flex;align-items:center;gap:8px;background:#fff;border:3px dashed var(--line);border-radius:12px;padding:5px 8px;min-height:50px}
.slot.full{border-style:solid}
.slot.ok{border-color:var(--ok);background:#d6f2e5}
.slot.bad{border-color:var(--bad);background:#fde6e2}
.slot>b{font-family:var(--display);font-weight:900;font-size:22px;color:var(--muted);width:22px;text-align:center;flex:none}
.slot .leer{color:#cfc4b2}
.kartex{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;font-size:16px;text-align:left;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);flex:1;line-height:1.3;display:flex;gap:8px;align-items:center}
.kartex i{font-style:normal;font-size:22px;flex:none}
.kartex.still{cursor:default;box-shadow:none;background:transparent;color:var(--ink);padding:4px 2px}
.kartex.used{visibility:hidden}
.pool.cards{display:grid;gap:8px;margin:0 0 10px}
.loesung{display:block;margin-top:6px;font-weight:400;color:var(--ink);text-align:left;font-size:15.5px}
.tbox{background:#fff;border-radius:12px;padding:10px 14px;margin:0 0 10px;border-left:6px solid var(--accent)}
.tbox b{font-size:17px}
.tbox small{color:var(--muted);font-weight:400}
.tbox p{margin:4px 0 0;font-size:16.5px;line-height:1.55}
.adlist{display:grid;gap:6px;margin-bottom:10px}
.ad{display:flex;gap:8px;align-items:center;background:#fff;border-radius:10px;padding:6px 10px;font-size:15px;line-height:1.3}
.ad i{font-style:normal;font-size:22px}
.ad b{display:block;font-size:15px}
.adk{background:var(--board);color:var(--led);font-family:var(--display);font-weight:900;font-size:19px;border-radius:6px;padding:0 8px;flex:none}
.opts.two{grid-template-columns:1fr 1fr}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.room{min-height:58px;border-radius:12px;border:3px solid var(--line);background:#fff;font-weight:700;font-size:16px;line-height:1.1;cursor:pointer;padding:6px 4px;color:var(--ink)}
.room small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.room.right{border-color:var(--ok);background:#d6f2e5}
.room.wrong{border-color:var(--bad);background:#fde6e2}
.plan-head{font-family:var(--display);font-weight:800;font-size:22px;color:var(--board);margin-bottom:6px}
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;background:var(--board);padding:6px;border-radius:12px;margin-bottom:6px}
.pr{background:#fff;border-radius:8px;padding:6px 8px}
.pr.out{background:#e3f4d9}
.pr b{display:block;font-size:14px;color:var(--board)}
.pr div{display:flex;flex-wrap:wrap;gap:2px 8px}
.pr span{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.pr span i{font-style:normal;font-size:18px}
/* ---------- Gegen die Zeit ---------- */
.tbadge{display:inline-block;background:var(--board);color:var(--led);font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;margin-bottom:4px}
.zw{overflow-wrap:anywhere;word-break:break-word;hyphens:none}
.opt.txt .zw{font-size:16.5px}
.fuse{height:16px;background:rgba(20,34,59,.12);border-radius:8px;overflow:hidden;margin-bottom:6px}
.fuse i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FFC53D,#E9800E)}
.fuse.low i{background:#E4412F}
/* Satz-Baustelle */
.line{min-height:64px;background:#fff;border:3px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.line.ok{border-style:solid;border-color:var(--ok);background:#d6f2e5}
.line.bad{border-style:solid;border-color:var(--bad);background:#fde6e2}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;justify-content:center;min-height:52px}
.tile-w{min-height:46px;padding:6px 14px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:19px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.line .tile-w{background:var(--board)}
.tile-w.used{visibility:hidden}
/* Formular */
.formular{background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px}
.frow{display:flex;gap:10px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);font-size:15px}
.frow:first-child{border-top:0}
.frow>b{font-family:var(--display);font-weight:900;font-size:20px;color:var(--led);background:var(--board);border-radius:6px;padding:0 9px;flex:none}
.frow span{display:block;font-weight:700}
.frow i{font-style:normal;color:var(--muted);font-size:13.5px}
/* Countdown im Sperr-Bildschirm */
.cdbig{display:block;font-family:var(--display);font-weight:900;font-size:clamp(30px,8vw,44px);line-height:1.05;color:var(--board);margin:8px 0 2px}
.cdsub{color:var(--muted);font-size:15.5px}
/* ---------- Unterwegs: Stadtplan ---------- */
.muted{color:var(--muted)}
.plan-svg{width:100%;height:auto;display:block;margin:0 0 8px;border-radius:18px}
.ziel-zeile{text-align:center;font-size:19px;margin-bottom:8px}
.ziel-zeile b{font-family:var(--display);font-size:28px;color:var(--bad)}
.steuer{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.sbtn{min-height:70px;border-radius:14px;border:3px solid var(--line);background:#fff;cursor:pointer;font-size:28px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);padding:4px}
.sbtn span{font-size:14px;font-weight:700}
.sbtn:active{transform:scale(.97);border-color:var(--accent)}
.sbtn.klein{min-height:40px;font-size:16px;flex-direction:row;display:inline-flex;margin-top:8px;padding:4px 14px}
.ticket{background:#fff;border:2px solid var(--board);border-radius:12px;overflow:hidden;margin-bottom:10px;font-size:15px}
.ticket .t-kopf{background:var(--board);color:#fff;padding:6px 10px;font-size:14px}
.ticket table{width:100%;border-collapse:collapse} .ticket th,.ticket td{padding:4px 6px;border-top:1px solid var(--line);text-align:left} .ticket th{font-size:12.5px;color:var(--muted)}
.durchsage{background:var(--board);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:17px;line-height:1.45}
.kompass{text-align:center;font-size:16px;margin-bottom:6px}
.dkarte{display:block;max-width:230px;width:70%;margin:0 auto 8px}
.tbox small{display:block;margin-top:4px}
.tafel-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
@media (max-width:820px){ .tafel-grid{grid-template-columns:1fr} }
.small{font-size:14px}
.frage-kopf{font-weight:800;font-size:17px;margin-bottom:6px;color:var(--board)}
.hinweise{background:#EEF2FF;border-radius:12px;padding:8px 12px;margin:0 0 8px;font-size:16px;line-height:1.5}
.hinweise div{font-weight:600}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="bar"><div class="bar-in">
  <a href="index.html#ueben">‹ Lernwelt</a>
  <span class="who hidden" id="who"><i id="who-color"></i><span id="who-name"></span></span>
</div></header>

<main>
  <div class="head" id="head">
    <div class="ic" id="head-ic">🎮</div>
    <div><small id="head-sub">Plöner Liga</small><h1 id="head-title">Unterwegs</h1></div>
  </div>

  <section id="scr-menu" class="hidden">
    <p id="menu-text"></p>
    <div class="menu" id="menu"></div>
  </section>

  <section class="card" id="scr-loading"><h2>Einen Moment …</h2><p>Das Spiel wird geladen.</p></section>

  <section class="card hidden" id="scr-code">
    <h2>Dein Code</h2>
    <p>Gib deinen Code ein, damit deine Punkte zählen.</p>
    <form class="codein" id="code-form" autocomplete="off"><input id="code-in" maxlength="8" placeholder="CODE" aria-label="Dein Code" autocapitalize="characters"><button class="btn" type="submit">Los</button></form>
    <div class="err" id="code-err" role="alert"></div>
    <button class="btn ghost wide" type="button" data-practice style="margin-top:6px">Ohne Code üben (keine Punkte)</button>
  </section>

  <section class="card hidden" id="scr-block">
    <h2 id="block-title">Gesperrt</h2>
    <p id="block-text"></p>
    <div class="stack">
      <button class="btn led" type="button" data-practice>Trotzdem üben (keine Punkte)</button>
      <button class="btn ghost hidden" id="block-other" type="button">Anderen Code eingeben</button>
      <a class="btn" href="index.html#ueben">Zur Lernwelt</a>
    </div>
  </section>

  <section class="card hidden" id="scr-start">
    <h2>So geht’s</h2>
    <ul class="rules" id="start-rules"></ul>
    <div class="best" id="start-best"></div>
    <button class="btn led wide" id="start-btn" type="button">Spiel starten</button>
  </section>

  <section class="hidden" id="scr-game"><div id="area"></div></section>

  <section class="card hidden" id="scr-end">
    <div class="stars" id="end-stars"></div>
    <div class="score" id="end-score">0</div>
    <div class="score-sub" id="end-sub"></div>
    <div class="send" id="send-msg"></div>
    <div class="stack">
      <button class="btn led" id="again" type="button">Nochmal spielen</button>
      <a class="btn" href="index.html#ueben">Zur Lernwelt</a>
    </div>
  </section>
</main>

/* ==========================================================
   STADTPLAN-MOTOR (Gitter aus Kreuzungen, Norden = oben)
   ========================================================== */
const PLAN_W=5, PLAN_H=4;
const DX=[0,1,0,-1], DY=[-1,0,1,0], PFEIL=["⬆️","➡️","⬇️","⬅️"];
function neuerPlan(){
  const knoten=[]; for(let y=0;y<PLAN_H;y++) for(let x=0;x<PLAN_W;x++) knoten.push({x,y});
  const orte=shuffle(ORTE).slice(0,16); const leer=shuffle(knoten.map((_,i)=>i)).slice(0,PLAN_W*PLAN_H-orte.length);
  let k=0; knoten.forEach((n,i)=>{ if(!leer.includes(i)) n.ort=orte[k++]; });
  return {knoten, an:(x,y)=>knoten.find(n=>n.x===x&&n.y===y)};
}
function gehe(plan, pos, dir, befehl){ // befehl: g(eradeaus) l(inks) r(echts) z(urück)
  const nd = befehl==="l"?(dir+3)%4 : befehl==="r"?(dir+1)%4 : befehl==="z"?(dir+2)%4 : dir;
  const nx=pos.x+DX[nd], ny=pos.y+DY[nd];
  if(nx<0||ny<0||nx>=PLAN_W||ny>=PLAN_H) return null;
  return {pos:{x:nx,y:ny}, dir:nd};
}
function kuerzester(plan, start, dir, ziel){ // BFS über (Position, Richtung) mit Befehlen g/l/r/z
  const key=(p,d)=>`${p.x},${p.y},${d}`; const q=[{p:start,d:dir,n:0}]; const seen=new Set([key(start,dir)]);
  while(q.length){ const c=q.shift(); if(c.p.x===ziel.x&&c.p.y===ziel.y) return c.n;
    for(const b of ["g","l","r","z"]){ const s=gehe(plan,c.p,c.d,b); if(!s) continue; const k=key(s.pos,s.dir); if(seen.has(k)) continue; seen.add(k); q.push({p:s.pos,d:s.dir,n:c.n+1}); } }
  return 99;
}
function planSVG(plan, o){ // o: {pos, dir, ziel, spur:[{x,y}], klick:true, gross}
  const W=520, H=420, X=x=>60+x*100, Y=y=>55+y*103;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="plan-svg" role="img" aria-label="Stadtplan">`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" rx="18" fill="#F6E7D7"/>`;
  for(let y=0;y<PLAN_H;y++) s+=`<line x1="${X(0)-40}" y1="${Y(y)}" x2="${X(PLAN_W-1)+40}" y2="${Y(y)}" stroke="#fff" stroke-width="20" stroke-linecap="round"/>`;
  for(let x=0;x<PLAN_W;x++) s+=`<line x1="${X(x)}" y1="${Y(0)-38}" x2="${X(x)}" y2="${Y(PLAN_H-1)+38}" stroke="#fff" stroke-width="20" stroke-linecap="round"/>`;
  if(o.spur && o.spur.length>1) s+=`<polyline points="${o.spur.map(p=>`${X(p.x)},${Y(p.y)}`).join(" ")}" fill="none" stroke="#3B4FD8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 14" opacity=".9"/>`;
  plan.knoten.forEach(n=>{ const z=o.ziel&&o.ziel.x===n.x&&o.ziel.y===n.y;
    if(n.ort){ s+=`<g ${o.klick?`class="ort-k" data-x="${n.x}" data-y="${n.y}" style="cursor:pointer"`:""}>
      ${z?`<circle cx="${X(n.x)}" cy="${Y(n.y)}" r="34" fill="none" stroke="#E2483D" stroke-width="5"><animate attributeName="r" values="30;38;30" dur="1.2s" repeatCount="indefinite"/></circle>`:""}
      <circle cx="${X(n.x)}" cy="${Y(n.y)}" r="25" fill="#fff" stroke="${z?"#E2483D":"#E5E0D5"}" stroke-width="3"/>
      <text x="${X(n.x)}" y="${Y(n.y)+9}" text-anchor="middle" font-size="26">${n.ort.e}</text>
      <text x="${X(n.x)}" y="${Y(n.y)+43}" text-anchor="middle" font-size="13" font-weight="700" fill="#1E2A44" paint-order="stroke" stroke="#F6E7D7" stroke-width="4">${esc(n.ort.n)}</text></g>`; }
    else s+=`<circle cx="${X(n.x)}" cy="${Y(n.y)}" r="7" fill="#E5D6C2"/>`; });
  if(o.pos){ const rot=(o.dir||0)*90; s+=`<g transform="translate(${X(o.pos.x)},${Y(o.pos.y)}) rotate(${rot})" class="figur"><circle r="19" fill="#3B4FD8" stroke="#fff" stroke-width="4"/><path d="M0,-13 L10,6 L0,1 L-10,6 Z" fill="#fff"/></g>`; }
  s+=`<g transform="translate(${W-34},36)"><circle r="22" fill="#fff" opacity=".85"/><path d="M0,-17 L7,-5 L-7,-5 Z" fill="#E2483D"/><text y="13" text-anchor="middle" font-size="15" font-weight="800" fill="#1E2A44">N</text></g>`;
  return s+`</svg>`;
}

const PARAM = new URLSearchParams(location.search).get("spiel");
const SPIEL = SPIELE[PARAM] || null;
const MENU_TEXT = "Elf Spiele zu Lektion 12: Stadtplan und Wegbeschreibung, Wechselpräpositionen, Verkehrsmittel mit Dativ, von – nach – zu, Wo? im/am, Imperativ, Bahnhof und ein Stadtporträt. Jedes Spiel bringt Punkte für deine Monatswertung.";

/* 1 · Stadt-Navi */
function spielNavi(area, finish){
  const ZEIT=180, ZIEL=4; const plan=neuerPlan();
  const mitOrt=plan.knoten.filter(n=>n.ort);
  let start=mitOrt[rnd(mitOrt.length)]; let pos={x:start.x,y:start.y}, dir=0, ziel=null, schritte=0, optimal=0, geschafft=0, bonus=0, richtig=0, spur=[], locked=false, fragen=[], fi=0, hinweise=[];
  function neuesZiel(){ const kand=mitOrt.filter(n=>(n.x!==pos.x||n.y!==pos.y) && Math.abs(n.x-pos.x)+Math.abs(n.y-pos.y)>=2);
    const z=kand[rnd(kand.length)]; ziel={x:z.x,y:z.y,ort:z.ort}; schritte=0; optimal=kuerzester(plan,pos,dir,ziel); spur=[{...pos}];
    fragen=zielFragen(plan,z); fi=0; hinweise=[]; }
  area.innerHTML = hud(`<span class="pill">🎯<b id="nv-ok">0</b></span><span class="pill">✓<b id="nv-r">0</b></span><span class="pill">⭐<b id="nv-bonus">0</b></span><div class="grow timer" id="nv-timer"><i style="width:100%"></i></div><span class="pill"><b id="nv-sec">${ZEIT}</b></span>`)
    + `<div class="stage"><div class="flash"></div><div id="nv-oben"></div><div id="nv-plan"></div><div id="nv-unten"></div><div class="tip" id="nv-tip"></div></div>`;
  const steuer=`<div class="steuer"><button class="sbtn" data-b="l">⬅️<span>Geh links!</span></button><button class="sbtn" data-b="g">⬆️<span>Geh geradeaus!</span></button><button class="sbtn" data-b="r">➡️<span>Geh rechts!</span></button></div>
       <div style="text-align:center"><button class="sbtn klein" data-b="z">↩️ <span>Dreh um und geh zurück!</span></button></div>`;
  function mal(){
    const fragt = fi<fragen.length;
    $("#nv-plan").innerHTML=planSVG(plan,{pos,dir,ziel:fragt?null:ziel,spur});
    const hw=hinweise.length?`<div class="hinweise">${hinweise.map(h=>`<div>✓ ${esc(h)}</div>`).join("")}</div>`:"";
    if(fragt){ const f=fragen[fi];
      $("#nv-oben").innerHTML=`<div class="frage-kopf">❓ Frage ${fi+1} von ${fragen.length} · ${esc(f.frage)}</div>${hw}`;
      $("#nv-unten").innerHTML=`<div class="prompt" style="margin:4px 0 10px"><span class="hint" style="font-weight:800">${esc(f.hint)}</span><span class="big" style="font-size:clamp(22px,5.8vw,30px)">${esc(f.satz).replace("___",'<span class="gap">&nbsp;</span>')}</span>${f.karte?`<span class="hint">über = auf der Karte darüber · unter = darunter</span>`:""}</div>
        <div class="opts" id="nv-opts">${f.o.map(o=>`<button class="opt" data-v="${esc(o)}" style="font-size:22px">${esc(o)}</button>`).join("")}</div>`; }
    else { $("#nv-oben").innerHTML=`<div class="ziel-zeile">Geh ${zuForm(ziel.ort)} <b>${esc(ziel.ort.n)}</b> ${ziel.ort.e} <span class="muted">· Schritte: ${schritte}</span></div>${hw}`;
      if(!$("#nv-unten .steuer")) $("#nv-unten").innerHTML=steuer; }
  }
  area.addEventListener("click", e=>{
    const o=e.target.closest("#nv-opts .opt");
    if(o && !locked){ const f=fragen[fi]; const ok=o.dataset.v===f.ok; locked=true; const tip=$("#nv-tip");
      o.classList.add(ok?"right":"wrong"); if(!ok){ const c=[...area.querySelectorAll("#nv-opts .opt")].find(x=>x.dataset.v===f.ok); if(c) c.classList.add("right"); }
      if(ok){ richtig++; $("#nv-r").textContent=richtig; } tip.className="tip "+(ok?"ok":"bad"); tip.textContent=ok?"Richtig!":f.fertig; flash(area.querySelector(".stage"), ok);
      setTimeout(()=>{ hinweise.push(f.fertig); fi++; locked=false; tip.textContent=""; mal(); }, ok?700:1900); return; }
    const b=e.target.closest(".sbtn"); if(!b||locked||fi<fragen.length) return;
    const s=gehe(plan,pos,dir,b.dataset.b); const tip=$("#nv-tip");
    if(!s){ tip.className="tip bad"; tip.textContent="Stopp! Da ist keine Straße."; const st=area.querySelector(".stage"); st.classList.add("shake"); setTimeout(()=>st.classList.remove("shake"),260); return; }
    pos=s.pos; dir=s.dir; schritte++; spur.push({...pos}); tip.className="tip"; tip.textContent="";
    if(pos.x===ziel.x&&pos.y===ziel.y){ geschafft++; locked=true; const extra = schritte<=optimal ? 1 : 0; bonus+=extra;
      $("#nv-ok").textContent=geschafft; $("#nv-bonus").textContent=bonus; mal();
      tip.className="tip ok"; tip.textContent=`✓ Super! Du bist jetzt ${woWP(ziel.ort)}.${extra?" Kürzester Weg! ⭐":""}`; flash(area.querySelector(".stage"), true);
      setTimeout(()=>{ neuesZiel(); $("#nv-unten").innerHTML=""; mal(); locked=false; tip.textContent=""; }, 1600); return; }
    mal();
  });
  neuesZiel(); mal();
  makeTimer(ZEIT, (sec,frac)=>{ const t=$("#nv-timer"); if(!t) return; t.firstElementChild.style.width=(frac*100)+"%"; t.classList.toggle("low", sec<15); $("#nv-sec").textContent=Math.ceil(sec); },
    ()=>{ locked=true; finish(Math.min(1,(geschafft*2+richtig+bonus*0.5)/(ZIEL*2+ZIEL*3)), `${geschafft} Ziele, ${richtig} Fragen richtig, ${bonus}× kürzester Weg`); });
}

/* 2 · Wegbeschreibung */
function wegText(befehle){
  const teile=befehle.map((b,i)=>{ const dann = i===0 ? "" : ["Dann ","Danach ",""][i%3];
    const w = b==="g" ? "geh geradeaus" : b==="l" ? (i>0&&rnd(2)?"geh an der Kreuzung links":"geh links") : (i>0&&rnd(2)?"geh an der Kreuzung rechts":"geh rechts");
    const satz = dann ? dann+w : w; return satz.charAt(0).toUpperCase()+satz.slice(1)+"."; });
  return teile.join(" ");
}
function spielWeg(area, finish){
  const RUNDEN=8; const plan=neuerPlan(); const mitOrt=plan.knoten.filter(n=>n.ort);
  const runden=[];
  let guard=0; while(runden.length<RUNDEN && guard++<500){
    const st=mitOrt[rnd(mitOrt.length)]; let pos={x:st.x,y:st.y}, dir=rnd(4); const d0=dir; const n=2+rnd(3); const bef=[]; const spur=[{...pos}]; let ok=true;
    for(let i=0;i<n;i++){ const opts=shuffle(["g","g","l","r"]); let s=null, b=null; for(const o of opts){ const t=gehe(plan,pos,dir,o); if(t && !spur.some(p=>p.x===t.pos.x&&p.y===t.pos.y)){ s=t; b=o; break; } } if(!s){ ok=false; break; } bef.push(b); pos=s.pos; dir=s.dir; spur.push({...pos}); }
    const end=plan.an(pos.x,pos.y); if(!ok||!end.ort||end===st) continue;
    runden.push({start:st, dir:d0, bef, spur, ende:end}); }
  let n=0, richtig=0, locked=false;
  area.innerHTML = hud(`<span class="pill">Weg<b id="wg-n">1</b>/${runden.length}</span><span class="grow"></span><span class="pill">✓<b id="wg-ok">0</b></span>`)
    + `<div class="stage"><div class="flash"></div><div id="wg-plan"></div><div class="tbox" id="wg-text"></div><div class="prompt" style="margin:6px 0 10px"><span class="big" style="font-size:clamp(24px,6vw,32px)">Wo bist du jetzt?</span></div><div class="opts" id="wg-opts"></div><div class="tip" id="wg-tip"></div><div id="wg-next"></div></div>`;
  function show(){ const r=runden[n]; locked=false; $("#wg-n").textContent=n+1;
    $("#wg-plan").innerHTML=planSVG(plan,{pos:r.start, dir:r.dir});
    $("#wg-text").innerHTML=`<b>📍 Du bist ${esc(woSatz(r.start.ort))} und schaust ${PFEIL[r.dir]}.</b><p>${esc(wegText(r.bef))}</p><small>Jeder Satz = bis zur nächsten Kreuzung.</small>`;
    const nah=mitOrt.filter(k=>k!==r.ende && k!==r.start).sort((a,b)=>(Math.abs(a.x-r.ende.x)+Math.abs(a.y-r.ende.y))-(Math.abs(b.x-r.ende.x)+Math.abs(b.y-r.ende.y))).slice(0,4);
    const falsch=shuffle(nah).slice(0,2);
    $("#wg-opts").innerHTML=shuffle([r.ende,...falsch]).map(k=>`<button class="opt txt" data-v="${k.ort.id}">${k.ort.e} Ich bin ${esc(woSatz(k.ort))}.</button>`).join("");
    $("#wg-tip").textContent=""; $("#wg-tip").className="tip"; $("#wg-next").innerHTML=""; }
  $("#wg-opts").addEventListener("click", e=>{ const b=e.target.closest(".opt"); if(!b||locked) return; locked=true; const r=runden[n];
    const ok=b.dataset.v===r.ende.ort.id; if(ok) richtig++; $("#wg-ok").textContent=richtig;
    b.classList.add(ok?"right":"wrong"); if(!ok){ const c=$("#wg-opts").querySelector(`[data-v="${r.ende.ort.id}"]`); if(c) c.classList.add("right"); }
    $("#wg-plan").innerHTML=planSVG(plan,{pos:r.spur[r.spur.length-1], dir:null, spur:r.spur, ziel:r.ende});
    const t=$("#wg-tip"); t.className="tip "+(ok?"ok":"bad"); t.textContent=ok?`Richtig! Du bist ${woSatz(r.ende.ort)}.`:`Schau den Weg an: Du bist ${woSatz(r.ende.ort)}.`;
    flash(area.querySelector(".stage"), ok);
    $("#wg-next").innerHTML=`<button class="btn wide" type="button" style="margin-top:10px">Weiter ›</button>`;
    $("#wg-next button").onclick=()=>{ n++; if(n<runden.length) show(); else finish(richtig/runden.length, `${richtig} von ${runden.length} Wegen richtig`); }; });
  show();
}

/* 3 · Verkehrs-Blitz: mit + Dativ */
function spielMit(area, finish){
  sprint(area, {seconds:45, target:14, cols:"three", badDelay:1700,
    next:ohneWiederholung(()=>{
      if(rnd(9)===0){ const ok="zu Fuß"; return {key:"fuss", ok, cols:"", tip:"Ohne Verkehrsmittel: Ich gehe zu Fuß.",
        prompt:`<span class="emo pop">🚶</span><span class="big pop" style="font-size:clamp(23px,6vw,32px)">Ich gehe <span class="gap">&nbsp;</span>.</span>`,
        options:shuffle(["zu Fuß","mit dem Fuß","mit Fuß"]).map(x=>({v:x,label:esc(x),cls:"txt"}))}; }
      const v=VERKEHR[rnd(VERKEHR.length)], [wer,verb]=MIT_PERSONEN[rnd(MIT_PERSONEN.length)];
      const ok = v.g==="f"?"der":v.g==="p"?"den":"dem";
      const FR=["Fährst du","Fahrt ihr","Fährt Lina","Fahren Sie"]; const frage = rnd(3)===0;
      const satz = frage ? `${FR[rnd(FR.length)]} mit <span class="gap">&nbsp;</span> ${esc(v.n)}?` : `${esc(wer)} ${esc(verb)} mit <span class="gap">&nbsp;</span> ${esc(v.n)}.`;
      const nom = v.nom || `${artNom(v.g)} ${v.n}`;
      return {key:v.n+wer, ok, tip:`${nom} → mit ${ok} ${v.n}`,
        prompt:`<span class="emo pop">${v.e}</span><span class="big pop" style="font-size:clamp(23px,6vw,32px)">${satz}</span><span class="hint">(${esc(nom)})</span>`,
        options:shuffle(["dem","der","den"]).map(x=>({v:x,label:esc(x)}))};
    })
  }, finish);
}

/* 4 · Woher? Wohin? */
function spielWohin(area, finish){
  sprint(area, {seconds:60, target:14, cols:"three", badDelay:1800,
    next:ohneWiederholung(()=>{
      const art=rnd(6);
      if(art===0){ const s=STAEDTE[rnd(STAEDTE.length)];
        return {key:"nach"+s, ok:"nach", tip:`Städte und Länder: nach ${s}`,
          prompt:`<span class="hint">Wohin?</span><span class="big pop" style="font-size:clamp(23px,6vw,32px)">Wir fahren <span class="gap">&nbsp;</span> ${esc(s)}.</span>`,
          options:shuffle(["nach","zum","zur"]).map(x=>({v:x,label:esc(x)}))}; }
      if(art===1){ const s=STAEDTE[rnd(STAEDTE.length)];
        return {key:"von"+s, ok:"von", tip:`Woher? von ${s}`,
          prompt:`<span class="hint">Woher?</span><span class="big pop" style="font-size:clamp(23px,6vw,32px)">Der Zug kommt <span class="gap">&nbsp;</span> ${esc(s)}.</span>`,
          options:shuffle(["von","vom","nach"]).map(x=>({v:x,label:esc(x)}))}; }
      if(art===2){ return {key:"hause", ok:"nach", tip:"Merke: nach Hause (wohin?) – zu Hause (wo?)",
          prompt:`<span class="emo pop">🏠</span><span class="hint">Wohin?</span><span class="big pop" style="font-size:clamp(23px,6vw,32px)">Ich gehe jetzt <span class="gap">&nbsp;</span> Hause.</span>`,
          options:shuffle(["nach","zum","zur"]).map(x=>({v:x,label:esc(x)}))}; }
      const z=ZIELE[rnd(ZIELE.length)];
      if(art<=4){ const ok=z.g==="f"?"zur":"zum";
        return {key:"zu"+z.n, ok, tip:`${artNom(z.g)} ${z.n} → ${ok} ${z.n}`,
          prompt:`<span class="hint">Wohin?</span><span class="big pop" style="font-size:clamp(23px,6vw,32px)">Ich gehe <span class="gap">&nbsp;</span> ${esc(z.n)}.</span><span class="hint">(${artNom(z.g)} ${esc(z.n)})</span>`,
          options:shuffle(["zum","zur","nach"]).map(x=>({v:x,label:esc(x)}))}; }
      const ok=z.g==="f"?"von der":"vom";
      return {key:"von"+z.n, ok, tip:`${artNom(z.g)} ${z.n} → ${ok} ${z.n}`,
        prompt:`<span class="hint">Woher?</span><span class="big pop" style="font-size:clamp(23px,6vw,32px)">Ich komme gerade <span class="gap">&nbsp;</span> ${esc(z.n)}.</span><span class="hint">(${artNom(z.g)} ${esc(z.n)})</span>`,
        options:shuffle(["vom","von der","zum"]).map(x=>({v:x,label:esc(x)}))};
    })
  }, finish);
}

/* 5 · Wo bist du? */
function spielWo(area, finish){
  const extra=[{n:"Bus", g:"m", e:"🚌", p:"in"}, {n:"Zug", g:"m", e:"🚆", p:"in"}, {n:"U-Bahn", g:"f", e:"🚇", p:"in"}, {n:"Wohnung", g:"f", e:"🏠", p:"in"}, {n:"Kreuzung", g:"f", e:"✚", p:"an"}, {n:"Fluss", g:"m", e:"🏞️", p:"an"}, {n:"Meer", g:"n", e:"🌊", p:"an"}, {n:"Eingang", g:"m", e:"🚪", p:"an"}];
  const alle=ORTE.concat(extra);
  const saetze=["Ich bin ___.","Wir warten ___.","Treffen wir uns ___?","Lina ist gerade ___.","Ich sitze ___."];
  sprint(area, {seconds:45, target:14, cols:"three", badDelay:1700,
    next:ohneWiederholung(()=>{
      const o=alle[rnd(alle.length)]; const ok=woForm(o);
      const opts = o.p==="in" ? ["im","in der","in den"] : ["am","an der","an den"];
      const s=saetze[rnd(saetze.length)].replace("___", `<span class="gap">&nbsp;</span> ${esc(o.n)}`);
      return {key:o.n, ok, tip:`${artNom(o.g)} ${o.n} → ${ok} ${o.n}`,
        prompt:`<span class="emo pop">${o.e}</span><span class="hint">Wo? (${o.p})</span><span class="big pop" style="font-size:clamp(23px,6vw,32px)">${s}</span><span class="hint">(${artNom(o.g)} ${esc(o.n)})</span>`,
        options:shuffle(opts).map(x=>({v:x,label:esc(x)}))};
    })
  }, finish);
}

/* 6 · Imperativ */
function spielImperativ(area, finish){
  let pool=shuffle(IMPERATIV), i=0;
  sprint(area, {seconds:60, target:10, okDelay:450, badDelay:2000,
    next:()=>{ if(i>=pool.length){ pool=shuffle(IMPERATIV); i=0; } const x=pool[i++];
      return {key:x.du, ok:x.o[0], tip:x.tip,
        prompt:`<span class="emo pop">📣</span><span class="big pop" style="font-size:clamp(22px,5.8vw,30px)">${esc(x.du)}</span><span class="hint">Sag es als Aufforderung!</span>`,
        options:shuffle(x.o.slice()).map(o=>({v:o,label:esc(o),cls:"txt"}))}; }
  }, finish);
}

function spielRaetsel(area, finish){
  let pool=shuffle(RAETSEL), i=0;

    next:()=>{ if(i>=pool.length){ pool=shuffle(RAETSEL); i=0; } const x=pool[i++];

        prompt:`<span class="big pop" style="font-size:clamp(22px,5.8vw,30px)">${esc(x.q)}</span>`,
        options:shuffle([x.a,...falsch]).map(o=>({v:o,label:esc(o),cls:"txt"}))}; }
  }, finish);
}

/* 8 · Am Bahnhof */
function spielBahnhof(area, finish){
  quiz(area, {
    list:BAHNHOF_FRAGEN.slice(), unit:"Frage", weiter:true, okDelay:1000,
    topFor:(it)=> it.t==="karte" ? `<div class="teil">Teil 1 · Die Fahrkarte</div>${FAHRKARTE}`
      : `<div class="teil">Teil 2 · Durchsage am Bahnhof</div><div class="durchsage">📢 ${esc(DURCHSAGEN.find(d=>d.id===it.t).text)}</div>`,
    prompt:(it)=>`<span class="big" style="font-size:clamp(21px,5.6vw,28px)">${esc(it.q)}</span>`,
    cols:()=>"",
    options:(it)=>shuffle(it.o.slice()).map(o=>({v:o,label:esc(o),cls:"txt"})),
    check:(it,v)=>v===it.o[0],
    feedback:(it,ok)=> ok ? "Richtig!" : it.o[0]
  }, finish);
}

/* 9 · Satz-Kette */
function spielKette(area, finish){
  bauen(area, KETTE, (it)=> it.p==="!" ? "Aufforderung: Das Verb steht ganz vorne – ohne du."
      : it.p==="?" && !/^(wie|wo|wohin|woher)$/i.test(it.w[0]) ? "Ja/Nein-Frage: Das Verb steht ganz vorne."
      : "Das Verb steht auf Position 2. Dann: Wie? – Woher? – Wohin?", finish);

/* ==========================================================
   WECHSELPRÄPOSITIONEN – Wo? (Dativ) · Wohin? (Akkusativ)
   ========================================================== */
const WP = {bahnhof:"in", rathaus:"in", dom:"in", cafe:"in", kino:"in", museum:"in", apotheke:"in", bank:"in", post:"in", supermarkt:"in", park:"in", schule:"in", hafen:"an", haltestelle:"an", markt:"auf", reise:"in"};
const DAT_ART={m:"dem", f:"der", n:"dem"}, AKK_ART={m:"den", f:"die", n:"das"};
function datForm(prep,g){ const a=DAT_ART[g]; if(a==="dem" && prep==="in") return "im"; if(a==="dem" && prep==="an") return "am"; return `${prep} ${a}`; }
function akkForm(prep,g){ const a=AKK_ART[g]; if(a==="das" && prep==="in") return "ins"; if(a==="das" && prep==="an") return "ans"; return `${prep} ${a}`; }
const andereG = g => g==="f" ? "m" : "f";
function optsDat(prep,g){ return [...new Set([datForm(prep,g), akkForm(prep,g), datForm(prep,andereG(g))])]; }
function optsAkk(prep,g){ return [...new Set([akkForm(prep,g), datForm(prep,g), akkForm(prep,andereG(g))])]; }
const nameMitArt = o => `${artNom(o.g)} ${o.n}`;

/* Drei Fragen zum Ziel: zwei Hinweise „Wo liegt es?“ (Dativ) + „Wohin gehen wir?“ (Akkusativ) */
function zielFragen(plan, z){
  const at=(x,y)=>{ const k=plan.an(x,y); return k&&k.ort ? k.ort : null; };
  const H=[];
  const l=at(z.x-1,z.y), r=at(z.x+1,z.y), o=at(z.x,z.y-1), u=at(z.x,z.y+1);
  if(l&&r) H.push({prep:"zwischen", a:l, b:r});
  if(o&&u) H.push({prep:"zwischen", a:o, b:u});
  [l,r].filter(Boolean).forEach(x=>H.push({prep:"neben", a:x}));
  if(u) H.push({prep:"über", a:u});
  if(o) H.push({prep:"unter", a:o});
  const gewaehlt=[]; const zw=H.find(h=>h.prep==="zwischen"); if(zw) gewaehlt.push(zw);
  shuffle(H).forEach(h=>{ if(gewaehlt.length<2 && !gewaehlt.includes(h) && !gewaehlt.some(g=>g.prep===h.prep || g.a===h.a || g.b===h.a || (h.b&&(g.a===h.b||g.b===h.b)))) gewaehlt.push(h); });
  const fragen=gewaehlt.slice(0,2).map((h,i)=>{
    const zweit = h.b ? ` und ${DAT_ART[h.b.g]} ${h.b.n}` : "";
    const ok=datForm(h.prep,h.a.g);
    return {art:"wo", nr:i+1, frage:`Hinweis ${i+1}: Wo liegt euer Ziel?`, satz:`Es liegt ___ ${h.a.n}${zweit}.`, hint:`Wo? → Dativ · (${nameMitArt(h.a)})`, ok, o:shuffle(optsDat(h.prep,h.a.g)),
      fertig:`Es liegt ${ok} ${h.a.n}${zweit}.`, karte:h.prep==="über"||h.prep==="unter"};
  });
  const wp=WP[z.ort.id]||"in"; const ok=akkForm(wp,z.ort.g);
  fragen.push({art:"wohin", nr:fragen.length+1, frage:`Wohin geht ihr? Das Ziel ist ${nameMitArt(z.ort)} ${z.ort.e}`, satz:`Wir gehen ___ ${z.ort.n}.`, hint:`Wohin? → Akkusativ`, ok, o:shuffle(optsAkk(wp,z.ort.g)),
    fertig:`Wir gehen ${ok} ${z.ort.n}.`});
  return fragen;
}
const woWP = o => `${datForm(WP[o.id]||"in", o.g)} ${o.n}`;

function spielWechsel(area, finish){
  sprint(area, {seconds:60, target:14, cols:"three", badDelay:2000,
    next:ohneWiederholung(()=>{
      const x=WECHSEL[rnd(WECHSEL.length)], wohin=rnd(2)===0;
      const ok = wohin ? akkForm(x.p,x.g) : datForm(x.p,x.g);
      const opts = wohin ? optsAkk(x.p,x.g) : optsDat(x.p,x.g);
      const satz = (wohin?x.akk:x.dat);
      return {key:x.n+wohin, ok, tip:`${wohin?"Wohin? → Akkusativ":"Wo? → Dativ"}: ${satz.replace("___",ok)}`,
        prompt:`<span class="emo pop">${x.e}</span><span class="hint" style="font-weight:800;color:${wohin?"#E2483D":"#3B4FD8"}">${wohin?"➡️ Wohin? (Akkusativ)":"📍 Wo? (Dativ)"} · ${esc(x.p)} · ${artNom(x.g)} ${esc(x.n)}</span><span class="big pop" style="font-size:clamp(22px,5.8vw,30px)">${esc(satz).replace("___",'<span class="gap">&nbsp;</span>')}</span>`,
        options:shuffle(opts).map(o=>({v:o,label:esc(o)}))};
    })
  }, finish);
}

/* ---------- Bausteine ---------- */
function hud(extra){ return `<div class="hud">${extra}</div>`; }
function makeTimer(seconds, onTick, onEnd){
  const t0=Date.now(); let stopped=false;
  const id=setInterval(()=>{ const left=Math.max(0, seconds*1000-(Date.now()-t0)); onTick(left/1000, left/(seconds*1000)); if(left<=0){ clearInterval(id); if(!stopped){ stopped=true; onEnd(); } } },100);
  const stop=()=>{ stopped=true; clearInterval(id); }; onCleanup(stop); return stop;
}
function flash(stage, ok){ const f=stage&&stage.querySelector(".flash"); if(!f) return; f.className="flash "+(ok?"ok":"bad"); setTimeout(()=>f.className="flash",220); }
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);

/* Allgemeiner Fragen-Ablauf */
function quiz(area, cfg, finish){
  const list=cfg.list; let n=0, richtig=0, locked=false;
  area.innerHTML = hud(`<span class="pill">${cfg.unit||"Frage"}<b id="q-n">1</b>/${list.length}</span><span class="grow"></span><span class="pill">✓<b id="q-ok">0</b></span>`)
    + `<div class="stage"><div class="flash"></div><div id="q-top"></div><div class="prompt" id="q-prompt"></div><div class="opts" id="q-opts"></div><div class="tip" id="q-tip"></div><div id="q-next"></div></div>`;
  if(cfg.init) cfg.init(area);
  function show(){
    const it=list[n];
    $("#q-n").textContent=n+1;
    if(cfg.topFor) $("#q-top").innerHTML=cfg.topFor(it,n);
    $("#q-prompt").innerHTML=cfg.prompt(it,n);
    const box=$("#q-opts"); box.className="opts "+(cfg.cols?cfg.cols(it):"");
    box.innerHTML=cfg.options(it).map(o=>`<button class="opt ${o.cls||""}" data-v="${esc(o.v)}">${o.label}</button>`).join("");
    const t=$("#q-tip"); t.textContent=""; t.className="tip"; $("#q-next").innerHTML="";
    if(cfg.afterShow) cfg.afterShow(it,n,area);
    locked=false;
  }
  function next(){ n++; if(n<list.length) show(); else finish(richtig/list.length, `${richtig} von ${list.length} richtig`); }
  $("#q-opts").addEventListener("click", e=>{
    const b=e.target.closest(".opt"); if(!b||locked) return; locked=true;
    const it=list[n]; const ok=cfg.check(it, b.dataset.v);
    b.classList.add(ok?"right":"wrong");
    if(!ok){ const c=[...$("#q-opts").querySelectorAll(".opt")].find(x=>cfg.check(it,x.dataset.v)); if(c) c.classList.add("right"); }
    if(ok) richtig++; $("#q-ok").textContent=richtig;
    const t=$("#q-tip"); t.className="tip "+(ok?"ok":"bad"); t.textContent=cfg.feedback?cfg.feedback(it,ok):(ok?"Richtig!":"");
    flash(area.querySelector(".stage"), ok);
    if(cfg.weiter && !ok){ $("#q-next").innerHTML=`<button class="btn wide" type="button" style="margin-top:10px">Weiter ›</button>`; $("#q-next button").onclick=next; }
    else setTimeout(next, ok?(cfg.okDelay||800):(cfg.badDelay||1900));
  });
  show();
}

function sprint(area, cfg, finish){
  const ZEIT=cfg.seconds, ZIEL=cfg.target, STRAFE=cfg.penalty ?? 0.5;
  let richtig=0, falsch=0, serie=0, best=0, locked=false, cur=null;
  area.innerHTML = hud(`<span class="pill">✓<b id="sp-ok">0</b></span><span class="pill">🔥<b id="sp-serie">0</b></span><div class="grow timer" id="sp-timer"><i style="width:100%"></i></div><span class="pill"><b id="sp-sec">${ZEIT}</b></span>`)
    + `<div class="stage"><div class="flash"></div><div class="prompt" id="sp-prompt"></div><div class="opts" id="sp-opts"></div><div class="tip" id="sp-tip"></div></div>`;
  function neu(){
    cur=cfg.next();
    $("#sp-prompt").innerHTML=cur.prompt;
    const box=$("#sp-opts"); box.className="opts "+(cur.cols||cfg.cols||"");
    box.innerHTML=cur.options.map(o=>`<button class="opt ${o.cls||""}" data-v="${esc(o.v)}">${o.label}</button>`).join("");
    locked=false;
  }
  $("#sp-opts").addEventListener("click", e=>{
    const b=e.target.closest(".opt"); if(!b||locked) return; locked=true;
    const ok=b.dataset.v===cur.ok; const tip=$("#sp-tip");
    if(ok){ richtig++; serie++; best=Math.max(best,serie); b.classList.add("right"); }
    else { falsch++; serie=0; b.classList.add("wrong"); const c=[...$("#sp-opts").querySelectorAll(".opt")].find(x=>x.dataset.v===cur.ok); if(c) c.classList.add("right");
      const st=area.querySelector(".stage"); st.classList.add("shake"); setTimeout(()=>st.classList.remove("shake"),260); }
    tip.className="tip "+(ok?"ok":"bad"); tip.textContent = ok && serie>=5 ? `${serie}er-Serie! 🔥` : (cur.tip||"");
    flash(area.querySelector(".stage"), ok);
    $("#sp-ok").textContent=richtig; $("#sp-serie").textContent=serie;
    setTimeout(neu, ok?(cfg.okDelay||320):(cfg.badDelay||1100));
  });
  neu();
  makeTimer(ZEIT, (sec, frac)=>{ const t=$("#sp-timer"); if(!t) return; t.firstElementChild.style.width=(frac*100)+"%"; t.classList.toggle("low", sec<10); $("#sp-sec").textContent=Math.ceil(sec); },
    ()=>{ locked=true; finish(Math.min(1, Math.max(0, richtig-falsch*STRAFE)/ZIEL), `${richtig} richtig, ${falsch} falsch, beste Serie: ${best}`); });
}
function ohneWiederholung(fn){ let last=null; return ()=>{ let x, k=0; do{ x=fn(); k++; }while(x.key===last && k<10); last=x.key; return x; }; }

/* Körbe-Ablauf (gegen die Zeit) */
function koerbe(area, cfg, finish){
  const ZIEL=cfg.target, ZEIT=cfg.seconds;
  let richtig=0, falsch=0, locked=false, cur=null, order=shuffle(cfg.items), i=0;
  area.innerHTML = hud(`<span class="pill">✓<b id="kb-ok">0</b></span><span class="pill">✗<b id="kb-bad">0</b></span><div class="grow timer" id="kb-timer"><i style="width:100%"></i></div><span class="pill"><b id="kb-sec">${ZEIT}</b></span>`)
    + `<div class="stage"><div class="flash"></div><div class="prompt" id="kb-prompt" style="margin-bottom:12px"></div>
       <div class="rooms" id="kb-box">${cfg.groups.map(g=>`<button class="room" data-k="${esc(g.k)}"><small>${esc(g.sub)}</small>${esc(g.name)}</button>`).join("")}</div>
       <div class="tip" id="kb-tip"></div></div>`;
  function neu(){
    if(i>=order.length){ order=shuffle(cfg.items); i=0; }
    cur=order[i++];
    $("#kb-prompt").innerHTML=cfg.prompt(cur);
    area.querySelectorAll(".room").forEach(b=>b.classList.remove("right","wrong"));
    locked=false;
  }
  $("#kb-box").addEventListener("click", e=>{
    const b=e.target.closest(".room"); if(!b||locked) return; locked=true;
    const ziel=cfg.answer(cur);
    const ok=b.dataset.k===ziel;
    if(ok) richtig++; else { falsch++; area.querySelector(`.room[data-k="${ziel}"]`).classList.add("right"); }
    b.classList.add(ok?"right":"wrong");
    const tip=$("#kb-tip"); tip.className="tip "+(ok?"ok":"bad"); tip.textContent=cfg.feedback(cur);
    flash(area.querySelector(".stage"), ok);
    $("#kb-ok").textContent=richtig; $("#kb-bad").textContent=falsch;
    setTimeout(neu, ok?500:1600);
  });
  neu();
  makeTimer(ZEIT, (sec,frac)=>{ const t=$("#kb-timer"); if(!t) return; t.firstElementChild.style.width=(frac*100)+"%"; t.classList.toggle("low", sec<10); $("#kb-sec").textContent=Math.ceil(sec); },
    ()=>{ locked=true; finish(Math.min(1, Math.max(0, richtig-falsch*0.5)/ZIEL), `${richtig} richtig, ${falsch} falsch`); });
}

/* Sortier-Ablauf */
function ordnen(area, runden, finish){
  let n=0, treffer=0, gesamt=0, chosen=[], karten=[], fertig=false;
  area.innerHTML = hud(`<span class="pill">Runde<b id="o-n">1</b>/${runden.length}</span><span class="grow"></span><span class="pill">✓<b id="o-ok">0</b></span>`)
    + `<div class="stage"><div class="flash"></div><div class="teil" id="o-teil"></div>
       <div class="order" id="o-line"></div><div class="pool cards" id="o-pool"></div>
       <div class="stack" style="grid-template-columns:1fr 2fr;margin-top:6px"><button class="btn ghost" id="o-reset" type="button">Neu legen</button><button class="btn led" id="o-check" type="button" disabled>Prüfen</button></div>
       <div class="tip" id="o-tip"></div></div>`;
  const karte = (it) => `${it.emo?`<i>${it.emo}</i>`:""}${esc(it.t)}`;
  function show(){
    const r=runden[n]; chosen=[]; fertig=false;
    karten=shuffle(r.items.map((it,idx)=>({...it, idx})));
    if(karten.every((k,idx)=>k.idx===idx)) karten.push(karten.shift());
    $("#o-n").textContent=n+1;
    $("#o-teil").textContent=`${r.emo} ${r.titel}${r.hinweis?" – "+r.hinweis:""}`;
    $("#o-tip").textContent=""; $("#o-tip").className="tip";
    area.querySelectorAll(".weiter-btn").forEach(b=>b.remove());
    draw();
  }
  function draw(){
    const r=runden[n];
    $("#o-line").innerHTML=r.items.map((_,k)=>{
      const c=chosen[k];
      return `<div class="slot ${c?"full":""}"><b>${k+1}</b>${c?`<button class="kartex" data-k="${k}">${karte(c)}</button>`:`<span class="leer">…</span>`}</div>`;
    }).join("");
    $("#o-pool").innerHTML=karten.map((c,k)=>`<button class="kartex ${chosen.includes(c)?"used":""}" data-c="${k}">${karte(c)}</button>`).join("");
    $("#o-check").disabled = chosen.length!==r.items.length || fertig;
  }
  area.addEventListener("click", e=>{
    const b=e.target.closest(".kartex"); if(!b||fertig) return;
    if(b.dataset.c!==undefined){ const c=karten[Number(b.dataset.c)]; if(!chosen.includes(c)) chosen.push(c); }
    else if(b.dataset.k!==undefined){ chosen.splice(Number(b.dataset.k),1); }
    draw();
  });
  $("#o-reset").addEventListener("click", ()=>{ if(fertig) return; chosen=[]; draw(); });
  $("#o-check").addEventListener("click", ()=>{
    const r=runden[n]; fertig=true;
    let ok=0; chosen.forEach((c,k)=>{ if(c.idx===k) ok++; });
    treffer+=ok; gesamt+=r.items.length; $("#o-ok").textContent=treffer;
    $("#o-line").innerHTML=chosen.map((c,k)=>`<div class="slot full ${c.idx===k?"ok":"bad"}"><b>${k+1}</b><span class="kartex still">${karte(c)}</span></div>`).join("");
    $("#o-pool").innerHTML="";
    const alles=ok===r.items.length;
    flash(area.querySelector(".stage"), alles);
    const tip=$("#o-tip"); tip.className="tip "+(alles?"ok":"bad");
    tip.innerHTML = alles ? `Alles richtig! +${ok}` : `${ok} von ${r.items.length} richtig. So ist es richtig:<br><span class="loesung">${r.items.map((it,k)=>`${k+1}. ${it.emo?it.emo+" ":""}${esc(it.t)}`).join("<br>")}</span>`;
    $("#o-check").disabled=true;
    const w=document.createElement("button"); w.className="btn wide weiter-btn"; w.type="button"; w.style.marginTop="10px"; w.textContent="Weiter ›";
    w.onclick=()=>{ n++; if(n<runden.length) show(); else finish(treffer/gesamt, `${treffer} von ${gesamt} Karten an der richtigen Stelle`); };
    $("#o-tip").after(w);
    if(alles) setTimeout(()=>{ if(document.body.contains(w)) w.click(); }, 1800);
  });
  show();
}

/* Satz-Baustelle (generisch) */
function bauen(area, LISTE, hinweisFn, finish){
  const list=shuffle(LISTE);
  let n=0, punkte=0, versuch=1, chosen=[], tiles=[];
  const norm=s=>s.toLowerCase().replace(/[.,?!]/g,"").replace(/\s+/g," ").trim();
  const nice=(words,p)=>{ const s=words.join(" "); return s.charAt(0).toUpperCase()+s.slice(1)+p; };
  area.innerHTML = hud(`<span class="pill">Satz<b id="s-n">1</b>/${list.length}</span><span class="grow"></span><span class="pill">Punkte<b id="s-p">0</b></span>`)
    + `<div class="stage"><div class="flash"></div><div class="line" id="s-line"></div><div class="pool" id="s-pool"></div>
       <div class="stack" style="grid-template-columns:1fr 2fr;margin-top:0"><button class="btn ghost" id="s-reset" type="button">Neu legen</button><button class="btn led" id="s-check" type="button" disabled>Prüfen</button></div>
       <div class="tip" id="s-tip"></div></div>`;
  function show(){
    const it=list[n]; chosen=[]; versuch=1;
    tiles=shuffle(it.w.map((w,i)=>({w,i})));
    if(tiles.map(t=>t.w).join(" ")===it.a[0] && tiles.length>2) tiles.push(tiles.shift());
    $("#s-n").textContent=n+1; $("#s-tip").textContent="";
    $("#s-line").className="line";
    draw();
  }
  function draw(){
    const it=list[n];
    $("#s-line").innerHTML=chosen.map((t,k)=>`<button class="tile-w" data-k="${k}">${esc(t.w)}</button>`).join("")+(chosen.length===it.w.length?`<b style="font-size:22px">${it.p}</b>`:"");
    $("#s-pool").innerHTML=tiles.map((t,k)=>`<button class="tile-w ${chosen.includes(t)?"used":""}" data-t="${k}">${esc(t.w)}</button>`).join("");
    $("#s-check").disabled=chosen.length!==it.w.length;
  }
  area.addEventListener("click", e=>{
    const t=e.target.closest(".tile-w"); if(!t) return;
    if($("#s-line").classList.contains("ok")) return;
    $("#s-line").className="line"; 
    if(t.dataset.t!==undefined){ const tile=tiles[Number(t.dataset.t)]; if(!chosen.includes(tile)) chosen.push(tile); }
    else if(t.dataset.k!==undefined){ chosen.splice(Number(t.dataset.k),1); }
    draw();
  });
  $("#s-reset").addEventListener("click", ()=>{ if($("#s-line").classList.contains("ok")) return; chosen=[]; $("#s-line").className="line"; draw(); });
  $("#s-check").addEventListener("click", ()=>{
    const it=list[n]; const words=chosen.map(t=>t.w);
    const ok=it.a.some(a=>norm(a)===norm(words.join(" ")));
    const tip=$("#s-tip"); const stage=area.querySelector(".stage");
    flash(stage, ok);
    if(ok){
      const p=versuch===1?1:0.5; punkte+=p; $("#s-p").textContent=String(punkte).replace(".",",");
      $("#s-line").className="line ok"; tip.className="tip ok"; tip.textContent=`${nice(words,it.p)}  +${String(p).replace(".",",")}`;
      $("#s-check").disabled=true;
      setTimeout(next, 1100);
    } else if(versuch===1){
      versuch=2; $("#s-line").className="line bad"; tip.className="tip bad";
      tip.textContent="Noch nicht. "+hinweisFn(it);
    } else {
      $("#s-line").className="line bad"; tip.className="tip bad"; tip.textContent=`Richtig ist: ${nice(it.a[0].split(" "), it.p)}`;
      $("#s-check").disabled=true;
      setTimeout(next, 2200);
    }
  });
  function next(){ n++; if(n<list.length) show(); else finish(punkte/list.length, `${String(punkte).replace(".",",")} von ${list.length} Punkten`); }
  show();
}

  const screens = ["scr-menu","scr-loading","scr-code","scr-block","scr-start","scr-game","scr-end"];
  let db=null, ctx=null, kennung=null, onReady=null, tOffset=0;

  function show(id){ screens.forEach(s=>{ const el=document.getElementById(s); if(el) el.classList.toggle("hidden", s!==id); }); window.scrollTo(0,0); }
  function block(title, text){ $("#block-title").textContent=title; $("#block-text").textContent=text; $("#block-other").classList.add("hidden"); show("scr-block"); }
  const jetzt = () => Date.now() + tOffset;
  const p2 = n => String(n).padStart(2,"0");
  const monat = ts => { const d=new Date(ts); const m=`${d.getFullYear()}-${p2(d.getMonth()+1)}`; return m<START_MONAT?START_MONAT:m; };
  function getMe(){ try{ const c=JSON.parse(localStorage.getItem(CODE_KEY)||"null"); return c&&c.code?c:null; }catch(e){ return null; } }
  const once = path => db.ref(`${BASE}/${path}`).once("value").then(s=>s.val());
  const zeitlimit = (pr, ms) => Promise.race([pr, sleep(ms).then(()=>{ throw new Error("timeout"); })]);
  const titel = () => (typeof SPIEL!=="undefined" && SPIEL && SPIEL.title) || document.title;

  function practice(){ ctx={practice:true, max:MAX, best:null}; if(onReady) onReady(ctx); }

  async function nachsenden(){
    let w=[]; try{ w=JSON.parse(localStorage.getItem(WS_KEY)||"[]"); }catch(e){}
    if(!w.length) return; const rest=[];
    for(const x of w){ try{ await zeitlimit(db.ref(`${BASE}/log/${x.pid}`).push(Object.assign({}, x.e, {ts:firebase.database.ServerValue.TIMESTAMP})), 8000); }catch(e){ rest.push(x); } }
    try{ localStorage.setItem(WS_KEY, JSON.stringify(rest)); }catch(e){}
  }

  async function check(){
    show("scr-loading");
    if(!db){ block("Keine Verbindung", "Die Lernwelt ist gerade nicht erreichbar. Du kannst aber üben."); return; }
    const me=getMe();
    if(!me){ show("scr-code"); return; }
    try{
      const c = await zeitlimit(once(`codes/${me.code}`), 9000);
      if(!c || !c.pid){ localStorage.removeItem(CODE_KEY); $("#code-err").textContent="Dein gespeicherter Code gilt nicht mehr."; show("scr-code"); return; }
      const name = (await once(`public/names/${c.pid}`).catch(()=>null)) || c.name || me.name || "";
      const me2={code:me.code, pid:c.pid, name};
      localStorage.setItem(CODE_KEY, JSON.stringify(me2));
      if(name){ $("#who").classList.remove("hidden"); $("#who-name").textContent=name; $("#who-color").style.background="var(--led)"; }
      nachsenden();
      let best=null;
      try{ const log=(await zeitlimit(once(`log/${c.pid}`), 8000))||{}; const m=monat(jetzt());
        Object.values(log).forEach(e=>{ if(e && e.key===kennung && monat(Number(e.ts)||0)===m && (best===null || Number(e.p)>best)) best=Number(e.p); }); }catch(e){}
      ctx={practice:false, me:me2, max:MAX, best};
      if(onReady) onReady(ctx);
    }catch(e){ console.warn(e); block("Keine Verbindung", "Die Lernwelt ist gerade nicht erreichbar. Du kannst aber üben – ohne Punkte."); }
  }

  async function senden(points){
    if(!ctx || ctx.practice) return {ok:true, practice:true};
    const p=Math.max(0, Math.min(ctx.max, Math.round(Number(points)||0)));
    const e={code:ctx.me.code, key:kennung, titel:titel(), p, max:ctx.max, t0:Date.now()};
    const vorher=ctx.best; const besser = vorher===null || p>vorher; if(besser) ctx.best=p;
    try{
      await zeitlimit(db.ref(`${BASE}/log/${ctx.me.pid}`).push(Object.assign({}, e, {ts:firebase.database.ServerValue.TIMESTAMP})), 9000);
      return {ok:true, better:besser, points:p, best:ctx.best};
    }catch(err){
      let w=[]; try{ w=JSON.parse(localStorage.getItem(WS_KEY)||"[]"); }catch(x){}
      w.push({pid:ctx.me.pid, e}); try{ localStorage.setItem(WS_KEY, JSON.stringify(w.slice(-50))); }catch(x){}
      return {ok:false, wartet:true, points:p};
    }
  }
  function nachricht(res){
    if(res.practice) return {cls:"", text:"Übungsmodus – diese Punkte zählen nicht."};
    if(res.ok && res.better) return {cls:"ok", text:`✓ ${res.points} Punkte gespeichert – dein Bestwert in diesem Monat!`};
    if(res.ok) return {cls:"ok", text:`✓ Gespeichert. Für den Monat zählt dein Bestwert: ${res.best} Punkte.`};
    if(res.wartet) return {cls:"", text:"Gerade keine Verbindung – die Punkte sind auf deinem Handy gemerkt und werden später gesendet."};
    return {cls:"bad", text:"Die Punkte konnten nicht gespeichert werden. Zeig diese Seite deiner Lehrkraft."};
  }
  function start(key, cb){
    kennung=key; onReady=cb;
    $("#code-form").addEventListener("submit", async e=>{
      e.preventDefault();
      const code=$("#code-in").value.toUpperCase().replace(/[^A-Z0-9]/g,"");
      if(code.length<4){ $("#code-err").textContent="Der Code hat mindestens 4 Zeichen."; return; }
      if(!db){ $("#code-err").textContent="Keine Verbindung."; return; }
      $("#code-err").textContent="Prüfe …";
      try{
        const c=await once(`codes/${code}`);
        if(!c||!c.pid){ $("#code-err").textContent="Diesen Code gibt es nicht. Frag deine Lehrkraft."; return; }
        localStorage.setItem(CODE_KEY, JSON.stringify({code, pid:c.pid, name:c.name||""}));
        $("#code-err").textContent=""; check();
      }catch(err){ $("#code-err").textContent="Keine Verbindung."; }
    });
    document.querySelectorAll("[data-practice]").forEach(b=>b.addEventListener("click", practice));
    $("#block-other").addEventListener("click", ()=>{ localStorage.removeItem(CODE_KEY); $("#who").classList.add("hidden"); $("#code-in").value=""; show("scr-code"); });
    try{ if(window.firebase){ firebase.initializeApp(cfg); db=firebase.database();
      db.ref(".info/serverTimeOffset").on("value", s=>{ tOffset=Number(s.val())||0; }); } }catch(e){ db=null; }
    check();
  }
  return {start, senden, nachricht, show, get ctx(){ return ctx; }};
})();

function spielen(){

    const res=await Liga.senden(punkte);
    const n=Liga.nachricht(res); msg.className="send "+n.cls; msg.textContent=n.text;
    if(res.slow && res.later) res.later.then(r=>{ const m=Liga.nachricht(r); msg.className="send "+m.cls; msg.textContent=m.text; });
  });
}

/* ==========================================================
   NAVI-DUELL AN DER TAFEL (ohne Handys, Teams)
   a1-unterwegs.html?tafel=navi – die Teams sagen die Befehle,
   die Lehrkraft klickt (oder Pfeiltasten: ← links · ↑ geradeaus · → rechts · ↓ zurück)
   ========================================================== */
function tafelNavi(){
  document.documentElement.style.setProperty("--accent","#3B4FD8");
  document.querySelector("main").style.maxWidth="1240px";
  const head=$("#head"); if(head) head.remove();
  ["scr-menu","scr-loading","scr-code","scr-block","scr-start","scr-game","scr-end"].forEach(id=>{ const e=document.getElementById(id); if(e) e.classList.add("hidden"); });
  const box=document.createElement("section"); document.querySelector("main").appendChild(box);
  let teams=[{n:"Team A",p:0},{n:"Team B",p:0}], aktiv=0, runde=1, plan=null, pos=null, dir=0, ziel=null, optimal=0, schritte=0, spur=[], fertig=false, abstand=4, gesagt=[];
  let fragen=[], fi=0, hinweise=[], antwort=null, rundePunkte=0, msg="", msgCls="";
  const FARBEN=["#3B4FD8","#E2483D","#14A37F","#E9800E"];
  function setup(){
    box.innerHTML=`<div class="card"><h2>🧭 Navi-Duell</h2><p>Ohne Handys. Jede Runde spielt ein Team:</p>
      <ol style="margin:0 0 10px;padding-left:22px;font-size:18px;line-height:1.6">
        <li><b>3 Fragen</b> beantworten: Wo liegt das Ziel? (Dativ: <i>zwischen dem Kino und der Post</i>) und Wohin geht ihr? (Akkusativ: <i>in die Apotheke</i>). Jede richtige Antwort = 1 Punkt.</li>
        <li>Die Figur <b>mit Befehlen auf Deutsch</b> zum Ziel führen: „Geh links!“ – du klickst. Kürzester Weg = 3 Punkte · bis 2 Schritte mehr = 2 · sonst 1.</li></ol>
      <p><b>Eine Person pro Team spricht</b> – jede Runde eine andere. Pfeiltasten: ← links · ↑ geradeaus · → rechts · ↓ umdrehen. Tasten 1/2/3 = Antwort A/B/C.</p>
      <div class="stack" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">${teams.map((t,i)=>`<input class="tname" data-i="${i}" value="${esc(t.n)}" style="min-height:48px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:18px;border-left:8px solid ${FARBEN[i]}">`).join("")}</div>
      <div class="stack" style="grid-template-columns:repeat(3,1fr)"><button class="btn ghost" id="t-minus" ${teams.length<=2?"disabled":""}>– Team</button><button class="btn ghost" id="t-plus" ${teams.length>=4?"disabled":""}>+ Team</button><button class="btn led" id="t-los">▶ Los geht’s</button></div></div>`;
    box.querySelectorAll(".tname").forEach(i=>i.oninput=()=>teams[+i.dataset.i].n=i.value.trim()||("Team "+"ABCD"[+i.dataset.i]));
    $("#t-minus").onclick=()=>{ teams.pop(); setup(); }; $("#t-plus").onclick=()=>{ teams.push({n:"Team "+"ABCD"[teams.length],p:0}); setup(); };
    $("#t-los").onclick=()=>{ plan=neuerPlan(); neueRunde(); };
  }
  function neueRunde(){
    const mitOrt=plan.knoten.filter(n=>n.ort); let guard=0, zk=null;
    do{ const s=mitOrt[rnd(mitOrt.length)]; zk=mitOrt[rnd(mitOrt.length)]; pos={x:s.x,y:s.y}; dir=rnd(4); ziel={x:zk.x,y:zk.y,ort:zk.ort}; optimal=kuerzester(plan,pos,dir,ziel); }
    while((optimal!==abstand || (pos.x===ziel.x&&pos.y===ziel.y) || zielFragen(plan,zk).length<3) && guard++<600);
    fragen=zielFragen(plan,zk); fi=0; hinweise=[]; antwort=null; rundePunkte=0;
    schritte=0; spur=[{...pos}]; fertig=false; gesagt=[]; msg=""; msgCls=""; mal();
  }
  function mal(){
    const t=teams[aktiv], fragt=fi<fragen.length;
    let rechts=`<div class="card" style="border-left:10px solid ${FARBEN[aktiv]}"><div class="muted" style="font-weight:700">Runde ${runde} · jetzt spielt</div><h2 style="font-size:44px;color:${FARBEN[aktiv]}">${esc(t.n)}</h2>`;
    if(hinweise.length) rechts+=`<div class="hinweise" style="font-size:19px">${hinweise.map(h=>`<div>✓ ${esc(h)}</div>`).join("")}</div>`;
    if(fragt){ const f=fragen[fi];
      rechts+=`<div class="frage-kopf" style="font-size:20px">❓ Frage ${fi+1} von ${fragen.length} · ${esc(f.frage)}</div>
        <div style="font-family:var(--display);font-weight:900;font-size:40px;line-height:1.1;margin:6px 0">${esc(f.satz).replace("___",'<span class="gap">&nbsp;</span>')}</div>
        <div class="muted" style="font-weight:700;margin-bottom:8px">${esc(f.hint)}${f.karte?" · über/unter = auf der Karte darüber/darunter":""}</div>
        <div class="opts">${f.o.map((o,k)=>`<button class="opt ${antwort?(o===f.ok?"right":(o===antwort?"wrong":"")):""}" data-a="${esc(o)}" style="font-size:30px;text-align:left;padding-left:16px" ${antwort?"disabled":""}><span style="color:var(--muted);margin-right:10px">${"ABC"[k]}</span>${esc(o)}</button>`).join("")}</div>
        ${antwort?`<div class="tip ${antwort===f.ok?"ok":"bad"}" style="font-size:20px">${antwort===f.ok?"✓ Richtig! +1":"✗ "+esc(f.fertig)}</div><button class="btn led wide" id="t-fweiter">${fi<fragen.length-1?"Nächste Frage ›":"🗺️ Zum Ziel fahren ›"}</button>`:""}`;
    } else {
      rechts+=`<div class="ziel-zeile" style="text-align:left">Ziel: <b>${esc(ziel.ort.n)}</b> ${ziel.ort.e}</div>
        <div style="font-size:20px">Schritte: <b style="font-size:30px">${schritte}</b> <span class="muted">(kürzester Weg: ${fertig?optimal:"?"})</span></div>
        <div class="tip ${msgCls}" style="text-align:left;font-size:20px;min-height:30px">${msg}</div>
        ${fertig?`<button class="btn led wide" id="t-next">Nächstes Team ›</button>`:`<div class="steuer"><button class="sbtn" data-b="l">⬅️<span>Geh links!</span></button><button class="sbtn" data-b="g">⬆️<span>Geh geradeaus!</span></button><button class="sbtn" data-b="r">➡️<span>Geh rechts!</span></button></div>
        <div style="text-align:center"><button class="sbtn klein" data-b="z">↩️ <span>Dreh um!</span></button> <button class="sbtn klein" id="t-skip">⏭ überspringen</button></div>`}
        <div class="muted" style="margin-top:8px;font-size:14px">${gesagt.slice(-6).map(x=>`„${x}“`).join(" → ")}</div>`;
    }
    rechts+=`<div class="muted" style="margin-top:6px;font-weight:700">Diese Runde: +${rundePunkte}</div></div>
      <div class="card" style="margin-top:12px"><h2 style="font-size:26px">🏆 Punkte</h2>${teams.map((x,i)=>`<div style="display:flex;justify-content:space-between;font-size:22px;font-weight:700;padding:4px 0;color:${FARBEN[i]}"><span>${i===aktiv?"▶ ":""}${esc(x.n)}</span><span>${x.p}</span></div>`).join("")}
        <div class="stack" style="grid-template-columns:1fr 1fr"><button class="btn ghost" id="t-neu">🗺️ Neuer Stadtplan</button><button class="btn ghost" id="t-schwer">Weg: ${abstand} Schritte ${abstand<7?"+":"↺"}</button></div></div>`;
    box.innerHTML=`<div class="tafel-grid"><div>${planSVG(plan,{pos,dir,ziel:fragt?null:ziel,spur})}</div><div>${rechts}</div></div>`;
    box.querySelectorAll(".sbtn[data-b]").forEach(b=>b.onclick=()=>befehl(b.dataset.b));
    box.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>antworten(b.dataset.a));
    const fw=$("#t-fweiter"); if(fw) fw.onclick=frageWeiter;
    const n=$("#t-next"); if(n) n.onclick=weiter;
    const sk=$("#t-skip"); if(sk) sk.onclick=()=>{ fertig=true; msg=`Übersprungen – keine Weg-Punkte. Kürzester Weg: ${optimal} Schritte.`; msgCls="bad"; mal(); };
    $("#t-neu").onclick=()=>{ plan=neuerPlan(); neueRunde(); };
    $("#t-schwer").onclick=()=>{ abstand = abstand<7 ? abstand+1 : 3; if(fi===0 && !antwort) neueRunde(); else mal(); };
  }
  function antworten(a){ if(antwort || fi>=fragen.length) return; antwort=a; if(a===fragen[fi].ok){ teams[aktiv].p++; rundePunkte++; } mal(); }
  function frageWeiter(){ if(!antwort) return; hinweise.push(fragen[fi].fertig); fi++; antwort=null; mal(); }
  function befehl(b){
    if(fertig || fi<fragen.length) return; const s=gehe(plan,pos,dir,b); schritte++;
    gesagt.push({l:"Geh links!",g:"Geh geradeaus!",r:"Geh rechts!",z:"Dreh um!"}[b]);
    if(!s){ msg="Stopp! Da ist keine Straße."; msgCls="bad"; mal(); return; }
    pos=s.pos; dir=s.dir; spur.push({...pos});
    if(pos.x===ziel.x&&pos.y===ziel.y){ fertig=true; const p = schritte<=optimal?3 : schritte<=optimal+2?2 : 1; teams[aktiv].p+=p; rundePunkte+=p;
      msg=`✓ Angekommen! Sagt laut: „Wir sind jetzt ${woWP(ziel.ort)}.“ +${p}${p===3?" – kürzester Weg! ⭐":""}`; msgCls="ok"; mal(); return; }
    msg=""; msgCls=""; mal();
  }
  function weiter(){ aktiv=(aktiv+1)%teams.length; if(aktiv===0) runde++; neueRunde(); }
  document.addEventListener("keydown", e=>{ if(!plan) return;
    if(fi<fragen.length){ const k={"1":0,"2":1,"3":2}[e.key]; if(k!==undefined && !antwort){ antworten(fragen[fi].o[k]); return; } if(e.key==="Enter" && antwort){ frageWeiter(); } return; }
    const k={ArrowLeft:"l",ArrowUp:"g",ArrowRight:"r",ArrowDown:"z"}[e.key]; if(k){ e.preventDefault(); befehl(k); } if(e.key==="Enter" && fertig){ weiter(); } });
  setup();
}

if(new URLSearchParams(location.search).get("tafel")){ tafelNavi(); }
else if(!SPIEL){
  kopf(null); $("#menu-text").textContent=MENU_TEXT;
  $("#menu").innerHTML=Object.entries(SPIELE).map(([p,g])=>`<a class="tile" href="?spiel=${p}">
    <div class="tile-top" style="background-color:${g.color}"><span>${g.icon}</span><b>${esc(g.title)}</b></div>
    <p>${g.timer?'<span class="tbadge">⏱️ gegen die Zeit</span>':""}<b style="color:var(--ink)">${esc(g.thema)}</b><br>${esc(g.text)}</p></a>`).join("");
  Liga.show("scr-menu");
} else {
  kopf(SPIEL);
  $("#start-btn").addEventListener("click", spielen);
  $("#again").addEventListener("click", startScreen);
  Liga.start(SPIEL.key, startScreen);
}
</script>
</body>
</html>
