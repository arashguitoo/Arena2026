<style>
:root{ --bg:#F4F1EA; --card:#fff; --ink:#1E2A44; --muted:#6B7280; --line:#E5E0D5; --soft:#FAF8F3; --nacht:#1E2A44; --pri:#2F6FDB; --pri-2:#E3EDFF; --ok:#14A37F; --ok-2:#E2F6EF; --bad:#E2483D; --bad-2:#FDE8E6; --gold:#F5B82E;
  --head:"Outfit",system-ui,sans-serif; --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --schatten:0 1px 0 var(--line),0 8px 24px rgba(30,42,68,.06); }
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit} input,select,textarea{color:#1E2A44;background:#fff}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0 0 8px} .muted{color:var(--muted)} .small{font-size:14px} .mitte{text-align:center}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 90px} .breit{max-width:1400px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--schatten);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:0;background:var(--pri);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn.sm{min-height:34px;padding:4px 12px;font-size:15px;border-radius:10px} .btn.ghost{background:var(--pri-2);color:var(--pri)} .btn.ok{background:var(--ok)} .btn.rot{background:var(--bad)} .btn.gold{background:var(--gold);color:var(--ink)} .btn.hell{background:rgba(255,255,255,.15);color:#fff}
.btn.wide{width:100%} .btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--bad);font-weight:700;min-height:22px;margin-top:8px}
.codein{width:100%;font-family:var(--head);font-size:34px;letter-spacing:.25em;text-align:center;min-height:60px;border:2px solid var(--line);border-radius:12px;text-transform:uppercase}
.namen{display:flex;flex-wrap:wrap;gap:8px} .namen button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer}
.namen button:disabled{opacity:.35;text-decoration:line-through}
.kopf{position:sticky;top:0;z-index:10;background:var(--nacht);color:#fff}
.kopf .in{max-width:720px;margin:0 auto;padding:8px 12px;display:flex;gap:10px;align-items:center;min-height:56px}
.kopf b{font-family:var(--head);font-size:18px} .kopf .r{margin-left:auto}
.uhr{font-family:var(--head);font-weight:900;font-size:26px;background:var(--gold);color:var(--ink);border-radius:12px;padding:2px 12px;font-variant-numeric:tabular-nums}
.uhr.knapp{background:var(--bad);color:#fff}
.reiter{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;max-width:720px;margin:0 auto;scrollbar-width:none}
.reiter button{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap}
.reiter button.an{border-color:var(--pri);background:var(--pri-2);color:var(--pri)} .reiter button.voll{border-color:var(--ok)}
.info{background:var(--pri-2);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.text{background:#FFFDF6;border:2px solid #EFE6CC;border-radius:14px;padding:14px;font-size:17px;line-height:1.6;margin-bottom:12px}
.aufg{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--schatten);margin-bottom:10px}
.aufg .nr{font-weight:800;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.aufg .f{font-weight:700;font-size:18px;margin:4px 0 10px}
.opts{display:grid;gap:8px} .opt{border:3px solid var(--line);background:#fff;border-radius:12px;min-height:50px;padding:8px 12px;text-align:left;cursor:pointer;font-weight:600;font-size:17px}
.opt.an{border-color:var(--pri);background:var(--pri-2)}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.buchst{display:flex;gap:6px;flex-wrap:wrap} .buchst button{width:52px;height:52px;border-radius:12px;border:3px solid var(--line);background:#fff;font-family:var(--head);font-weight:900;font-size:22px;cursor:pointer}
.buchst button.an{border-color:var(--pri);background:var(--pri);color:#fff}
.anz{display:grid;gap:8px;margin-bottom:12px} .anz div{background:#FFFDF6;border:2px solid #EFE6CC;border-radius:12px;padding:10px 12px} .anz b{font-family:var(--head);font-size:20px;margin-right:6px}
.linie{min-height:56px;border:3px dashed var(--line);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.kachel{min-height:44px;padding:6px 12px;border-radius:10px;border:0;background:var(--pri);color:#fff;font-weight:700;font-size:18px;cursor:pointer} .kachel.weg{visibility:hidden}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.fuss{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;z-index:10}
.fuss .in{max-width:720px;margin:0 auto;display:flex;gap:8px}
.warte{background:#EEF2FF;border:3px dashed #93A8E8;border-radius:20px;padding:24px 16px;text-align:center;margin:10px 0}
.warte .e{font-size:58px;display:inline-block;animation:sanduhr 2.4s ease-in-out infinite}
@keyframes sanduhr{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
/* Lehrkraft */
body.lk{background:#ECE8DF}
.lkopf{background:var(--nacht);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.lkopf h1{margin:0;font-size:22px} .code{font-family:var(--head);font-weight:900;letter-spacing:.15em;background:var(--gold);color:var(--ink);border-radius:12px;padding:2px 14px;font-size:26px}
.tabs{display:flex;gap:6px;margin:0 0 12px} .tabs button{border:0;border-radius:12px;padding:8px 16px;font-weight:800;cursor:pointer;background:#fff} .tabs button.an{background:var(--pri);color:#fff}
table.t{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:15px}
table.t th,table.t td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} table.t th{background:var(--soft);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
table.t tr.klick{cursor:pointer} table.t tr.klick:hover{background:var(--soft)}
.ja{color:var(--ok);font-weight:800} .nein{color:var(--bad);font-weight:800}
.balken{height:12px;border-radius:6px;background:var(--line);overflow:hidden;min-width:80px} .balken i{display:block;height:100%;background:var(--ok)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-weight:800;font-size:13px}
.p-ok{background:var(--ok-2);color:var(--ok)} .p-bad{background:var(--bad-2);color:var(--bad)} .p-mid{background:#FFF4D6;color:#9A6B00}
.punkte button{min-width:40px;min-height:36px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800;cursor:pointer;margin:2px}
.punkte button.an{background:var(--pri);color:#fff;border-color:var(--pri)}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
@media print{ .lkopf,.tabs,.noprint{display:none!important} body{background:#fff} .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid} }
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="card">Einen Moment …</div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="pruefung/a2-l8-12.js"></script>
<script src="pruefung/hoeren-vorlage.js"></script>
<script>
/* =========================================================
   PRÜFUNG (Klick-Test mit Code)
   Lernende:  pruefung.html  → Code eingeben → Namen wählen
   Lehrkraft: pruefung.html?leitung=1  (Anmeldung wie auf der Lehrer-Seite)
   Ablauf: warten → hoeren (Lehrkraft spielt die Texte ab) → haupt (60 Min., Uhr läuft automatisch) → ende
   Daten: ligapruefung/ploen-jik/{CODE}/ info · hoeren · hkey · tn/{pid} · antw/{pid}/{aufgabe} · muendlich/{pid}
   Lösungen stehen nur in pruefung/<test>-loesung.js und werden nur auf der Lehrkraft-Seite geladen.
   ========================================================= */
const KURS="ploen-jik", ROOT=`ligapruefung/${KURS}`;
const cfg={apiKey:"AIzaSyBDChXlm34Kr7Gg0Dw458GiiwoLnWJAnxM",authDomain:"lern-deutsch-arash.firebaseapp.com",databaseURL:"https://lern-deutsch-arash-default-rtdb.europe-west1.firebasedatabase.app",projectId:"lern-deutsch-arash"};
let db=null, auth=null, offset=0; try{ if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(cfg); db=firebase.database(); try{ auth=firebase.auth(); }catch(e){} db.ref(".info/serverTimeOffset").on("value",s=>offset=Number(s.val())||0); }catch(e){}
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const jetzt=()=>Date.now()+offset; const TS=()=>firebase.database.ServerValue.TIMESTAMP;
const P=new URLSearchParams(location.search); const app=$("#app");
let CODE=(P.get("code")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const R=p=>db.ref(`${ROOT}/${CODE}${p?"/"+p:""}`);
function hash(s){ let h=2166136261; for(const c of String(s)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function mischS(a,key){ let x=hash(key)||1; const r=()=>{ x^=x<<13; x^=x>>>17; x^=x<<5; return (x>>>0)/4294967296; }; a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const norm=s=>String(s||"").toLowerCase().replace(/[.,!?;:"„“]/g,"").replace(/\s+/g," ").trim();
const mmss=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const TEST=id=>(window.PRUEFUNGEN||{})[id];
function restSek(info){ if(!info||!info.start) return null; const ende=Number(info.start)+((Number(info.dauer)||60)+(Number(info.extra)||0))*60000; return Math.max(0,Math.ceil((ende-jetzt())/1000)); }
const BUCH="abcdefgh";
function hoerItems(H){ return Object.values((H&&H.items)||{}); }
/* Antworttext für Anzeige */
function antwortText(it, v){ if(v===undefined||v===null||v==="") return "–";
  if(it.typ==="mc"||it.typ==="rf"||it.typ==="hoeren") return it.o[v]!==undefined?it.o[v]:"–";
  if(it.typ==="zu") return String(v);
  if(it.typ==="satz"){ const ix=String(v).split(",").filter(x=>x!=="").map(Number); return ix.map(i=>it.w[i]).join(" ")+(ix.length===it.w.length?(it.p||""):" …"); }
  return String(v); }

/* =========================================================
   LERNENDE
   ========================================================= */
function lernende(){
  let me=null, info={}, H={}, A={}, ich={}, teilNr=0, satzLokal={};
  const MEKEY=()=>`pr_me_${CODE}`;
  function codeScreen(f){ app.innerHTML=`<div class="wrap"><div class="card" style="margin-top:8vh;text-align:center"><div style="font-size:56px">📝</div><h2>Prüfung</h2><p class="muted">Gib den Code ein. Du bekommst ihn von der Lehrkraft.</p>
    <form id="cf"><input id="code" class="codein" maxlength="6" autocomplete="off" value="${esc(CODE)}"><button class="btn wide" style="margin-top:10px">Weiter</button></form><div class="err">${esc(f||"")}</div></div></div>`;
    $("#cf").onsubmit=e=>{ e.preventDefault(); CODE=$("#code").value.toUpperCase().replace(/[^A-Z0-9]/g,""); pruefe(); }; }
  async function pruefe(){ if(CODE.length<4) return codeScreen(CODE?"Der Code ist zu kurz.":"");
    let i=null; try{ i=(await R("info").once("value")).val(); }catch(e){}
    if(!i) return codeScreen("Diesen Code gibt es nicht. Frag die Lehrkraft.");
    history.replaceState(null,"","?code="+CODE);
    try{ me=JSON.parse(localStorage.getItem(MEKEY())||"null"); }catch(e){}
    if(me) return los(); namenWahl(); }
  async function namenWahl(hinweis){
    let namen={}, tn={}; try{ namen=(await db.ref(`jugendliga/${KURS}/public/names`).once("value")).val()||{}; tn=(await R("tn").once("value")).val()||{}; }catch(e){}
    const ids=Object.keys(namen).sort((a,b)=>String(namen[a]).localeCompare(namen[b]));
    app.innerHTML=`<div class="wrap"><div class="card" style="margin-top:4vh"><h2>Wer bist du?</h2><p class="muted">Tippe auf deinen Namen.</p>${hinweis?`<p class="err">${esc(hinweis)}</p>`:""}
      <div class="namen">${ids.map(p=>{ const weg=tn[p]&&tn[p].online!==false; return `<button data-p="${p}" ${weg?"disabled":""}>${esc(namen[p])}</button>`; }).join("")}</div>
      <p class="small muted" style="margin-top:12px">Durchgestrichen = schon angemeldet. Dein Name fehlt? Sag es der Lehrkraft.</p></div></div>`;
    $$("[data-p]").forEach(b=>b.onclick=async()=>{ const p=b.dataset.p; const x=(await R(`tn/${p}`).once("value")).val(); if(x&&x.online!==false) return namenWahl("Dieser Name ist schon angemeldet.");
      me={pid:p, name:namen[p]}; try{ localStorage.setItem(MEKEY(), JSON.stringify(me)); }catch(e){} los(); }); }
  function los(){ const r=R(`tn/${me.pid}`); r.update({name:me.name, ts:TS(), online:true, raus:null}); try{ r.child("online").onDisconnect().set(false); }catch(e){}
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ r.update({online:true}); try{ r.child("online").onDisconnect().set(false); }catch(e){} } });
    try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}
    let gesehen=false;
    R("info").on("value",s=>{ info=s.val()||{}; male(); });
    R("hoeren").on("value",s=>{ H=s.val()||{}; male(); });
    R(`antw/${me.pid}`).on("value",s=>{ A=s.val()||{}; male(); });
    R(`tn/${me.pid}`).on("value",s=>{ const v=s.val(); if(v&&!v.raus) gesehen=true; else if(gesehen||(v&&v.raus)){ R().off(); try{ localStorage.removeItem(MEKEY()); }catch(e){} me=null; return namenWahl("Die Lehrkraft hat dich abgemeldet. Tippe noch einmal auf deinen Namen."); } ich=v||{}; male(); });
    setInterval(tick,1000); }
  function speichere(id, v){ if(gesperrt()) return; R(`antw/${me.pid}/${id}`).set(v); }
  function gesperrt(){ return ich.abgegeben || info.phase==="ende" || (info.phase==="haupt" && restSek(info)===0); }
  function tick(){ if(info.phase!=="haupt") return; const r=restSek(info); const u=$("#uhr"); if(u){ u.textContent=mmss(r); u.classList.toggle("knapp", r<300); }
    if(r===0 && !ich.abgegeben && me){ R(`tn/${me.pid}`).update({abgegeben:true, abgabe:TS(), auto:true}); } }
  const T=()=>TEST(info.test);
  function kopf(rechts){ return `<div class="kopf"><div class="in"><b>📝 ${esc(me.name)}</b><span class="r">${rechts||""}</span></div></div>`; }
  function warte(wer, text){ return `<div class="warte"><div class="e">⏳</div><h2>Warte auf ${wer}</h2>${text?`<p>${text}</p>`:""}</div>`; }
  function male(){
    if(!me) return; const ae=document.activeElement; const sy=window.scrollY;
    if(!info.phase){ app.innerHTML=`<div class="wrap"><div class="card">Diese Prüfung gibt es nicht mehr.</div></div>`; return; }
    if(info.phase==="warten"){ app.innerHTML=kopf()+`<div class="wrap"><div class="card mitte"><div style="font-size:52px">👋</div><h2>Hallo ${esc(me.name)}!</h2><p>Gleich beginnt die Prüfung.</p></div>${warte("die Lehrkraft","Lass dein Handy an und leg es vor dich.")}
      <div class="card"><b>So geht die Prüfung:</b><ol style="margin:6px 0 0;padding-left:20px"><li>Hören: Die Lehrkraft spielt die Texte ab.</li><li>Danach hast du <b>60 Minuten</b> für Lesen, Grammatik, Sprachbausteine und Satzbau.</li><li>Du tippst nur – du musst nichts schreiben.</li><li>Am Ende tippst du <b>„Abgeben“</b>.</li></ol></div></div>`; return; }
    if(ich.abgegeben || info.phase==="ende" || (info.phase==="haupt" && restSek(info)===0)){
      app.innerHTML=kopf()+`<div class="wrap"><div class="card mitte"><div style="font-size:60px">✅</div><h2>Abgegeben. Danke!</h2><p>Deine Antworten sind gespeichert.<br>Bleib bitte ruhig sitzen, bis alle fertig sind.</p></div></div>`; return; }
    if(info.phase==="hoeren"){ const L=hoerItems(H); const n=L.filter((_,i)=>A["h-"+(i+1)]!==undefined).length;
      app.innerHTML=kopf(`<span class="small">${n}/${L.length}</span>`)+`<div class="wrap"><h2>Teil 1: Hören</h2><div class="info">${esc(H.info||"Die Lehrkraft spielt die Texte ab. Hör gut zu und tippe die richtige Antwort.")}</div>
        ${L.map((it,i)=>{ const id="h-"+(i+1); const o=it.o||["a","b","c"]; const v=A[id]; return `<div class="aufg"><div class="nr">Aufgabe ${i+1}</div>${it.f?`<div class="f">${esc(it.f)}</div>`:""}
          <div class="${o.every(x=>x.length<=2)?"buchst":"opts"}">${o.map((x,k)=>`<button class="${o.every(x=>x.length<=2)?"":"opt"} ${v===k?"an":""}" data-a="${id}" data-v="${k}">${esc(x)}</button>`).join("")}</div></div>`; }).join("")||'<div class="card">Noch keine Aufgaben.</div>'}
        ${warte("die Lehrkraft","Nach dem Hören startet die Lehrkraft den nächsten Teil.")}</div>`;
      $$("[data-a]").forEach(b=>b.onclick=()=>speichere(b.dataset.a, Number(b.dataset.v))); window.scrollTo(0,sy); return; }
    /* Hauptteil */
    const TT=T(); if(!TT){ app.innerHTML=`<div class="wrap"><div class="card">Test nicht gefunden.</div></div>`; return; }
    const teile=TT.teile; teilNr=Math.min(teilNr, teile.length); const r=restSek(info);
    const fertigIn=t=>t.items.filter(it=>{ const v=A[it.id]; return it.typ==="satz"?(v&&String(v).split(",").filter(x=>x!=="").length===it.w.length):v!==undefined; }).length;
    let h=kopf(`<span id="uhr" class="uhr ${r<300?"knapp":""}">${mmss(r)}</span>`)+`<div style="background:#fff;border-bottom:1px solid var(--line)"><div class="reiter">${teile.map((t,i)=>`<button data-teil="${i}" class="${i===teilNr?"an":""} ${fertigIn(t)===t.items.length?"voll":""}">${esc(t.titel.split(":")[0])} ${fertigIn(t)}/${t.items.length}</button>`).join("")}<button data-teil="${teile.length}" class="${teilNr===teile.length?"an":""}">✅ Abgeben</button></div></div><div class="wrap">`;
    if(teilNr===teile.length){ const offen=teile.reduce((a,t)=>a+t.items.length-fertigIn(t),0);
      h+=`<h2>Übersicht</h2>${teile.map((t,i)=>`<div class="aufg row" style="justify-content:space-between"><b>${esc(t.titel)}</b><span>${fertigIn(t)} von ${t.items.length} ${fertigIn(t)===t.items.length?"✅":`<button class="btn sm ghost" data-teil="${i}">ansehen</button>`}</span></div>`).join("")}
        <div class="card mitte">${offen?`<p><b>${offen} Aufgaben</b> hast du noch nicht beantwortet.</p>`:`<p>Du hast alles beantwortet. 👍</p>`}<button class="btn ok wide" id="abgeben" style="min-height:58px;font-size:20px">✅ Jetzt abgeben</button><p class="small muted">Danach kannst du nichts mehr ändern.</p></div></div>`;
      app.innerHTML=h; binde(); $("#abgeben").onclick=()=>{ if(!confirm(offen?`Noch ${offen} Aufgaben offen. Wirklich abgeben?`:"Wirklich abgeben?")) return; R(`tn/${me.pid}`).update({abgegeben:true, abgabe:TS()}); }; return; }
    const t=teile[teilNr];
    h+=`<h2>${esc(t.titel)}</h2><div class="info">${esc(t.info)}</div>`;
    if(t.anzeigen) h+=`<div class="anz">${Object.entries(t.anzeigen).map(([k,x])=>`<div><b>${k}</b>${esc(x)}</div>`).join("")}</div>`;
    if(t.text) h+=`<div class="text">${t.text}</div>`;
    h+=t.items.map((it,i)=>aufgabe(it,i,t)).join("");

      <table class="t"><tr><th>Name</th>${teilNamen.map(n=>`<th>${esc(n)}</th>`).join("")}${(T.muendlich||[]).length?"<th>Schriftlich</th><th>Mündlich</th>":""}<th>Gesamt</th><th>Note</th></tr>
      ${L.sort((a,b)=>b.b.proz-a.b.proz).map(({p,x,b})=>`<tr class="klick" data-detail="${p}"><td><b>${esc(x.name)}</b>${x.abgegeben?"":' <span class="small muted">(nicht abgegeben)</span>'}</td>${b.teile.map(t=>`<td>${t.p}/${t.max}</td>`).join("")}
        ${(T.muendlich||[]).length?`<td>${b.sp}/${b.smax} ${pill(b.smax?Math.round(b.sp/b.smax*100):0)}</td><td>${b.mBewertet?`${b.mp}/${b.mmax}`:'<span class="muted">–</span>'}</td>`:""}<td><b>${b.ges}/${b.gmax}</b> ${pill(b.proz)}</td><td>${note(b.proz)}</td></tr>`).join("")}</table>`;
    if(L.length){ /* Klasse: Themen */
      const th={}; L.forEach(({b})=>Object.entries(b.themen).forEach(([k,v])=>{ th[k]=th[k]||{p:0,n:0}; th[k].p+=v.p; th[k].n+=v.n; }));
      h+=`<div class="raster" style="margin-top:14px"><div class="card"><h3>📚 Klasse: Themen (Durchschnitt)</h3>${Object.entries(th).sort((a,b)=>a[1].p/a[1].n-b[1].p/b[1].n).map(([k,v])=>{ const q=Math.round(v.p/v.n*100); return `<div class="row" style="margin:4px 0"><span style="width:190px">${esc(k)}</span><div class="balken" style="flex:1"><i style="width:${q}%;background:${q>=67?"var(--ok)":q>=50?"var(--gold)":"var(--bad)"}"></i></div><b style="width:50px;text-align:right">${q} %</b></div>`; }).join("")}</div>`;
      const items=[]; L[0].b.teile.forEach((t,ti)=>t.items.forEach((x,ii)=>{ const r=L.filter(z=>z.b.teile[ti].items[ii].ok).length; items.push({t:t.titel, x, q:Math.round(r/L.length*100), falsch:L.filter(z=>!z.b.teile[ti].items[ii].ok).map(z=>z.b.teile[ti].items[ii].v)}); }));
      h+=`<div class="card"><h3>❗ Schwierigste Aufgaben</h3>${items.sort((a,b)=>a.q-b.q).slice(0,10).map(z=>{ const fehl={}; z.falsch.forEach(v=>{ const k=antwortText(z.x.it,v); fehl[k]=(fehl[k]||0)+1; }); const top=Object.entries(fehl).sort((a,b)=>b[1]-a[1])[0];
        return `<div style="margin:6px 0;border-bottom:1px solid var(--line);padding-bottom:6px"><div class="row" style="justify-content:space-between"><span class="small muted">${esc(z.t.split(":")[0])}</span>${pill(z.q)}</div><div>${esc(z.x.it.f||"")}</div><div class="small">✅ ${esc(loesungText(z.x))}${top?` · häufigster Fehler: „${esc(top[0])}“ (${top[1]}×)`:""}</div></div>`; }).join("")}</div></div>`; }
    return h; }
  function loesungText(x){ const it=x.it; if(x.k===undefined||x.k===null) return "keine Lösung eingetragen";
    if(it.typ==="satz") return (x.k[0]||"").replace(/^./,c=>c.toUpperCase())+(it.p||""); if(it.typ==="zu") return String(x.k); return it.o[x.k]; }
  function einzel(T,{p,x,b}){ const M=(S.muendlich||{})[p]||{};
    return `<div class="row noprint" style="margin-bottom:10px"><button class="btn ghost" id="zurueck">◀ Alle Ergebnisse</button><button class="btn ghost" id="drucken">🖨 Drucken</button></div>
      <div class="card"><h2>${esc(x.name)}</h2><div class="row">${(T.muendlich||[]).length?`<span>Schriftlich: <b>${b.sp}/${b.smax}</b></span><span>Mündlich: <b>${b.mBewertet?`${b.mp}/${b.mmax}`:"noch nicht bewertet"}</b></span>`:""}<span>Gesamt: <b>${b.ges}/${b.gmax}</b> ${pill(b.proz)}</span><span>Note: <b>${note(b.proz)}</b></span>
        <span class="small muted">${x.abgegeben?`Abgabe ${new Date(Number(x.abgabe)||0).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}${x.auto?" (Zeit abgelaufen)":""}`:"nicht abgegeben"}</span></div>${M.notiz?`<p class="small">📝 ${esc(M.notiz)}</p>`:""}</div>
      <div class="raster"><div class="card"><h3>Stärken & Schwächen</h3>${Object.entries(b.themen).sort((a,c)=>a[1].p/a[1].n-c[1].p/c[1].n).map(([k,v])=>{ const q=Math.round(v.p/v.n*100); return `<div class="row" style="margin:4px 0"><span style="width:180px">${esc(k)}</span><div class="balken" style="flex:1"><i style="width:${q}%;background:${q>=67?"var(--ok)":q>=50?"var(--gold)":"var(--bad)"}"></i></div><b style="width:60px;text-align:right">${v.p}/${v.n}</b></div>`; }).join("")}</div>
      <div class="card"><h3>Teile</h3>${b.teile.map(t=>`<div class="row" style="margin:4px 0"><span style="width:180px">${esc(t.titel)}</span><div class="balken" style="flex:1"><i style="width:${t.max?t.p/t.max*100:0}%"></i></div><b style="width:60px;text-align:right">${t.p}/${t.max}</b></div>`).join("")}</div></div>
      ${b.teile.map(t=>`<div class="card"><h3>${esc(t.titel)} – ${t.p}/${t.max}</h3><table class="t"><tr><th>#</th><th>Aufgabe</th><th>Antwort</th><th>Lösung</th><th></th></tr>
        ${t.items.map((z,i)=>`<tr><td>${i+1}</td><td>${esc(z.it.f||"")}${z.it.thema?`<div class="small muted">${esc(z.it.thema)}</div>`:""}</td><td>${esc(antwortText(z.it,z.v))}</td><td>${esc(loesungText(z))}</td><td>${z.ohneSchluessel?"?":z.ok?'<span class="ja">✓</span>':'<span class="nein">✗</span>'}</td></tr>`).join("")}</table></div>`).join("")}`; }
  function binde(T){
    const on=(s,f)=>{ const e=$(s); if(e) e.onclick=f; };
    $$("[data-tab]").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; detail=null; entwurf=null; male(); });
    on("#zurListe", ()=>{ R().off(); CODE=""; history.replaceState(null,"","?leitung=1"); liste(); });
    $$("[data-phase]").forEach(b=>b.onclick=()=>{ const ph=b.dataset.phase;
      if(ph==="haupt" && S.info.phase==="hoeren"){ if(hoerItems(S.hoeren).some((_,i)=>(S.hkey||{})[i]===undefined) && !confirm("Beim Hören fehlen noch Lösungen. Trotzdem starten? (Du kannst sie später eintragen.)")) return; R("info").update({phase:"haupt", start:jetzt(), extra:0}); return; }
      if(ph==="haupt" && S.info.phase==="ende"){ R("info").update({phase:"haupt"}); return; }
      if(ph==="ende" && !confirm("Prüfung jetzt für alle beenden?")) return; R("info/phase").set(ph); });
    on("#plus5", ()=>R("info/extra").set((Number(S.info.extra)||0)+5));
    $$("[data-oeffne]").forEach(b=>b.onclick=()=>{ if(confirm("Abgabe wieder öffnen? Die Person kann dann weiterarbeiten.")) R(`tn/${b.dataset.oeffne}`).update({abgegeben:false, auto:null}); });
    $$("[data-ab]").forEach(b=>b.onclick=()=>{ if(confirm("Handy abmelden? Die Antworten bleiben gespeichert.")) R(`tn/${b.dataset.ab}`).update({online:false, raus:true}); });
    /* Hören */
    const E=entwurf;
    if(E){ const hi=$("#hinfo"); if(hi) hi.oninput=()=>E.info=hi.value;
      $$("[data-hf]").forEach(x=>x.oninput=()=>E.items[Number(x.dataset.hf)].f=x.value);
      $$("[data-ho]").forEach(x=>x.oninput=()=>{ const [i,k]=x.dataset.ho.split("|").map(Number); E.items[i].o[k]=x.value; });
      $$("[data-hk]").forEach(b=>b.onclick=()=>{ const [i,k]=b.dataset.hk.split("|").map(Number); E.items[i].k=k; male(); });
      $$("[data-htyp]").forEach(b=>b.onclick=()=>{ const [i,t]=b.dataset.htyp.split("|"); E.items[Number(i)].o={abc:["a","b","c"],rf:["richtig","falsch"],abcd:["a","b","c","d"]}[t].slice(); E.items[Number(i)].k=undefined; male(); });
      on("#hplus", ()=>{ E.items.push({f:"",o:["a","b","c"],t:""}); male(); });
      $$("[data-ht]").forEach(x=>x.oninput=()=>E.items[Number(x.dataset.ht)].t=x.value);
      $$("[data-vorlage]").forEach(b=>b.onclick=()=>{ if(!confirm("Alle Hör-Aufgaben durch die Vorlage ersetzen?")) return; const V=Object.values(window.HOER_VORLAGEN||{})[Number(b.dataset.vorlage)];
        entwurf={info:V.info, items:V.items.map(it=>({f:it.f, o:it.o.slice(), k:undefined, t:[it.t,it.q].filter(Boolean).join(" · ")}))}; male(); }); on("#hminus", ()=>{ if(E.items.length>1){ E.items.pop(); male(); } });
      on("#hverwerfen", ()=>{ entwurf=null; male(); });
      on("#hspeichern", ()=>{ const hk={}; E.items.forEach((it,i)=>{ if(it.k!==undefined) hk[i]=it.k; });
        const ht={}; E.items.forEach((it,i)=>{ if(it.t) ht[i]=it.t; });
        R().update({hoeren:{info:E.info, items:E.items.map(it=>({f:it.f, o:it.o}))}, hkey:hk, htrack:ht}).then(()=>{ entwurf=null; male(); alert("Gespeichert ✓"); }); }); }
    /* Mündlich */
    $$("[data-mp]").forEach(b=>b.onclick=()=>{ const [p,m,k]=b.dataset.mp.split("|"); const cur=((S.muendlich||{})[p]||{})[m]; R(`muendlich/${p}/${m}`).set(Number(cur)===Number(k)&&cur!==undefined?null:Number(k)); });
    $$("[data-mn]").forEach(x=>x.onchange=()=>R(`muendlich/${x.dataset.mn}/notiz`).set(x.value));
    /* Ergebnisse */
    $$("[data-detail]").forEach(r=>r.onclick=()=>{ detail=r.dataset.detail; male(); window.scrollTo(0,0); });
    on("#zurueck", ()=>{ detail=null; male(); }); on("#drucken", ()=>window.print());
    on("#csv", ()=>{ const L=tn().map(([p,x])=>({x, b:bewerte(p)})); const kopf=["Name",...(L[0]?L[0].b.teile.map(t=>t.titel):[]),"Schriftlich","Mündlich","Gesamt","Prozent","Note"];
      const zeilen=L.map(({x,b})=>[x.name,...b.teile.map(t=>`${t.p}/${t.max}`),`${b.sp}/${b.smax}`,b.mBewertet?`${b.mp}/${b.mmax}`:"",`${b.ges}/${b.gmax}`,b.proz,note(b.proz)]);
      const csv=[kopf,...zeilen].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n"); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"})); a.download=`Pruefung_${CODE}.csv`; a.click(); });
  }
}

if(!db) app.innerHTML=`<div class="wrap"><div class="card">Keine Verbindung. Bitte Seite neu laden.</div></div>`;
else if(P.get("leitung")) leitung(); else lernende();
</script>
</body>
