<head>

<style>
:root{ --bg:#F4F1EA; --card:#fff; --ink:#1E2A44; --muted:#6B7280; --line:#E5E0D5; --soft:#FAF8F3; --nacht:#1E2A44; --pri:#2F6FDB; --pri-2:#E3EDFF; --ok:#14A37F; --ok-2:#E2F6EF; --bad:#E2483D; --bad-2:#FDE8E6; --gold:#F5B82E; --lila:#7C5CD6;
  --head:"Outfit",system-ui,sans-serif; --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --schatten:0 1px 0 var(--line),0 8px 24px rgba(30,42,68,.06); }
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit} input,textarea,select{background:#fff;color:var(--ink)}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0 0 8px} .muted{color:var(--muted)} .small{font-size:14px} .mitte{text-align:center}
.wrap{max-width:600px;margin:0 auto;padding:12px 12px 90px} .breit{max-width:1300px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--schatten);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:0;background:var(--pri);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn.sm{min-height:34px;padding:4px 12px;font-size:15px} .btn.ghost{background:var(--pri-2);color:var(--pri)} .btn.ok{background:var(--ok)} .btn.rot{background:var(--bad)} .btn.wide{width:100%} .btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kopf{position:sticky;top:0;z-index:10;background:var(--nacht);color:#fff}
.kopf .in{max-width:600px;margin:0 auto;padding:8px 12px;display:flex;gap:10px;align-items:center;min-height:54px}
.kopf b{font-family:var(--head);font-size:19px} .kopf .r{margin-left:auto}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:10}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 14px;font-weight:800;font-size:15px;color:var(--muted);cursor:pointer} .tabs button.an{color:var(--pri)} .tabs .e{display:block;font-size:24px}
.codein{width:100%;font-family:var(--head);font-size:32px;letter-spacing:.2em;text-align:center;min-height:58px;border:2px solid var(--line);border-radius:12px;text-transform:uppercase}
.namen{display:flex;flex-wrap:wrap;gap:8px} .namen button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer} .namen button.an{border-color:var(--pri);background:var(--pri);color:#fff}
.post{background:#fff;border-radius:18px;box-shadow:var(--schatten);margin-bottom:14px;overflow:hidden}
.post .ph{padding:10px 14px;display:flex;gap:10px;align-items:center} .post .av{width:38px;height:38px;border-radius:50%;background:var(--pri-2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.post img{width:100%;display:block;max-height:520px;object-fit:contain;background:#111}
.post .tx{padding:10px 14px;font-size:18px} .post .tx .korr{font-size:13px;color:var(--muted)}
.post .re{padding:6px 14px 12px;display:flex;gap:6px;flex-wrap:wrap}
.re button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:16px;cursor:pointer} .re button.an{border-color:var(--pri);background:var(--pri-2)}
.kom{padding:0 14px 12px} .kom .k{background:var(--soft);border-radius:12px;padding:6px 10px;margin:4px 0;font-size:15px}
.typen{display:grid;gap:10px} .typen button{display:flex;gap:12px;align-items:center;text-align:left;border:3px solid var(--line);background:#fff;border-radius:16px;padding:12px;cursor:pointer} .typen button.an{border-color:var(--pri);background:var(--pri-2)} .typen .e{font-size:34px}
.vorschau{width:100%;border-radius:14px;margin:8px 0;max-height:380px;object-fit:contain;background:#111}
textarea{width:100%;min-height:90px;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:17px}
.anf{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0} .anf button{border:0;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:14px;cursor:pointer}
.info{background:var(--pri-2);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.rate{padding:0 14px 14px} .rate .namen button{font-size:15px;padding:6px 12px}
.tipp{border-radius:12px;padding:8px 12px;font-weight:800;margin-top:8px} .tipp.ok{background:var(--ok-2);color:var(--ok)} .tipp.nein{background:var(--bad-2);color:var(--bad)}
/* Lehrkraft */
body.lk{background:#ECE8DF}
.lkopf{background:var(--nacht);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.lkopf h1{margin:0;font-size:22px} .code{font-family:var(--head);font-weight:900;letter-spacing:.15em;background:var(--gold);color:var(--ink);border-radius:12px;padding:2px 14px;font-size:26px}
.ltabs{display:flex;gap:6px;margin:0 0 12px} .ltabs button{border:0;border-radius:12px;padding:8px 16px;font-weight:800;cursor:pointer;background:#fff} .ltabs button.an{background:var(--pri);color:#fff}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.beamer{position:fixed;inset:0;background:var(--nacht);color:#fff;z-index:100;display:flex;flex-direction:column;padding:20px 30px}
.beamer .bild{flex:1;min-height:0;display:flex;align-items:center;justify-content:center} .beamer img{max-width:100%;max-height:100%;border-radius:18px;object-fit:contain}
.beamer .fuss{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px} .beamer h2{font-size:clamp(28px,3.4vw,56px);margin:0}
.beamer .txt{font-size:clamp(22px,2.4vw,40px);font-weight:700}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="card">Einen Moment …</div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="namecheck.js?v=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* =========================================================
   KLASSEN-NETZ – ein kleines soziales Netzwerk nur für die Klasse
   Lernende:  sozial.html → Klassen-Code → Namen → Posten / Ansehen / Raten
   Lehrkraft: sozial.html?leitung=1 (Anmeldung wie Lehrer-Seite) → Freigeben, Korrigieren, Beamer-Ratespiel
   Daten (Regeln: siehe Lehrer-Seite → Einstellungen):
     ligasozial/ploen-jik/{CODE}/eingang/{id}  – Einreichungen (Handys dürfen nur schreiben, nicht lesen)
     ligasozial/ploen-jik/{CODE}/frei/{id}     – freigegebene Beiträge (mit Klassen-Code lesbar)
        …/reakt/{pid} = Emoji · …/kom/{pid} = Nummer des Kommentars · …/tipps/{pid} = geratene pid
     jugendliga/ploen-jik/sozial = {code}       – nur für die Lehrkraft
   Nichts erscheint ohne Freigabe. Keine freien Kommentare (nur feste Sätze).
   ========================================================= */
const KURS="ploen-jik";
const cfg={apiKey:"AIzaSyBDChXlm34Kr7Gg0Dw458GiiwoLnWJAnxM",authDomain:"lern-deutsch-arash.firebaseapp.com",databaseURL:"https://lern-deutsch-arash-default-rtdb.europe-west1.firebasedatabase.app",projectId:"lern-deutsch-arash"};
let db=null, auth=null; try{ if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(cfg); db=firebase.database(); try{ auth=firebase.auth(); }catch(e){} }catch(e){}
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P=new URLSearchParams(location.search); const app=$("#app");
const TS=()=>firebase.database.ServerValue.TIMESTAMP;
let CODE=(P.get("code")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const R=p=>db.ref(`ligasozial/${KURS}/${CODE}${p?"/"+p:""}`);
const TYPEN={
  story:{e:"📸", t:"Mein Wochenende in Fotos", h:"2 bis 4 Fotos von deinem Wochenende. Schreib zu jedem Foto einen Satz im Perfekt: Was hast du gemacht?", text:false, story:true,
    anf:["Am Samstag habe ich …","Am Sonntag bin ich …","Hier habe ich … gegessen.","Hier bin ich mit … nach … gefahren.","Das war super / lustig / langweilig."]},
  kind:{e:"👶", t:"Wer bin ich als Kind?", h:"Lade ein Foto von dir als Kind hoch. Die anderen raten, wer das ist! Dein Name bleibt geheim.", text:false},
  hobby:{e:"⭐", t:"Das mache ich gern", h:"Ein Foto von deinem Hobby (z. B. Ball, Gitarre, Essen …) und 2–3 Sätze.", text:true,
    anf:["Mein Hobby ist …","Ich spiele gern …","Ich kann gut …","Am liebsten esse ich …","Ich mag … nicht."]},
  frage:{e:"❓", t:"Rate mal!", h:"Ein Foto von etwas (kein Gesicht). Die anderen raten: Was ist das? Wo ist das?", text:true,
    anf:["Was ist das?","Wo bin ich?","Was habe ich gemacht?"]}
};
const REAKT=["❤️","😂","😮","👍"];
const KOMM=["Wie schön!","Cool!","Wo war das?","Das will ich auch!","Ich auch!","Lecker!","Toll gemacht!","Das finde ich lustig!"];
const zeitText=t=>{ const d=new Date(Number(t)||0); return d.toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"numeric"})+" "+d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); };

/* Bild verkleinern (max. 900 px, JPEG) – damit es schnell lädt und wenig Platz braucht */
function bildLesen(file, max){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const m=max||900; let w=img.width, h=img.height; const f=Math.min(1, m/Math.max(w,h)); w=Math.round(w*f); h=Math.round(h*f);
  const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); let q=.8, d=c.toDataURL("image/jpeg",q); while(d.length>350000&&q>.35){ q-=.1; d=c.toDataURL("image/jpeg",q); } res(d); }; img.onerror=rej; img.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); }); }

/* =========================================================
   LERNENDE
   ========================================================= */
function lernende(){
  let me=null, NAMEN={}, FREI={}, tab="feed", neu={typ:null, bild:null, text:"", story:[]}, fehler="", sendet=false;
  const MEKEY="soz_me";
  try{ const m=JSON.parse(localStorage.getItem(MEKEY)||"null"); if(m&&(!CODE||m.code===CODE)){ me=m; CODE=m.code; } }catch(e){}
  if(me) start(); else codeScreen();
  function codeScreen(f){ app.innerHTML=`<div class="wrap"><div class="card" style="margin-top:8vh;text-align:center"><div style="font-size:56px">📱</div><h2>Klassen-Netz</h2><p class="muted">Gib den Klassen-Code ein. Du bekommst ihn von der Lehrkraft.</p>
      <form id="cf"><input id="code" class="codein" maxlength="8" autocomplete="off" value="${esc(CODE)}"><button class="btn wide" style="margin-top:10px">Weiter</button></form><div style="color:var(--bad);font-weight:700;margin-top:8px">${esc(f||"")}</div></div></div>`;
    $("#cf").onsubmit=async e=>{ e.preventDefault(); CODE=$("#code").value.toUpperCase().replace(/[^A-Z0-9]/g,""); if(CODE.length<4) return codeScreen("Der Code ist zu kurz.");
      let ok=null; try{ ok=(await R("ok").once("value")).val(); }catch(x){} if(!ok) return codeScreen("Diesen Code gibt es nicht. Frag die Lehrkraft."); namenWahl(); }; }
  async function namenWahl(){ try{ NAMEN=(await db.ref(`jugendliga/${KURS}/public/names`).once("value")).val()||{}; }catch(e){}
    const ids=Object.keys(NAMEN).sort((a,b)=>String(NAMEN[a]).localeCompare(NAMEN[b]));
    app.innerHTML=`<div class="wrap"><div class="card" style="margin-top:4vh"><h2>Wer bist du?</h2><p class="muted">Tippe auf deinen Namen.</p><div class="namen">${ids.map(p=>`<button data-p="${p}">${esc(NAMEN[p])}</button>`).join("")}</div></div></div>`;
    $$("[data-p]").forEach(b=>b.onclick=()=>{ me={pid:b.dataset.p, name:NAMEN[b.dataset.p], code:CODE}; try{ localStorage.setItem(MEKEY, JSON.stringify(me)); }catch(e){} start(); }); }
  async function start(){ if(!Object.keys(NAMEN).length){ try{ NAMEN=(await db.ref(`jugendliga/${KURS}/public/names`).once("value")).val()||{}; }catch(e){} }
    R("frei").on("value", s=>{ FREI=s.val()||{}; male(); }, ()=>{ try{ localStorage.removeItem(MEKEY); }catch(e){} me=null; codeScreen("Bitte gib den Code noch einmal ein."); });
    male(); }
  const meineWartend=()=>{ try{ return JSON.parse(localStorage.getItem("soz_warte_"+CODE)||"[]"); }catch(e){ return []; } };
  function male(){ if(!me) return; const sy=window.scrollY;
    let h=`<div class="kopf"><div class="in"><b>📱 Klassen-Netz</b><span class="r small">${esc(me.name)}</span></div></div><div class="wrap">`;
    if(tab==="feed") h+=feed(); else if(tab==="neu") h+=posten(); else h+=meins();
    h+=`</div><div class="tabs"><button data-tab="feed" class="${tab==="feed"?"an":""}"><span class="e">📰</span>Alle</button><button data-tab="neu" class="${tab==="neu"?"an":""}"><span class="e">➕</span>Posten</button><button data-tab="meins" class="${tab==="meins"?"an":""}"><span class="e">🙋</span>Meine</button></div>`;
    app.innerHTML=h; binde(); if(tab==="feed") window.scrollTo(0,sy); }
  const liste=()=>Object.entries(FREI).filter(([,x])=>x&&x.typ).sort((a,b)=>(Number(b[1].frei)||0)-(Number(a[1].frei)||0));
  function postHtml(id, x, gross){ const T=TYPEN[x.typ]||TYPEN.hobby; const kind=x.typ==="kind"; const meinP=x.pid===me.pid;
    const re=x.reakt||{}; const ko=x.kom||{}; const tp=x.tipps||{}; const mein=tp[me.pid];
    let h=`<div class="post"><div class="ph"><div class="av">${T.e}</div><div><b>${kind&&!x.zeigen?"❓ Wer ist das?":esc(x.name)}</b><div class="small muted">${esc(T.t)} · ${zeitText(x.frei)}</div></div></div>`;
    if(x.story) h+=x.story.map((z,i)=>`<img src="${z.b}" alt=""><div class="tx"><span style="font-weight:900;color:var(--pri)">${i+1}.</span> ${esc(z.t)}</div>`).join("")+(x.orig?`<div class="tx"><div class="korr">✏️ von der Lehrkraft korrigiert</div></div>`:"");
    else if(x.bild) h+=`<img src="${x.bild}" alt="">`;
    if(x.text) h+=`<div class="tx">${esc(x.text)}${x.orig?`<div class="korr">✏️ von der Lehrkraft korrigiert</div>`:""}</div>`;
    if(kind){ h+=`<div class="rate">`;
      if(x.zeigen){ const r=Object.entries(tp).filter(([,v])=>v===x.pid).map(([p])=>NAMEN[p]||"?");
        h+=`<div class="tipp ok">👶 Das ist <b>${esc(x.name)}</b>!</div>${mein?(mein===x.pid?`<div class="tipp ok">✅ Du hast richtig geraten!</div>`:`<div class="tipp nein">❌ Du hast ${esc(NAMEN[mein]||"?")} getippt.</div>`):""}<p class="small muted">Richtig geraten: ${r.length?r.map(esc).join(", "):"niemand"}</p>`; }
      else if(meinP) h+=`<div class="tipp ok">🤫 Das bist du! Nicht verraten.</div><p class="small muted">${Object.keys(tp).length} haben schon getippt.</p>`;
      else { const ids=Object.keys(NAMEN).filter(p=>p!==me.pid).sort((a,b)=>String(NAMEN[a]).localeCompare(NAMEN[b]));
        h+=`<p style="margin:4px 0 6px;font-weight:700">Wer ist das? Tippe! ${mein?`<span class="small muted">(du kannst noch ändern)</span>`:""}</p><div class="namen">${ids.map(p=>`<button data-tipp="${id}|${p}" class="${mein===p?"an":""}">${esc(NAMEN[p])}</button>`).join("")}</div>`; }
      h+=`</div>`; }
    h+=`<div class="re">${REAKT.map(e=>{ const n=Object.values(re).filter(v=>v===e).length; return `<button data-re="${id}|${e}" class="${re[me.pid]===e?"an":""}">${e} ${n||""}</button>`; }).join("")}</div>`;
    const ks=Object.entries(ko); h+=`<div class="kom">${ks.map(([p,k])=>`<div class="k"><b>${esc(NAMEN[p]||"?")}:</b> ${esc(KOMM[k]||"")}</div>`).join("")}
      <select data-kom="${id}" style="width:100%;margin-top:6px;border:2px solid var(--line);border-radius:10px;padding:6px"><option value="">💬 Kommentar wählen …</option>${KOMM.map((k,i)=>`<option value="${i}" ${ko[me.pid]===i?"selected":""}>${esc(k)}</option>`).join("")}</select></div>`;
    return h+`</div>`; }
  function feed(){ const L=liste(); if(!L.length) return `<div class="card mitte"><div style="font-size:50px">📭</div><h3>Noch keine Beiträge.</h3><p class="muted">Tippe unten auf <b>➕ Posten</b>!</p></div>`;
    return L.map(([id,x])=>postHtml(id,x)).join(""); }
  function posten(){
    if(!neu.typ) return `<h2>Was möchtest du posten?</h2><div class="typen">${Object.entries(TYPEN).map(([k,T])=>`<button data-typ="${k}"><span class="e">${T.e}</span><span><b>${esc(T.t)}</b><br><span class="small muted">${esc(T.h)}</span></span></button>`).join("")}</div>
      <p class="small muted" style="margin-top:12px">🔒 Die Lehrkraft schaut jeden Beitrag zuerst an. Erst nach der Freigabe sehen ihn die anderen. Nur Fotos von dir oder von Sachen – keine Fotos von anderen Personen ohne Erlaubnis.</p>`;
    const T=TYPEN[neu.typ];
    if(T.story){ let h=`<div class="row" style="justify-content:space-between"><h2>${T.e} ${esc(T.t)}</h2><button class="btn sm ghost" id="zurueck">◀ zurück</button></div><div class="info">${esc(T.h)}</div>`;
      h+=neu.story.map((z,i)=>`<div class="card"><div class="row" style="justify-content:space-between"><b>Foto ${i+1}</b><button class="btn sm ghost" data-sweg="${i}">🗑</button></div><img class="vorschau" src="${z.b}">
        <div class="anf">${T.anf.map((a,k)=>`<button data-sanf="${i}|${k}">${esc(a)}</button>`).join("")}</div><textarea data-st="${i}" maxlength="160" style="min-height:64px" placeholder="Was hast du hier gemacht?">${esc(z.t)}</textarea></div>`).join("");
      if(neu.story.length<4) h+=`<label class="btn ${neu.story.length?"ghost":""} wide" style="margin-bottom:12px">📷 ${neu.story.length?"Noch ein Foto":"Erstes Foto wählen"} (${neu.story.length}/4)<input type="file" accept="image/*" id="sdatei" style="display:none"></label>`;
      return h+`${fehler?`<p style="color:var(--bad);font-weight:700">${esc(fehler)}</p>`:""}<button class="btn ok wide" id="senden" style="min-height:56px;font-size:19px" ${sendet?"disabled":""}>${sendet?"Wird gesendet …":"📤 An die Lehrkraft senden"}</button>`; }
    let h=`<div class="row" style="justify-content:space-between"><h2>${T.e} ${esc(T.t)}</h2><button class="btn sm ghost" id="zurueck">◀ zurück</button></div><div class="info">${esc(T.h)}</div>
      <div class="card"><b>1. Foto</b>${neu.bild?`<img class="vorschau" src="${neu.bild}">`:""}<label class="btn ${neu.bild?"ghost":""} wide" style="margin-top:6px">📷 ${neu.bild?"Anderes Foto":"Foto wählen"}<input type="file" accept="image/*" id="datei" style="display:none"></label></div>`;
    if(T.text) h+=`<div class="card"><b>2. Text</b><div class="small muted">Tippe auf einen Satzanfang oder schreib selbst:</div><div class="anf">${T.anf.map((a,i)=>`<button data-anf="${i}">${esc(a)}</button>`).join("")}</div>
      <textarea id="text" maxlength="300" placeholder="Schreib 2–3 Sätze …">${esc(neu.text)}</textarea></div>`;
    h+=`${fehler?`<p style="color:var(--bad);font-weight:700">${esc(fehler)}</p>`:""}<button class="btn ok wide" id="senden" style="min-height:56px;font-size:19px" ${sendet?"disabled":""}>${sendet?"Wird gesendet …":"📤 An die Lehrkraft senden"}</button>`;
    return h; }
  function meins(){ const L=liste().filter(([,x])=>x.pid===me.pid); const W=meineWartend().filter(w=>!FREI[w.id]);
    return `<p class="small muted" style="text-align:right;margin:0">Nicht ${esc(me.name)}? <a href="#" id="nameNeu">Namen ändern</a></p><h2>🙋 Meine Beiträge</h2>${W.length?`<div class="card">⏳ <b>${W.length}</b> ${W.length===1?"Beitrag wartet":"Beiträge warten"} auf die Freigabe:<br><span class="small muted">${W.map(w=>esc((TYPEN[w.typ]||{}).t||"")).join(" · ")}</span></div>`:""}
      ${L.length?L.map(([id,x])=>postHtml(id,x)).join(""):`<div class="card muted">Noch nichts freigegeben.</div>`}`; }
  function binde(){
    $$("[data-tab]").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; fehler=""; male(); window.scrollTo(0,0); });
    const nn=$("#nameNeu"); if(nn) nn.onclick=e=>{ e.preventDefault(); try{ localStorage.removeItem(MEKEY); }catch(x){} location.reload(); };
    $$("[data-tipp]").forEach(b=>b.onclick=()=>{ const [id,p]=b.dataset.tipp.split("|"); R(`frei/${id}/tipps/${me.pid}`).set(p); });
    $$("[data-re]").forEach(b=>b.onclick=()=>{ const [id,e]=b.dataset.re.split("|"); const alt=((FREI[id]||{}).reakt||{})[me.pid]; R(`frei/${id}/reakt/${me.pid}`).set(alt===e?null:e); });
    $$("[data-kom]").forEach(s=>s.onchange=()=>R(`frei/${s.dataset.kom}/kom/${me.pid}`).set(s.value===""?null:Number(s.value)));
    $$("[data-typ]").forEach(b=>b.onclick=()=>{ neu={typ:b.dataset.typ, bild:null, text:"", story:[]}; male(); });
    const z=$("#zurueck"); if(z) z.onclick=()=>{ neu={typ:null,bild:null,text:"",story:[]}; male(); };
    $$("[data-st]").forEach(t=>t.oninput=()=>neu.story[Number(t.dataset.st)].t=t.value);
    $$("[data-sweg]").forEach(b=>b.onclick=()=>{ neu.story.splice(Number(b.dataset.sweg),1); male(); });
    $$("[data-sanf]").forEach(b=>b.onclick=()=>{ const [i,k]=b.dataset.sanf.split("|").map(Number); const a=TYPEN[neu.typ].anf[k].replace(/ …$/,""); const z=neu.story[i]; z.t=(z.t.trim()?z.t.trim()+" ":"")+a+" "; male(); const tt=$(`[data-st="${i}"]`); if(tt){ tt.focus(); tt.selectionStart=tt.selectionEnd=tt.value.length; } });
    const sd=$("#sdatei"); if(sd) sd.onchange=async()=>{ const f=sd.files[0]; if(!f) return; fehler=""; try{ neu.story.push({b:await bildLesen(f, 700), t:""}); }catch(e){ fehler="Das Foto geht leider nicht. Versuch ein anderes."; } male(); };
    const t=$("#text"); if(t) t.oninput=()=>neu.text=t.value;
    $$("[data-anf]").forEach(b=>b.onclick=()=>{ const a=TYPEN[neu.typ].anf[Number(b.dataset.anf)].replace(/ …$/,""); neu.text=(neu.text.trim()?neu.text.trim()+" ":"")+a+" "; male(); const tt=$("#text"); if(tt){ tt.focus(); tt.selectionStart=tt.selectionEnd=tt.value.length; } });
    const d=$("#datei"); if(d) d.onchange=async()=>{ const f=d.files[0]; if(!f) return; fehler=""; try{ neu.bild=await bildLesen(f); }catch(e){ fehler="Das Foto geht leider nicht. Versuch ein anderes."; } male(); };
    const s=$("#senden"); if(s) s.onclick=async()=>{ const T=TYPEN[neu.typ];
      if(T.story){ if(neu.story.length<2){ fehler="Bitte wähle mindestens 2 Fotos."; return male(); } if(neu.story.some(z=>z.t.trim().length<5)){ fehler="Bitte schreib zu jedem Foto einen Satz."; return male(); } neu.bild=neu.story[0].b; }
      else if(!neu.bild) { fehler="Bitte wähle zuerst ein Foto."; return male(); } if(T.text && neu.text.trim().length<5){ fehler="Bitte schreib noch einen Satz."; return male(); }
      sendet=true; male(); const ref=R("eingang").push();
      try{ const daten={pid:me.pid, name:me.name, typ:neu.typ, text:T.text?neu.text.trim().slice(0,300):"", bild:T.story?"":neu.bild, ts:TS()}; if(T.story) daten.story=neu.story.map(z=>({b:z.b, t:z.t.trim().slice(0,160)}));
        if(T.story) daten.bild="story"; await ref.set(daten);
        const W=meineWartend(); W.push({id:ref.key, typ:neu.typ}); try{ localStorage.setItem("soz_warte_"+CODE, JSON.stringify(W.slice(-20))); }catch(e){}
        sendet=false; neu={typ:null,bild:null,text:"",story:[]}; tab="meins"; male(); }
      catch(e){ sendet=false; fehler="Senden hat nicht geklappt. Versuch es noch einmal."; male(); } };
  }
}

/* =========================================================
   LEHRKRAFT
   ========================================================= */
function leitung(){
  document.body.classList.add("lk"); let EIN={}, FREI={}, NAMEN={}, tab="eingang", korr={}, beamer=null;
  const G=p=>db.ref(`jugendliga/${KURS}/sozial${p?"/"+p:""}`);
  function login(f){ app.innerHTML=`<div class="wrap"><div class="card" style="margin-top:8vh"><h2>📱 Klassen-Netz leiten</h2><p class="muted">Anmeldung wie auf der Lehrer-Seite.</p>
    <form id="lf"><input id="lm" type="email" placeholder="E-Mail" style="width:100%;min-height:44px;border:2px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:8px"><input id="lp" type="password" placeholder="Passwort" style="width:100%;min-height:44px;border:2px solid var(--line);border-radius:12px;padding:6px 12px"><button class="btn wide" style="margin-top:10px">Anmelden</button></form><div style="color:var(--bad);font-weight:700;margin-top:8px">${esc(f||"")}</div></div></div>`;
    $("#lf").onsubmit=e=>{ e.preventDefault(); auth.signInWithEmailAndPassword($("#lm").value.trim(),$("#lp").value).catch(()=>login("E-Mail oder Passwort stimmt nicht.")); }; }
  if(!auth) return login("Anmeldung nicht verfügbar.");
  auth.onAuthStateChanged(async u=>{ if(!u) return login();
    try{ NAMEN=(await db.ref(`jugendliga/${KURS}/public/names`).once("value")).val()||{}; }catch(e){}
    let c=null; try{ c=(await G("code").once("value")).val(); }catch(e){}
    if(!c){ const Z="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; c=Array.from({length:6},()=>Z[Math.floor(Math.random()*Z.length)]).join(""); try{ await G("code").set(c); }catch(e){} }
    CODE=c; try{ await R("ok").set(true); }catch(e){}
    R("eingang").on("value",s=>{ EIN=s.val()||{}; male(); }, e=>{ app.innerHTML=`<div class="wrap"><div class="card"><h2>⚠️ Regeln fehlen</h2><p>Bitte aktualisiere einmal die Firebase-Regeln: Lehrer-Seite → ⚙️ Einstellungen → „Regeln kopieren“ → in Firebase einfügen → Veröffentlichen.</p></div></div>`; });
    R("frei").on("value",s=>{ FREI=s.val()||{}; male(); }); });
  const istTipp=()=>{ const a=document.activeElement; return a && ["TEXTAREA","INPUT"].includes(a.tagName); };
  function male(){ if(istTipp()) return; if(beamer) return beamerMalen();
    const E=Object.entries(EIN).filter(([,x])=>x&&x.typ).sort((a,b)=>(Number(a[1].ts)||0)-(Number(b[1].ts)||0));
    const F=Object.entries(FREI).filter(([,x])=>x&&x.typ).sort((a,b)=>(Number(b[1].frei)||0)-(Number(a[1].frei)||0));
    let h=`<div class="lkopf"><h1>📱 Klassen-Netz</h1><span>Klassen-Code:</span><span class="code">${CODE}</span><span class="small" style="opacity:.8">${esc(location.host+location.pathname)}</span>
      <span style="margin-left:auto" class="row"><button class="btn sm" id="bKind" style="background:var(--lila)">🎬 Beamer: Kinderfotos raten</button><button class="btn sm" id="bStory" style="background:var(--ok)">🎬 Beamer: Wochenend-Fotos</button><button class="btn sm ghost" id="bAlle">🎬 Beamer: andere Beiträge</button></span></div><div class="breit">
      <div class="ltabs"><button data-ltab="eingang" class="${tab==="eingang"?"an":""}">📥 Eingang (${E.length})</button><button data-ltab="frei" class="${tab==="frei"?"an":""}">✅ Freigegeben (${F.length})</button><button data-ltab="qr" class="${tab==="qr"?"an":""}">🔗 Code & QR</button></div>`;
    if(tab==="eingang") h+=E.length?`<div class="raster">${E.map(([id,x])=>{ const T=TYPEN[x.typ]||{}; return `<div class="card"><div class="row" style="justify-content:space-between"><b>${T.e} ${esc(x.name)}</b><span class="small muted">${esc(T.t)} · ${zeitText(x.ts)}</span></div>
        ${x.story?x.story.map((z,i)=>`<img src="${z.b}" style="width:100%;max-height:220px;object-fit:contain;background:#111;border-radius:12px;margin:8px 0 4px"><textarea data-korrs="${id}|${i}" style="min-height:52px">${esc(korr[id+"|"+i]!==undefined?korr[id+"|"+i]:z.t)}</textarea>`).join("")+`<div class="small muted">Du kannst die Sätze korrigieren.</div>`
          :x.bild?`<img src="${x.bild}" style="width:100%;max-height:320px;object-fit:contain;background:#111;border-radius:12px;margin:8px 0">`:""}
        ${T.text?`<textarea data-korr="${id}" style="min-height:70px">${esc(korr[id]!==undefined?korr[id]:x.text)}</textarea><div class="small muted">Du kannst den Text korrigieren. Die Jugendlichen sehen „von der Lehrkraft korrigiert“.</div>`:""}
        <div class="row" style="margin-top:8px"><button class="btn ok" data-frei="${id}">✅ Freigeben</button><button class="btn rot" data-weg="${id}">✖ Ablehnen</button></div></div>`; }).join("")}</div>`
      :`<div class="card muted">Keine neuen Beiträge. Neue Einreichungen erscheinen hier automatisch.</div>`;
    if(tab==="frei") h+=F.length?`<div class="raster">${F.map(([id,x])=>{ const T=TYPEN[x.typ]||{}; const tp=x.tipps||{}; const r=Object.values(tp).filter(v=>v===x.pid).length;
        return `<div class="card"><div class="row" style="justify-content:space-between"><b>${T.e} ${esc(x.name)}</b><span class="small muted">${esc(T.t)}</span></div>
        ${x.story?`<div class="row">${x.story.map(z=>`<img src="${z.b}" style="width:23%;aspect-ratio:1;object-fit:cover;border-radius:8px">`).join("")}</div>${x.story.map((z,i)=>`<div class="small">${i+1}. ${esc(z.t)}</div>`).join("")}`
          :x.bild?`<img src="${x.bild}" style="width:100%;max-height:240px;object-fit:contain;background:#111;border-radius:12px;margin:8px 0">`:""}${x.text?`<p>${esc(x.text)}</p>`:""}
        <div class="small muted">${Object.keys(x.reakt||{}).length} Reaktionen · ${Object.keys(x.kom||{}).length} Kommentare${x.typ==="kind"?` · ${Object.keys(tp).length} Tipps, ${r} richtig`:""}</div>
        <div class="row" style="margin-top:8px">${x.typ==="kind"?`<button class="btn sm ${x.zeigen?"ghost":""}" data-zeig="${id}">${x.zeigen?"🙈 Wieder verstecken":"👶 Auflösen"}</button>`:""}<button class="btn sm rot" data-loesch="${id}">🗑 Löschen</button></div></div>`; }).join("")}</div>`
      :`<div class="card muted">Noch nichts freigegeben.</div>`;
    if(tab==="qr") h+=`<div class="card mitte"><h2>So kommen die Jugendlichen rein</h2><p style="font-size:22px"><b>${esc(location.host+location.pathname)}</b><br>Klassen-Code: <span class="code">${CODE}</span></p><div id="qr" style="display:inline-block;margin:10px"></div>
      <p class="small muted">Der Code schützt die Fotos: Ohne Code sieht niemand etwas. Neuer Code = alle müssen den neuen Code eingeben (die alten Beiträge bleiben beim alten Code).</p><button class="btn ghost" id="neuCode">🔄 Neuen Code erzeugen</button></div>`;
    app.innerHTML=h+`</div>`; binde();
    if(tab==="qr"&&window.QRCode){ new QRCode($("#qr"),{text:location.origin+location.pathname+"?code="+CODE,width:220,height:220}); } }
  function binde(){
    $$("[data-ltab]").forEach(b=>b.onclick=()=>{ tab=b.dataset.ltab; male(); });
    $$("[data-korr]").forEach(t=>{ t.oninput=()=>korr[t.dataset.korr]=t.value; t.onblur=()=>setTimeout(male,50); });
    $$("[data-korrs]").forEach(t=>{ t.oninput=()=>korr[t.dataset.korrs]=t.value; t.onblur=()=>setTimeout(male,50); });
    $$("[data-frei]").forEach(b=>b.onclick=async()=>{ const id=b.dataset.frei; const x=EIN[id]; if(!x) return; const neuT=korr[id]!==undefined?korr[id].trim():x.text;
      const post={pid:x.pid, name:x.name, typ:x.typ, text:neuT||"", bild:x.bild||"", ts:x.ts||null, frei:TS()}; if(neuT!==x.text&&x.text) post.orig=x.text;
      if(x.story){ post.bild=""; post.story=x.story.map((z,i)=>{ const k=id+"|"+i; const t=korr[k]!==undefined?korr[k].trim():z.t; if(t!==z.t) post.orig=true; delete korr[k]; return {b:z.b, t}; }); }
      await R(`frei/${id}`).set(post); await R(`eingang/${id}`).remove(); delete korr[id]; });
    $$("[data-weg]").forEach(b=>b.onclick=()=>{ if(confirm("Beitrag ablehnen und löschen?")) R(`eingang/${b.dataset.weg}`).remove(); });
    $$("[data-zeig]").forEach(b=>b.onclick=()=>R(`frei/${b.dataset.zeig}/zeigen`).set(!(FREI[b.dataset.zeig]||{}).zeigen));
    $$("[data-loesch]").forEach(b=>b.onclick=()=>{ if(confirm("Beitrag für alle löschen?")) R(`frei/${b.dataset.loesch}`).remove(); });
    const nc=$("#neuCode"); if(nc) nc.onclick=async()=>{ if(!confirm("Wirklich einen neuen Code erzeugen?")) return; await G("code").remove(); location.reload(); };
    const bk=$("#bKind"); if(bk) bk.onclick=()=>{ beamer={art:"kind", i:0}; beamerMalen(); };
    const ba=$("#bAlle"); if(ba) ba.onclick=()=>{ beamer={art:"alle", i:0}; beamerMalen(); };
    const bs=$("#bStory"); if(bs) bs.onclick=()=>{ beamer={art:"story", i:0}; beamerMalen(); }; }
  /* ---------- Beamer: ein Beitrag groß, Tipps live ---------- */
  function beamerMalen(){ const L0=Object.entries(FREI).filter(([,x])=>x&&x.typ&&(beamer.art==="alle"?x.typ!=="kind":beamer.art==="story"?x.typ==="story":x.typ==="kind")).sort((a,b)=>(Number(a[1].frei)||0)-(Number(b[1].frei)||0));
    const L=L0.flatMap(([id,x])=>x.story?x.story.map((z,i)=>[id, Object.assign({}, x, {bild:z.b, text:z.t, nr:`Foto ${i+1} von ${x.story.length}`})]):[[id,x]]);
    if(!L.length){ beamer=null; alert("Dazu ist noch nichts freigegeben."); return male(); }
    beamer.i=Math.max(0,Math.min(beamer.i,L.length-1)); const [id,x]=L[beamer.i]; const T=TYPEN[x.typ]||{}; const kind=x.typ==="kind"; const tp=x.tipps||{};
    const zaehl={}; Object.values(tp).forEach(p=>zaehl[p]=(zaehl[p]||0)+1); const top=Object.entries(zaehl).sort((a,b)=>b[1]-a[1]).slice(0,5);
    app.innerHTML=`<div class="beamer"><div class="row" style="justify-content:space-between"><h2>${T.e} ${kind&&!x.zeigen?"Wer ist das?":esc(x.name)}${x.nr?` <span style="font-size:.5em;opacity:.8">· ${x.nr}</span>`:""}</h2><span style="font-size:22px">${beamer.i+1} / ${L.length}</span></div>
      <div class="bild">${x.bild?`<img src="${x.bild}">`:""}</div>
      ${x.text?`<div class="txt">${esc(x.text)}</div>`:""}
      ${kind?`<div style="font-size:24px;margin-top:8px">${x.zeigen?`👶 Das ist <b style="color:var(--gold)">${esc(x.name)}</b>! · Richtig geraten: ${Object.entries(tp).filter(([,v])=>v===x.pid).map(([p])=>esc(NAMEN[p]||"?")).join(", ")||"niemand"}`:`📱 ${Object.keys(tp).length} Tipps · ${top.map(([p,n])=>`${esc(NAMEN[p]||"?")} (${n})`).join(" · ")}`}</div>`:""}
      <div class="fuss"><button class="btn ghost" id="bZur">◀</button>${kind?`<button class="btn" style="background:var(--gold);color:var(--ink);font-size:20px" id="bAuf">${x.zeigen?"🙈 Verstecken":"👶 Auflösen"}</button>`:""}<button class="btn" id="bVor" style="font-size:20px">Weiter ▶</button><button class="btn rot" id="bEnde" style="margin-left:auto">✖ Beamer schließen</button></div></div>`;
    $("#bZur").onclick=()=>{ beamer.i--; beamerMalen(); }; $("#bVor").onclick=()=>{ beamer.i++; beamerMalen(); }; $("#bEnde").onclick=()=>{ beamer=null; male(); };
    const a=$("#bAuf"); if(a) a.onclick=()=>R(`frei/${id}/zeigen`).set(!x.zeigen); }
}
if(!db) app.innerHTML=`<div class="wrap"><div class="card">Keine Verbindung.</div></div>`;
else if(P.get("leitung")) leitung(); else lernende();
</script>
