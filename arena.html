<style>
:root{
  --bg:#F4F1EA; --card:#FFFFFF; --ink:#1E2A44; --muted:#6B7280; --line:#E5E0D5; --soft:#FAF8F3;
  --nacht:#1A1033; --nacht-2:#2A1C4F; --pri:#6D28D9; --pri-2:#EDE4FF; --acc:#FF6B4A; --gold:#F5B82E; --ok:#14A37F; --ok-2:#E2F6EF; --bad:#E2483D; --bad-2:#FDE8E6;
  --head:"Outfit",system-ui,sans-serif; --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --schatten:0 1px 0 var(--line),0 8px 24px rgba(30,42,68,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{color:#1E2A44;background-color:#fff}
input::placeholder,textarea::placeholder{color:#8A8F9C}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:14px}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px 50px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--schatten);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:0;background:var(--pri);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn.sm{min-height:34px;padding:4px 12px;font-size:15px;border-radius:10px}
.btn.ghost{background:var(--pri-2);color:var(--pri)} .btn.hell{background:rgba(255,255,255,.14);color:#fff}
.btn.acc{background:var(--acc)} .btn.ok{background:var(--ok)} .btn.gold{background:var(--gold);color:var(--ink)} .btn.rot{background:var(--bad)}
.btn.wide{width:100%} .btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--bad);font-weight:700;min-height:22px;margin-top:8px}
input[type=text],input[type=number],select{min-height:44px;border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:#fff}
.pin-in{width:100%;font-family:var(--head);font-size:34px;letter-spacing:.3em;text-align:center}
/* Handy */
.kopf{color:#fff;position:sticky;top:0;z-index:5;background:var(--nacht)}
.kopf .in{max-width:640px;margin:0 auto;padding:8px 12px;display:flex;gap:10px;align-items:center;min-height:56px}
.kopf b{font-family:var(--head);font-size:19px} .kopf .r{margin-left:auto;font-family:var(--head);font-weight:800;color:var(--gold)}
.dran{background:linear-gradient(135deg,#FF6B4A,#F5B82E);color:#1E2A44;border-radius:18px;padding:16px;margin-bottom:12px;text-align:center;animation:puls 1.4s infinite}
@keyframes puls{50%{transform:scale(1.02)}}
.namen{display:flex;flex-wrap:wrap;gap:6px}
.namen button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;min-height:56px;padding:8px 14px;text-align:left;cursor:pointer;font-weight:700;font-size:19px}
.opt.ok{background:var(--ok-2);border-color:var(--ok)} .opt.falsch{background:var(--bad-2);border-color:var(--bad)}
.gross{font-family:var(--head);font-weight:800;font-size:26px;line-height:1.2}
.linie{min-height:56px;border:3px dashed var(--line);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.kachel{min-height:44px;padding:6px 12px;border-radius:10px;border:0;background:var(--pri);color:#fff;font-weight:700;font-size:18px;cursor:pointer}
.kachel.weg{visibility:hidden}
.pool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.wort{font-family:var(--head);font-weight:900;font-size:clamp(26px,9vw,40px);text-align:center;margin:10px 0;line-height:1.1;overflow-wrap:anywhere;hyphens:auto}
.verboten{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.verboten span{background:var(--bad-2);color:var(--bad);border-radius:999px;padding:3px 10px;font-weight:700;text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:15px}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vote button{min-height:110px;border-radius:18px;border:4px solid var(--line);background:#fff;font-family:var(--head);font-weight:800;font-size:22px;cursor:pointer}
.vote button.an{border-color:var(--pri);background:var(--pri-2)}
.feld label{display:block;font-weight:800;margin-top:10px} .feld input{width:100%}
.feld .tipp{font-size:13px;color:var(--muted)}
/* Leinwand */
body.board{background:var(--nacht);color:#fff}
body.board .card{background:var(--nacht-2);box-shadow:none;color:#fff}
.bkopf{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:rgba(0,0,0,.25)}
.bkopf h1{margin:0;font-size:26px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:700;background:rgba(255,255,255,.12)}
.chip.gold{background:var(--gold);color:var(--ink)}
.bwrap{padding:16px 20px;max-width:1500px;margin:0 auto}
.tafel{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.team{flex:1;min-width:150px;border-radius:16px;padding:10px 14px;background:rgba(255,255,255,.07);border-top:6px solid var(--f);position:relative}
.team b{font-family:var(--head);font-size:20px} .team .p{font-family:var(--head);font-weight:900;font-size:44px;color:var(--gold);line-height:1}
.team.aktiv{background:rgba(255,255,255,.16)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;text-align:center;margin:10px 0}
.vs .seite{border-radius:24px;padding:24px;background:rgba(255,255,255,.08);border:5px solid var(--f)}
.vs .seite h2{font-size:clamp(30px,4vw,56px);margin:0 0 6px}
.vs .seite .tn{font-size:clamp(18px,2vw,26px);opacity:.85}
.vs .x{font-family:var(--head);font-weight:900;font-size:clamp(50px,7vw,110px);color:var(--gold)}
.uhr{font-family:var(--head);font-weight:900;font-size:clamp(70px,10vw,150px);line-height:1;color:var(--gold);text-align:center}
.typband{display:flex;gap:16px;align-items:center;justify-content:center;font-family:var(--head);font-weight:800;font-size:clamp(26px,3vw,44px);margin:6px 0 10px}
.steuer{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);padding:10px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:20}
.steuer select{min-height:40px}
.balken{height:22px;border-radius:11px;background:rgba(255,255,255,.12);overflow:hidden;margin:6px 0}
.balken i{display:block;height:100%;background:var(--f,var(--gold))}
.lobbygrid{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.lwpin{font-family:var(--head);font-weight:900;font-size:90px;letter-spacing:.08em;color:var(--gold);line-height:1}
.spieler{display:flex;flex-wrap:wrap;gap:6px}
.spieler button{border:0;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer;color:#fff;background:var(--f,rgba(255,255,255,.15))}
.plan{background:#fff;color:var(--ink);border-radius:18px;padding:18px;font-size:clamp(18px,1.8vw,26px)}
.plan div{margin:4px 0}
.wolke{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.wolke button{border:0;border-radius:999px;padding:6px 14px;font-weight:800;font-size:20px;cursor:pointer;background:#fff;color:var(--ink)}
.wolke button.weg{text-decoration:line-through;opacity:.4}
.rolle{background:#fff;color:var(--ink);border-radius:16px;padding:14px;font-size:clamp(17px,1.7vw,24px)}
.ergebnis{font-family:var(--head);font-weight:900;font-size:clamp(40px,5vw,80px);text-align:center;color:var(--gold)}
@media (max-width:900px){ .vs{grid-template-columns:1fr} .lobbygrid{grid-template-columns:1fr} }
</style>
</head>

<script>
/* =========================================================
   ARENA-DUELL – Live-Spiel mit Handys, eigenständig (ohne Lernwelt-Punkte)
   Leinwand: arena.html?leitung=1     Handy: arena.html?pin=1234 (oder live.html)
   Daten: ligaarena/ploen-jik/{PIN}/…
   ========================================================= */
const KURS="ploen-jik", ROOT=`ligaarena/${KURS}`;
const cfg={apiKey:"AIzaSyBDChXlm34Kr7Gg0Dw458GiiwoLnWJAnxM",authDomain:"lern-deutsch-arash.firebaseapp.com",databaseURL:"https://lern-deutsch-arash-default-rtdb.europe-west1.firebasedatabase.app",projectId:"lern-deutsch-arash"};
let db=null, offset=0; try{ firebase.initializeApp(cfg); db=firebase.database(); db.ref(".info/serverTimeOffset").on("value",s=>offset=Number(s.val())||0); }catch(e){}
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const jetzt=()=>Date.now()+offset; const TS=()=>firebase.database.ServerValue.TIMESTAMP;
function rnd(n){ try{ return Math.floor(crypto.getRandomValues(new Uint32Array(1))[0]/4294967296*n); }catch(e){ return Math.floor(Math.random()*n); } }
function mische(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const P=new URLSearchParams(location.search); let PIN=(P.get("pin")||"").replace(/\D/g,"");
const I=p=>db.ref(`${ROOT}/${PIN}${p?"/"+p:""}`);
const app=$("#app");
const rest=R=>R&&R.ende?Math.max(0,Math.ceil((R.ende-jetzt())/1000)):0;
const mmss=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const norm=s=>String(s||"").toLowerCase().replace(/[.,!?;:"„“]/g,"").replace(/\s+/g," ").trim();
const WOERTER=((window.WORT_LISTEN||{}).a2||{woerter:[]}).woerter.filter(w=>w[1].includes("e"));
/* Pantomime: nur schwierigere zusammengesetzte Wörter (lang, mit Pantomime-Modus) */
const KOMPOSITA=((window.WORT_LISTEN||{}).a2||{woerter:[]}).woerter.filter(w=>w[3]==="Zusammengesetzte Wörter" && w[1].includes("p") && w[0].length>=9);
const listeFuer=R=>R.typ==="pantomime"?KOMPOSITA:WOERTER;

const NAMENSETS={
  tiere:{t:"🦁 Tiere", l:[{n:"Löwen",e:"🦁",f:"#F59E0B"},{n:"Adler",e:"🦅",f:"#3B82F6"},{n:"Wölfe",e:"🐺",f:"#64748B"},{n:"Delfine",e:"🐬",f:"#06B6D4"},{n:"Füchse",e:"🦊",f:"#F97316"},{n:"Bären",e:"🐻",f:"#A16207"}]},
  farben:{t:"🎨 Farben", l:[{n:"Rot",e:"🔴",f:"#E2483D"},{n:"Blau",e:"🔵",f:"#3B82F6"},{n:"Grün",e:"🟢",f:"#14A37F"},{n:"Gelb",e:"🟡",f:"#EAB308"},{n:"Lila",e:"🟣",f:"#8B5CF6"},{n:"Orange",e:"🟠",f:"#F97316"}]},
  planeten:{t:"🪐 Planeten", l:[{n:"Merkur",e:"☄️",f:"#94A3B8"},{n:"Venus",e:"✨",f:"#EAB308"},{n:"Erde",e:"🌍",f:"#3B82F6"},{n:"Mars",e:"🔴",f:"#E2483D"},{n:"Jupiter",e:"🪐",f:"#F97316"},{n:"Saturn",e:"💫",f:"#8B5CF6"}]},
  obst:{t:"🍎 Obst", l:[{n:"Äpfel",e:"🍎",f:"#E2483D"},{n:"Bananen",e:"🍌",f:"#EAB308"},{n:"Trauben",e:"🍇",f:"#8B5CF6"},{n:"Kiwis",e:"🥝",f:"#14A37F"},{n:"Orangen",e:"🍊",f:"#F97316"},{n:"Kirschen",e:"🍒",f:"#BE185D"}]},
  wetter:{t:"⛅ Wetter", l:[{n:"Sonne",e:"☀️",f:"#EAB308"},{n:"Blitz",e:"⚡",f:"#8B5CF6"},{n:"Regen",e:"🌧️",f:"#3B82F6"},{n:"Schnee",e:"❄️",f:"#06B6D4"},{n:"Wind",e:"🌪️",f:"#64748B"},{n:"Regenbogen",e:"🌈",f:"#E2483D"}]},
  staedte:{t:"🏙️ Städte", l:[{n:"Berlin",e:"🐻",f:"#E2483D"},{n:"Hamburg",e:"⚓",f:"#3B82F6"},{n:"München",e:"🥨",f:"#06B6D4"},{n:"Köln",e:"⛪",f:"#64748B"},{n:"Kiel",e:"⛵",f:"#14A37F"},{n:"Plön",e:"🏰",f:"#F97316"}]},
  edelsteine:{t:"💎 Edelsteine", l:[{n:"Rubin",e:"❤️",f:"#E2483D"},{n:"Saphir",e:"💙",f:"#3B82F6"},{n:"Smaragd",e:"💚",f:"#14A37F"},{n:"Gold",e:"🥇",f:"#EAB308"},{n:"Amethyst",e:"💜",f:"#8B5CF6"},{n:"Diamant",e:"💎",f:"#06B6D4"}]}
};
let namenSet="tiere"; const TEAMVORLAGE=NAMENSETS.tiere.l;
const vorlage=()=>NAMENSETS[namenSet]?NAMENSETS[namenSet].l:TEAMVORLAGE;
const TYPEN={
  quiz:     {n:"Blitz-Quiz",     e:"⚡", text:"6 Fragen am Handy – richtig UND schnell!", sek:75},
  satz:     {n:"Satz-Duell",     e:"🧩", text:"Baut 4 Sätze am Handy. Wer schafft mehr?", sek:100},
  sprint:   {n:"Wörter-Sprint",  e:"📝", text:"45 Sekunden: Schreibt so viele Wörter zum Thema wie möglich!", sek:45},
  erklaeren:{n:"Erklär-Duell",   e:"🗣️", text:"Erklärt Wörter – ohne die verbotenen Wörter! 60 Sekunden pro Seite.", sek:60},
  pantomime:{n:"Pantomime",      e:"🎭", text:"Zusammengesetzte Wörter vorspielen – ohne Sprechen! Passen kostet 1 Punkt.", sek:75},
  gespraech:{n:"Gespräch",       e:"💬", text:"Spielt eine Situation. Das Publikum stimmt ab!", sek:90},
  party:    {n:"Party planen",   e:"🎉", text:"Plant eine Party am Handy und präsentiert sie. Das Publikum stimmt ab!", sek:150},
  janein:   {n:"Ja-Nein-Verbot", e:"🙅", text:"Das Publikum fragt. Wer „ja“ oder „nein“ sagt, ist raus!", sek:60}
};
function schritte(R){ switch(R.typ){
  case "quiz": case "satz": return ["vs","los","ergebnis"];
  case "sprint": return ["vs","los","pruefen","ergebnis"];
  case "erklaeren": case "pantomime": case "janein": return ["vs","a","b","ergebnis"];
  case "gespraech": return R.fmt===1 ? ["vs","zusammen","abstimmung","ergebnis"] : ["vs","a","b","abstimmung","ergebnis"];
  case "party": return ["vs","planen","a","b","abstimmung","ergebnis"];
} return ["vs","ergebnis"]; }
const zeitVon=(R,s)=>({los:TYPEN[R.typ].sek, planen:150, a:R.typ==="party"?60:R.typ==="janein"?60:TYPEN[R.typ].sek, b:R.typ==="party"?60:R.typ==="janein"?60:TYPEN[R.typ].sek, zusammen:90, abstimmung:25})[s]||0;

/* Seiten-Wertung (wird auf Leinwand und Handy gleich berechnet) */
function wertung(S,R){
  const D=((S.rd||{})[R.nr])||{}; const w={a:0,b:0}, info={a:"",b:""};
  ["a","b"].forEach(sd=>{ const ids=R[sd].ids||[];
    if(R.typ==="quiz"||R.typ==="satz"){ let ok=0, zeit=0; const key=R.typ==="quiz"?"q":"s"; ids.forEach(p=>Object.values(((D[key]||{})[p])||{}).forEach(x=>{ if(x&&x.ok) ok++; zeit+=Number(x&&x.t)||0; })); w[sd]=ok+Math.max(0,1-zeit/1e7)*0; info[sd]=`${ok} richtig`; w[sd+"z"]=zeit; }
    if(R.typ==="sprint"){ const weg=D.weg||{}; const set=new Set(); Object.entries(((D.w||{})[sd])||{}).forEach(([k,x])=>{ if(!weg[k] && x && x.w) set.add(norm(x.w)); }); w[sd]=set.size; info[sd]=`${set.size} ${set.size===1?"Wort":"Wörter"}`; }
    if(R.typ==="erklaeren"){ const e=((D.e||{})[sd])||{}; w[sd]=Number(e.ok)||0; info[sd]=`${w[sd]} erraten`; }
    if(R.typ==="pantomime"){ const e=((D.e||{})[sd])||{}; const ok=Number(e.ok)||0, pa=Number(e.skip)||0; w[sd]=ok-pa; info[sd]=`${ok} erraten${pa?`, ${pa}× gepasst`:""} = ${ok-pa}`; }
    if(R.typ==="janein"){ const s=Number(((D.j||{})[sd]))||0; w[sd]=s; info[sd]=`${s} ${s===1?"Sekunde":"Sekunden"}`; }
    if(["gespraech","party"].includes(R.typ)){ const v=Object.values(D.v||{}).filter(x=>x===sd).length; w[sd]=v; info[sd]=`${v} Stimme${v===1?"":"n"}`; }
  });
  let sieger = w.a>w.b?"a":w.b>w.a?"b":null;
  if(!sieger && (R.typ==="quiz"||R.typ==="satz") && w.a>0 && w.az!==w.bz) sieger = w.az<w.bz?"a":"b";
  return {w, info, sieger};
}

/* =========================================================
   HANDY
   ========================================================= */
function handy(){
  let me=null, S={}, namen={}, lokal={qi:0, si:0, gelegt:[], satzFb:null, sprintFb:""}, rundeNr=null;
  const MEKEY=()=>`arena_me_${PIN}`;
  function pinScreen(f){ app.innerHTML=`<div class="wrap"><div class="card" style="margin-top:8vh;text-align:center"><div style="font-size:56px">🏟️</div><h2>Arena-Duell</h2><p class="muted">Gib die PIN von der Leinwand ein.</p>
    <form id="pf"><input id="pin" class="pin-in" inputmode="numeric" maxlength="4" value="${esc(PIN)}"><button class="btn wide" style="margin-top:10px">Weiter</button></form><div class="err">${esc(f||"")}</div></div></div>`;
    $("#pf").onsubmit=e=>{ e.preventDefault(); PIN=$("#pin").value.replace(/\D/g,""); pruefe(); }; }
  async function pruefe(){ if(PIN.length!==4) return pinScreen(PIN?"Die PIN hat 4 Ziffern.":"");
    const i=(await I("info").once("value")).val(); if(!i) return pinScreen("Diese PIN gibt es nicht.");
    history.replaceState(null,"","?pin="+PIN);
    try{ me=JSON.parse(localStorage.getItem(MEKEY())||"null"); }catch(e){}
    if(me) return los(); namenWahl(); }
  async function namenWahl(){
    try{ namen=(await db.ref(`jugendliga/${KURS}/public/names`).once("value")).val()||{}; }catch(e){ namen={}; }
    let lw=null; try{ lw=JSON.parse(localStorage.getItem(`liga_code_${KURS}`)||"null"); }catch(e){}
    const ids=Object.keys(namen).sort((a,b)=>String(namen[a]).localeCompare(namen[b]));
    app.innerHTML=`<div class="wrap"><div class="card" style="margin-top:4vh"><h2>Wer bist du?</h2><p class="muted">Tippe auf deinen Namen.</p>
      <div class="namen">${ids.map(p=>`<button data-p="${p}" ${lw&&lw.pid===p?'style="border-color:var(--pri);background:var(--pri-2)"':""}>${esc(namen[p])}</button>`).join("")}</div>
      <form id="nf" class="row" style="margin-top:14px"><input id="nn" type="text" placeholder="anderer Name" maxlength="20" style="flex:1"><button class="btn">OK</button></form></div></div>`;
    $$("[data-p]").forEach(b=>b.onclick=()=>{ me={pid:b.dataset.p, name:namen[b.dataset.p]}; speichernMe(); });
    $("#nf").onsubmit=e=>{ e.preventDefault(); const n=$("#nn").value.trim(); if(!n) return; me={pid:"g"+Math.random().toString(36).slice(2,9), name:n.slice(0,20)}; speichernMe(); };
  }
  function speichernMe(){ try{ localStorage.setItem(MEKEY(), JSON.stringify(me)); }catch(e){} los(); }
  function los(){ const r=I(`spieler/${me.pid}`); r.update({name:me.name, ts:TS(), online:true}); try{ r.child("online").onDisconnect().set(false); }catch(e){}
    I().on("value", s=>{ S=s.val()||{}; male(); });

    on("tausch", ()=>neuesDuell(true));
    on("next", weiterSchritt);
    on("plus", ()=>I("runde/ende").set(Math.max(jetzt(),(S.runde&&S.runde.ende)||jetzt())+30000));
    on("abbruch", ()=>{ if(confirm("Duell abbrechen? Es gibt keine Punkte.")) I("runde").set(null); });
    on("jnraus", ()=>{ const R=S.runde; const s=Math.min(60, Math.floor((jetzt()-(R.start||jetzt()))/1000)); I(`rd/${R.nr}/j/${R.schritt}`).set(s); });
    $$("[data-weg]").forEach(b=>b.onclick=()=>{ const R=S.runde; const k=b.dataset.weg; const ist=(((S.rd||{})[R.nr]||{}).weg||{})[k]; I(`rd/${R.nr}/weg/${k}`).set(ist?null:true); });
    $$("[data-plus]").forEach(b=>b.onclick=()=>I(`punkte/${b.dataset.plus}`).set(((S.punkte||{})[b.dataset.plus]||0)+Number(b.dataset.w)));
    on("beenden", ()=>{ if(confirm("Spiel beenden und Sieger zeigen?")) I("info/phase").set("ende"); });
    on("weiter", ()=>I("info/phase").set("spiel"));
    on("neu", ()=>{ if(!confirm("Ein neues Spiel mit neuer PIN starten?")) return; I().off(); try{ localStorage.removeItem("arena_leitung_pin"); }catch(e){} PIN=""; start(); });
  }
  function ende(){
    const rang=teams().sort((a,b)=>((S.punkte||{})[b[0]]||0)-((S.punkte||{})[a[0]]||0));
    return `<div class="bwrap" style="text-align:center"><h1 style="font-size:64px;margin-top:20px">🏆 ${rang[0]?`${rang[0][1].e} ${esc(rang[0][1].n)} gewinnt!`:""}</h1>
      ${rang.map(([k,t],i)=>`<div class="card" style="max-width:700px;margin:10px auto;display:flex;justify-content:space-between;font-size:30px;border-left:10px solid ${t.f}"><b>${["🥇","🥈","🥉"][i]||i+1+"."} ${t.e} ${esc(t.n)}</b><b style="color:var(--gold)">${(S.punkte||{})[k]||0}</b></div>`).join("")}
      <p style="opacity:.75">${(S.verlauf||[]).length} Duelle gespielt</p></div>`;
  }
  if(!db){ app.innerHTML="Keine Verbindung."; return; }
  start();
}

P.get("leitung") ? leitung() : handy();
</script>
