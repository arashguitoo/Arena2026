<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2A44">
<meta name="robots" content="noindex, nofollow">
<title>Live mitspielen</title>
<style>
:root{--bg:#F4F1EA;--ink:#1E2A44;--muted:#6B7280;--line:#E5E0D5;--pri:#3B4FD8;--bad:#E2483D}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px}
.card{max-width:440px;margin:10vh auto 0;background:#fff;border-radius:18px;padding:24px 20px;text-align:center;box-shadow:0 6px 20px rgba(30,42,68,.08)}
h1{font-size:28px;margin:6px 0} input{font:inherit;font-size:40px;letter-spacing:.3em;text-align:center;width:100%;min-height:64px;border:2px solid var(--line);border-radius:14px;margin-top:10px}
button{font:inherit;font-weight:700;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--pri);color:#fff;margin-top:10px;cursor:pointer}
.err{color:var(--bad);font-weight:700;min-height:24px;margin-top:10px} .muted{color:var(--muted)}
</style>
</head>
<body>
<div class="card"><div style="font-size:56px">🎮</div><h1>Live mitspielen</h1><p class="muted">Gib die PIN von der Leinwand ein.</p>
<form id="f"><input id="pin" inputmode="numeric" maxlength="4" autocomplete="off"><button>Los ➜</button></form><div class="err" id="err"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* Eine PIN für alle Live-Spiele: findet das laufende Spiel und leitet weiter */
const KURS="ploen-jik";
const cfg={apiKey:"AIzaSyBDChXlm34Kr7Gg0Dw458GiiwoLnWJAnxM",authDomain:"lern-deutsch-arash.firebaseapp.com",databaseURL:"https://lern-deutsch-arash-default-rtdb.europe-west1.firebasedatabase.app",projectId:"lern-deutsch-arash"};
let db=null; try{ firebase.initializeApp(cfg); db=firebase.database(); }catch(e){}
const $=s=>document.querySelector(s);
const SPIELE=[
  {pfad:p=>`ligajagd/${KURS}/${p}/info`, ziel:p=>`jagd.html?pin=${p}`},
  {pfad:p=>`ligachat/${KURS}/${p}/info`, ziel:p=>`chat.html?pin=${p}`},
  {pfad:p=>`ligavote/${KURS}/${p}/info`, ziel:p=>`abstimmung.html?pin=${p}`},
  {pfad:p=>`ligaactivity/${KURS}/${p}/info`, ziel:p=>`activity.html?pin=${p}`}
];
async function suche(pin){
  $("#err").textContent="Suche …";
  try{
    const treffer=(await Promise.all(SPIELE.map(s=>db.ref(s.pfad(pin)).once("value").then(x=>{ const v=x.val(); return v?{s, aktiv:v.phase!=="ende", t:Number(v.erstellt)||0}:null; })))).filter(Boolean);
    treffer.sort((a,b)=>(b.aktiv-a.aktiv)||(b.t-a.t));
    if(treffer.length){ location.replace(treffer[0].s.ziel(pin)); return; }
    const st=(await db.ref(`jugendliga/${KURS}/battle/state`).once("value")).val();
    if(st && String(st.pin)===pin){ location.replace("a1-live-perfekt.html?pin="+pin); return; }
    $("#err").textContent="Diese PIN gibt es nicht. Schau noch einmal auf die Leinwand.";
  }catch(e){ $("#err").textContent="Keine Verbindung. Prüfe dein Internet."; }
}
$("#f").onsubmit=e=>{ e.preventDefault(); const p=$("#pin").value.replace(/\D/g,""); if(p.length===4) suche(p); else $("#err").textContent="Die PIN hat 4 Ziffern."; };
$("#pin").oninput=()=>{ const p=$("#pin").value.replace(/\D/g,""); if(p.length===4) suche(p); };
const p0=(new URLSearchParams(location.search).get("pin")||"").replace(/\D/g,"");
if(p0.length===4){ $("#pin").value=p0; suche(p0); } else $("#pin").focus();
</script>
</body>
</html>
