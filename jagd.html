<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Schnitzeljagd – Plön</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA; --card:#FFFFFF; --ink:#1E2A44; --muted:#6B7280; --line:#E5E0D5;
  --pri:#3B4FD8; --pri-2:#E8EBFF; --acc:#FF6B4A; --gold:#F5B82E; --ok:#14A37F; --ok-2:#E2F6EF; --bad:#E2483D; --bad-2:#FDE8E6;
  --head:"Outfit",system-ui,sans-serif; --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;min-height:100vh}
button{font:inherit;color:inherit}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:0 0 8px}
h2{font-size:26px} h3{font-size:20px}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px 60px}
.wrap.weit{max-width:1180px}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 1px 0 var(--line),0 6px 20px rgba(30,42,68,.06);margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:0;background:var(--pri);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn.sm{min-height:36px;padding:6px 12px;font-size:15px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri-2)}
.btn.acc{background:var(--acc)} .btn.ok{background:var(--ok)} .btn.gold{background:var(--gold);color:var(--ink)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)} .small{font-size:14px}
.err{color:var(--bad);font-weight:700;min-height:22px;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=email],input[type=password],select{font:inherit;min-height:46px;border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:#fff;color:var(--ink)}
.pin-in{font-family:var(--head);font-size:34px;letter-spacing:.3em;text-align:center;width:100%}
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.topbar .in{max-width:680px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px;min-height:56px}
.topbar .dot{width:14px;height:14px;border-radius:50%;flex:none}
.topbar b{font-family:var(--head);font-size:19px}
.topbar .sp{margin-left:auto;display:flex;gap:14px;align-items:center;font-family:var(--head);font-weight:800}
.topbar .pts{color:var(--gold);font-size:22px}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;min-height:44px;border:0;border-radius:12px;background:#fff;font-weight:700;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.tabs button.on{background:var(--pri);color:#fff}
.notice{background:var(--pri-2);border-radius:12px;padding:10px 14px;margin:10px 0}
.nachricht{background:var(--gold);color:var(--ink);border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:700}
/* Stationen */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{border:0;text-align:left;background:#fff;border-radius:16px;padding:14px;cursor:pointer;box-shadow:0 1px 0 var(--line),0 4px 14px rgba(30,42,68,.05);border-top:6px solid var(--f,#999);display:flex;flex-direction:column;gap:2px;min-height:130px}
.st .emo{font-size:30px}
.st b{font-family:var(--head);font-size:17px}
.st .th{font-size:13px;color:var(--muted)}
.st .stat{margin-top:auto;font-size:14px;font-weight:700}
.st.fertig{background:var(--ok-2)}
.st.zu{opacity:.5;cursor:not-allowed}
.person{display:flex;gap:14px;align-items:flex-start}
.person .emo{font-size:46px;line-height:1;width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--pri-2)}
.sprech{background:#F7F7F2;border-radius:4px 16px 16px 16px;padding:12px 14px;margin-top:6px}
.hoer{border:0;background:var(--pri-2);color:var(--pri);border-radius:999px;min-height:40px;padding:4px 14px;font-weight:700;cursor:pointer}
.hoer.spielt{background:var(--pri);color:#fff}
.punkte-dots{display:flex;gap:6px;margin:6px 0 12px}
.punkte-dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.punkte-dots i.ok{background:var(--ok)} .punkte-dots i.jetzt{background:var(--pri)}
.item{border:2px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#fff}
.item.falsch{border-color:var(--bad);background:var(--bad-2)}
.item.richtig{border-color:var(--ok);background:var(--ok-2)}
.item .frage{font-weight:700;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;min-height:46px;padding:6px 10px;cursor:pointer;font-weight:600}
.opt.gew{border-color:var(--pri);background:var(--pri-2)}
.luecke{display:inline-block;min-width:70px;border-bottom:3px solid var(--pri);text-align:center;font-weight:800;color:var(--pri)}
.zo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zo button{border:2px solid var(--line);background:#fff;border-radius:12px;min-height:46px;padding:6px 10px;cursor:pointer;font-weight:600;text-align:left}
.zo button.sel{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-2)}
.zo button.paar{color:#fff;border-color:transparent}
.kacheln{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kachel{border:0;background:var(--pri-2);color:var(--ink);border-radius:10px;min-height:42px;padding:6px 12px;font-weight:700;cursor:pointer}
.kachel.weg{visibility:hidden}
.zeile{min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.zeile .kachel{background:var(--pri);color:#fff}
.saetze button{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;min-height:46px;padding:8px 12px;margin:6px 0;cursor:pointer;font-weight:600}
.saetze button.gesetzt{opacity:.35}
.seq li{background:var(--pri-2);border-radius:10px;padding:8px 10px;margin:6px 0;cursor:pointer;font-weight:600}
.feedback{border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:700}
.feedback.bad{background:var(--bad-2);color:var(--bad)} .feedback.ok{background:var(--ok-2);color:var(--ok)}
.hinweis{background:#FFF7DD;border-left:6px solid var(--gold);border-radius:12px;padding:12px 14px;margin:8px 0}
.ziffern{display:flex;gap:10px;justify-content:center;margin:10px 0}
.ziffern span{width:56px;height:68px;border-radius:12px;background:var(--ink);color:var(--gold);font-family:var(--head);font-weight:800;font-size:38px;display:flex;align-items:center;justify-content:center}
.ziffern span.leer{background:var(--line);color:var(--muted)}
/* Leitung */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tkarte{border-top:8px solid var(--f,#999)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;background:var(--line)}
.chip.ok{background:var(--ok-2);color:var(--ok)} .chip.lauf{background:var(--pri-2);color:var(--pri)}
.chip.off{opacity:.45}
table{border-collapse:collapse;width:100%}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
td input[type=number]{width:80px;min-height:38px}
.namen{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.nm{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.nm span{flex:1;font-weight:600}
.nm select{min-height:34px;padding:2px 6px;font-size:14px}
/* Leinwand */
body.lw{background:var(--ink);color:#fff}
.lw .card{background:#26365A;color:#fff;box-shadow:none}
.lwpin{font-family:var(--head);font-weight:800;font-size:min(22vw,180px);letter-spacing:.1em;color:var(--gold);line-height:1}
.bahn{display:flex;align-items:center;gap:12px;margin:10px 0}
.bahn .nm2{width:200px;font-family:var(--head);font-weight:800;font-size:22px}
.bahn .spur{flex:1;height:34px;background:rgba(255,255,255,.1);border-radius:17px;position:relative;overflow:hidden}
.bahn .spur i{position:absolute;inset:0 auto 0 0;border-radius:17px;background:var(--f)}
.bahn .pk{width:90px;text-align:right;font-family:var(--head);font-weight:800;font-size:26px;color:var(--gold)}
.uhr{font-family:var(--head);font-weight:800;font-size:44px}
#qr img,#qr canvas{background:#fff;padding:10px;border-radius:12px}
@media print{.noprint{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="jagd/index.js"></script>
<script>
/* =========================================================
   SCHNITZELJAGD-ENGINE  ·  Plön
   ?leitung=1          Lehrkraft (Anmeldung): Teams bilden, freigeben, beobachten, Punkte übertragen
   ?rolle=leinwand&pin=1234   Beamer
   ?pin=1234           Teilnehmende
   Fälle: jagd/<id>.js (Daten) · Liste: jagd/index.js · Audios: jagd/audio/<hash>.mp3
   ========================================================= */
const KURS_CODE = "ploen-jik";
const firebaseConfig = {
  apiKey: "AIzaSyBDChXlm34Kr7Gg0Dw458GiiwoLnWJAnxM",
  authDomain: "lern-deutsch-arash.firebaseapp.com",
  databaseURL: "https://lern-deutsch-arash-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "lern-deutsch-arash",
  storageBucket: "lern-deutsch-arash.firebasestorage.app",
  messagingSenderId: "845503292114",
  appId: "1:845503292114:web:f76ab5fcde1e978d00c30b"
};
const KURS = KURS_CODE;
const BASE = `jugendliga/${KURS}`;
const CODE_KEY = `liga_code_${KURS}`;
const JROOT = `ligajagd/${KURS}`;
const P = new URLSearchParams(location.search);
const MODUS = P.get("leitung") ? "leitung" : (P.get("rolle")==="leinwand" ? "leinwand" : "spieler");

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arr = v => Array.isArray(v) ? v.filter(Boolean) : (v && typeof v==="object" ? Object.values(v) : []);
function fnv(s){let h=0x811c9dc5;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,0x01000193)>>>0}return h.toString(36)}
function mische(a, seed){ let x=(parseInt(fnv(String(seed)),36)||1)>>>0; a=a.slice(); for(let i=a.length-1;i>0;i--){ x=(Math.imul(x,1103515245)+12345)>>>0; const j=x%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const BASIS_URL = location.href.replace(/[?#].*$/,"");
const LIVE_URL = BASIS_URL.replace(/[^\/]*$/,"")+"live.html";
const TEAMS_VORLAGE = [["Lupe","🔍","#3B4FD8"],["Fußspur","👣","#FF6B4A"],["Taschenlampe","🔦","#14A37F"],["Schlüssel","🗝️","#B7791F"],["Notizbuch","📓","#8B5CF6"],["Fernglas","🔭","#DB2777"],["Kompass","🧭","#0E7490"]];
const FARBEN = {}; // Team-Farbe

let db=null, auth=null, offset=0;
try{ firebase.initializeApp(firebaseConfig); db=firebase.database(); auth=firebase.auth();
  db.ref(".info/serverTimeOffset").on("value", s=>{ offset=Number(s.val())||0; }); }catch(e){ console.warn(e); }
const jetzt = () => Date.now()+offset;
const TS = () => firebase.database.ServerValue.TIMESTAMP;
let PIN = (P.get("pin")||"").replace(/\D/g,"");
const J = p => db.ref(`${JROOT}/${PIN}${p?"/"+p:""}`);

/* ---------- Fall laden ---------- */
const FAELLE = {};
function ladeFall(id){
  window.JAGD_FAELLE = window.JAGD_FAELLE || {};
  if(window.JAGD_FAELLE[id]) return Promise.resolve(window.JAGD_FAELLE[id]);
  return new Promise((ok,no)=>{ const s=document.createElement("script"); s.src=`jagd/${id}.js`;
    s.onload=()=>window.JAGD_FAELLE[id]?ok(window.JAGD_FAELLE[id]):no(new Error("Fall fehlt")); s.onerror=()=>no(new Error("Fall nicht gefunden")); document.head.appendChild(s); });
}

/* ---------- Audio ---------- */
let aktAudio=null, aktKnopf=null;
function stopAudio(){ if(aktAudio){ try{aktAudio.pause();}catch(e){} aktAudio=null; } try{ speechSynthesis.cancel(); }catch(e){} if(aktKnopf){ aktKnopf.classList.remove("spielt"); aktKnopf=null; } }
function spiele(stimme, text, knopf){
  const war = aktKnopf===knopf; stopAudio(); if(war) return;
  aktKnopf=knopf||null; if(knopf) knopf.classList.add("spielt");
  let fallback=false; const tts=()=>{ if(fallback) return; fallback=true; try{ const u=new SpeechSynthesisUtterance(text); u.lang="de-DE"; u.rate=.85; u.onend=stopAudio; speechSynthesis.speak(u); }catch(e){ stopAudio(); } };
  const a=new Audio(`jagd/audio/${fnv(stimme+"|"+text)}.mp3`); aktAudio=a;
  a.onended=stopAudio; a.onerror=tts; const pr=a.play(); if(pr&&pr.catch) pr.catch(tts);
}
document.addEventListener("click", e=>{ const b=e.target.closest("[data-hoer]"); if(!b) return; const [st,i]=b.dataset.hoer.split("|"); const a=HOER[st] && HOER[st][i]; if(a) spiele(a[0],a[1],b); });
const HOER={}; let hoerNr=0;
function hoerKnopf(stimme, text, label){ const id="h"+(hoerNr++); HOER[id]={0:[stimme,text]}; return `<button class="hoer" data-hoer="${id}|0">🔊 ${esc(label||"anhören")}</button>`; }

/* ---------- Punkte ---------- */
function stationPunkte(F, s){ const P=F.punkte; if(!s||!s.fertig) return 0; if(s.hilfe) return P.min; return Math.max(P.min, P.station - P.abzug*(Number(s.f)||0)); }
function finalePunkte(F, fin){ if(!fin) return 0; const P=F.punkte; let p=0;
  if(fin.schloss) p+=Math.max(P.min, P.schloss - P.abzug*(Number(fin.sf)||0));
  F.finale.fragen.forEach((q,i)=>{ if(fin.a && fin.a[i]===0) p+=P.frage; }); return p; }
function maxPunkte(F){ const P=F.punkte; return F.stationen.length*P.station + P.schloss + F.finale.fragen.length*P.frage + (P.platz[0]||0); }
function teamWertung(F, S){
  const fort=S.fort||{}, teams=S.teams||{};
  const fertigListe = Object.keys(teams).filter(t=>fort[t]&&fort[t].fin&&fort[t].fin.fertig).sort((a,b)=>fort[a].fin.fertig-fort[b].fin.fertig);
  return Object.keys(teams).map(t=>{ const f=fort[t]||{}, st=f.st||{};
    const sp=F.stationen.reduce((a,s)=>a+stationPunkte(F, st[s.id]),0);
    const fp=finalePunkte(F, f.fin); const pl=fertigListe.indexOf(t); const bonus=pl>=0?(F.punkte.platz[pl]||0):0;
    const fertig=F.stationen.filter(s=>st[s.id]&&st[s.id].fertig).length;
    return {id:t, team:teams[t], stationen:sp, finale:fp, bonus, gesamt:sp+fp+bonus, fertig, ende:f.fin&&f.fin.fertig||0, platz:pl};
  }).sort((a,b)=>b.gesamt-a.gesamt || (a.ende||9e15)-(b.ende||9e15));
}
const zeitRest = S => S.start ? (S.start + (Number(S.dauer)||90)*60000) - jetzt() : (Number(S.dauer)||90)*60000;
const mmss = ms => { ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return `${m}:${String(s).padStart(2,"0")}`; };

/* =========================================================
   TEILNEHMENDE
   ========================================================= */
function spieler(){
  const app=$("#app");
  let me=null, S=null, F=null, myTeam=null, ansicht="karte", lokal={}, fb={}, gesehenMsg=0;
  try{ const c=JSON.parse(localStorage.getItem(CODE_KEY)||"null"); if(c&&c.code&&c.pid) me=c; }catch(e){}

  function pinScreen(fehler){
    app.innerHTML=`<div class="wrap"><div class="card" style="margin-top:8vh;text-align:center">
      <div style="font-size:56px">🕵️</div><h2>Schnitzeljagd</h2><p class="muted">Gib die PIN von der Leinwand ein.</p>
      <form id="pf"><input id="pin" class="pin-in" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(PIN)}">
      <button class="btn wide" style="margin-top:10px">Weiter</button></form><div class="err" id="perr">${esc(fehler||"")}</div></div></div>`;
    $("#pf").onsubmit=e=>{ e.preventDefault(); PIN=$("#pin").value.replace(/\D/g,""); pruefePin(); };
    setTimeout(()=>$("#pin").focus(),50);
  }
  async function pruefePin(){
    if(PIN.length!==4) return pinScreen(PIN?"Die PIN hat 4 Ziffern.":"");
    try{ const info=(await J("info").once("value")).val();
      if(!info) return pinScreen("Diese PIN gibt es nicht. Schau noch einmal auf die Leinwand.");
      try{ sessionStorage.setItem("jagd_pin",PIN); }catch(e){}
      history.replaceState(null,"","?pin="+PIN);
      F=await ladeFall(info.fall);
      me ? anmelden() : codeScreen();
    }catch(e){ pinScreen("Keine Verbindung. Prüfe dein Internet."); }
  }
  function codeScreen(fehler){
    app.innerHTML=`<div class="wrap"><div class="card" style="margin-top:8vh;text-align:center">
      <div style="font-size:56px">🔑</div><h2>Dein Code</h2><p class="muted">Dein persönlicher Code (wie in der Liga).</p>
      <form id="cf"><input id="code" class="pin-in" autocomplete="off" style="text-transform:uppercase;letter-spacing:.15em">
      <button class="btn wide" style="margin-top:10px">Los geht's</button></form><div class="err">${esc(fehler||"")}</div></div></div>`;
    $("#cf").onsubmit=async e=>{ e.preventDefault(); const code=$("#code").value.toUpperCase().replace(/[^A-Z0-9]/g,"");
      if(code.length<4) return codeScreen("Der Code hat mindestens 4 Zeichen.");
      try{ const c=(await db.ref(`${BASE}/codes/${code}`).once("value")).val();
        if(!c||!c.pid) return codeScreen("Diesen Code gibt es nicht. Frag deine Lehrkraft.");
        const pub=(await db.ref(`${BASE}/public/names/${c.pid}`).once("value")).val();
        me={code, pid:c.pid, name:c.name||pub||"?"}; localStorage.setItem(CODE_KEY, JSON.stringify(me)); anmelden();
      }catch(err){ codeScreen("Keine Verbindung."); } };
    setTimeout(()=>$("#code").focus(),50);
  }
  async function anmelden(){
    const ref=J(`spieler/${me.pid}`);
    await ref.update({name:me.name, ts:TS(), online:true, da:true});
    try{ ref.child("online").onDisconnect().set(false); }catch(e){}
    db.ref(".info/connected").on("value", s=>{ if(s.val()) ref.child("online").set(true); });
    J().on("value", s=>{ S=s.val()||{}; neu(); });
    setInterval(()=>{ const u=$("#uhr"); if(u&&S) u.textContent=mmss(zeitRest(S)); }, 1000);
  }
  function neu(){
    if(!S.info){ app.innerHTML=`<div class="wrap"><div class="card">Diese Jagd gibt es nicht mehr.</div></div>`; return; }
    const sp=(S.spieler||{})[me.pid]||{};
    myTeam = sp.team && S.teams && S.teams[sp.team] ? sp.team : null;
    if(S.info.phase==="lobby" || !myTeam) return warten();
    if(S.info.phase==="ende") return ende();
    zeichne();
  }
  function kopf(){
    const T=S.teams[myTeam], w=teamWertung(F,S).find(x=>x.id===myTeam);
    return `<div class="topbar"><div class="in"><span class="dot" style="background:${T.farbe}"></span><b>${T.emoji} Team ${esc(T.name)}</b>
      <span class="sp"><span id="uhr">${mmss(zeitRest(S))}</span><span class="pts">${w?w.gesamt:0} P</span></span></div></div>`;
  }
  function mitglieder(){ return Object.entries(S.spieler||{}).filter(([,x])=>x.team===myTeam).map(([pid,x])=>`<span class="chip ${x.online===false?"off":""}">${esc(x.name)}${pid===me.pid?" (du)":""}</span>`).join(" "); }
  function warten(){
    const T=myTeam&&S.teams[myTeam];
    app.innerHTML=`<div class="wrap"><div class="card" style="margin-top:6vh;text-align:center">
      <div style="font-size:60px">${F.icon}</div><h2>${esc(F.titel)}</h2>
      <p>Hallo <b>${esc(me.name)}</b>!</p>
      ${T?`<p class="notice">Dein Team: <b style="color:${T.farbe}">${T.emoji} ${esc(T.name)}</b><br>${mitglieder()}</p><p class="muted">Gleich geht es los. Schau auf die Leinwand!</p>`
        :`<p class="muted">Deine Lehrkraft stellt gerade die Teams zusammen. Warte kurz …</p>`}
      <p class="small muted">Nicht ${esc(me.name)}? <a href="#" id="anders">Code ändern</a></p></div></div>`;
    $("#anders").onclick=e=>{ e.preventDefault(); J(`spieler/${me.pid}/online`).set(false); localStorage.removeItem(CODE_KEY); me=null; codeScreen(); };
  }
  const fort = () => ((S.fort||{})[myTeam]) || {};
  const stand = sid => Object.assign({b:0,f:0}, (fort().st||{})[sid]||{});
  const finaleOffen = () => S.info.finaleFrei || F.stationen.every(s=>stand(s.id).fertig);

  function zeichne(){
    hoerNr=0; for(const k in HOER) delete HOER[k];
    let inhalt="";
    if(ansicht==="karte") inhalt=karte();
    else if(ansicht==="notiz") inhalt=notiz();
    else if(ansicht==="finale") inhalt=finale();
    else inhalt=station(F.stationen.find(s=>s.id===ansicht));
    const msg = S.nachricht && S.nachricht.ts>jetzt()-5*60000 ? `<div class="nachricht">📣 ${esc(S.nachricht.text)}</div>` : "";
    app.innerHTML = kopf() + `<div class="wrap">${msg}
      <div class="tabs"><button data-tab="karte" class="${ansicht==="karte"||F.stationen.some(s=>s.id===ansicht)?"on":""}">🗺️ Personen</button>
      <button data-tab="notiz" class="${ansicht==="notiz"?"on":""}">📓 Notizbuch</button>
      <button data-tab="finale" class="${ansicht==="finale"?"on":""}">🔒 Finale</button></div>${inhalt}</div>`;
  }
  function karte(){
    const wo=fort().wo;
    return `<p class="muted">Wählt eine Person. Jede braucht zuerst eure Hilfe. ${wo&&F.stationen.find(s=>s.id===wo.s)?`<br>📍 ${esc(wo.n)} ist gerade bei <b>${esc(F.stationen.find(s=>s.id===wo.s).name)}</b>.`:""}</p>
    <div class="grid">${F.stationen.map(s=>{ const x=stand(s.id); const n=s.bloecke.length;
      const stat = x.fertig ? `✓ ${stationPunkte(F,x)} Punkte` : (x.b>0||x.f>0 ? `▶ Teil ${Math.min(x.b+1,n)} von ${n}` : `${n} Aufgaben`);
      return `<button class="st ${x.fertig?"fertig":""}" style="--f:${s.farbe}" data-st="${s.id}"><span class="emo">${s.emoji}</span><b>${esc(s.name)}</b><span class="th">${esc(s.ort)}</span><span class="th">${esc(s.thema)}</span><span class="stat">${stat}</span></button>`; }).join("")}
      <button class="st ${finaleOffen()?"":"zu"}" style="--f:var(--ink)" data-tab="finale"><span class="emo">🔒</span><b>${esc(F.finale.titel)}</b><span class="th">Finale</span><span class="stat">${finaleOffen()?"offen!":"erst alle Personen"}</span></button></div>`;
  }
  function ziffernHtml(){
    const z=[]; F.stationen.forEach(s=>{ if(s.ziffer&&stand(s.id).fertig) z[s.ziffer.stelle-1]=s.ziffer.wert; });
    return `<div class="ziffern">${F.schloss.code.split("").map((_,i)=>z[i]?`<span>${z[i]}</span>`:`<span class="leer">?</span>`).join("")}</div>`;
  }
  function notiz(){
    const fertig=F.stationen.filter(s=>stand(s.id).fertig);
    return `<div class="card"><h3>📓 Unser Notizbuch</h3><p class="muted small">Die Ziffern fürs Zahlenschloss:</p>${ziffernHtml()}
      ${fertig.length?fertig.map(s=>`<div class="hinweis"><b>${s.emoji} ${esc(s.name)}:</b> ${esc(s.hinweis)}${s.ziffer?`<br><b>🔢 ${esc(s.ziffer.text)}</b>`:""}</div>`).join("")
        :`<p class="muted">Noch leer. Helft den Personen – dann bekommt ihr Hinweise.</p>`}</div>
      <div class="card"><h3>So geht's</h3><ul>${F.intro.regeln.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>${hoerKnopf(F.intro.stimme,F.intro.text,"Die Geschichte anhören")}<p>${esc(F.intro.text)}</p></div>`;
  }

  /* ---------- Station ---------- */
  function station(s){
    const x=stand(s.id), n=s.bloecke.length;
    let h=`<p><button class="btn ghost sm" data-tab="karte">← alle Personen</button></p>
      <div class="card"><div class="person"><div class="emo" style="background:${s.farbe}22">${s.emoji}</div><div style="flex:1">
      <h2 style="margin:0">${esc(s.name)}</h2><div class="muted small">${esc(s.rolle)} · ${esc(s.ort)}</div>
      <div class="sprech">${esc(s.intro)}</div><div style="margin-top:8px">${hoerKnopf(s.stimme,s.intro)}</div></div></div></div>`;
    h+=`<div class="punkte-dots">${s.bloecke.map((_,i)=>`<i class="${i<x.b||x.fertig?"ok":i===x.b?"jetzt":""}"></i>`).join("")}</div>`;
    if(x.fertig){
      h+=`<div class="card"><div class="feedback ok">✓ Geschafft! ${stationPunkte(F,x)} Punkte${x.hilfe?" (mit Hilfe der Lehrkraft)":""}</div>
        <div class="sprech">${esc(s.danke)}</div><div class="hinweis">🔎 <b>Hinweis:</b> ${esc(s.hinweis)}${s.ziffer?`<br><b>🔢 ${esc(s.ziffer.text)}</b>`:""}</div>
        ${hoerKnopf(s.stimme, s.danke+" "+s.hinweis, "Hinweis anhören")}
        <p style="margin-top:12px"><button class="btn wide" data-tab="karte">Zur nächsten Person →</button></p></div>`;
      return h;
    }
    const b=s.bloecke[x.b]; const key=`${s.id}:${x.b}`; const L=lokal[key]=lokal[key]||{}; const FB=fb[key]||{};
    h+=`<div class="card"><h3>${esc(b.titel||"")}</h3><p class="muted small">Teil ${x.b+1} von ${n} · Fehler bisher: ${x.f||0} (−${F.punkte.abzug} pro Fehler)</p>`;
    h+=blockHtml(s, b, key, L, FB);
    if(FB.text) h+=`<div class="feedback ${FB.ok?"ok":"bad"}">${esc(FB.text)}</div>`;
    h+=`<button class="btn wide ok" data-pruefe="${s.id}" style="margin-top:8px">✓ Prüfen</button></div>`;
    return h;
  }
  function optHtml(key, i, opts, gew, seed){
    const ord=mische(opts.map((t,k)=>k), seed);
    return `<div class="opts">${ord.map(k=>`<button class="opt ${gew===k?"gew":""}" data-wahl="${key}|${i}|${k}">${esc(opts[k])}</button>`).join("")}</div>`;
  }
  function blockHtml(s, b, key, L, FB){
    const falsch=FB.falsch||{}, richtig=FB.richtig||{};
    const cls=i=>falsch[i]?"falsch":(richtig[i]?"richtig":"");
    if(b.typ==="hoeren"){
      const alle=b.items.map(it=>it.t).join(" ");
      return `<p>${hoerKnopf(s.stimme, alle, "Ganze Nachricht anhören")}</p>`+b.items.map((it,i)=>`<div class="item ${cls(i)}"><div class="row" style="margin-bottom:6px">${hoerKnopf(s.stimme,it.t,"Satz "+(i+1))}</div>
        <div class="frage">${esc(it.f)}</div>${optHtml(key,i,it.o,L[i],key+i)}</div>`).join("");
    }
    if(b.typ==="luecke"){
      return b.items.map((it,i)=>{ const teile=it.s.split("___"); const w=L[i]!==undefined?it.o[L[i]]:"";
        return `<div class="item ${cls(i)}"><div class="frage">${esc(teile[0])}<span class="luecke">${esc(w)||"&nbsp;"}</span>${esc(teile[1]||"")}${it.h?` <span class="muted small">(${esc(it.h)})</span>`:""}</div>${optHtml(key,i,it.o,L[i],key+i)}</div>`; }).join("");
    }
    if(b.typ==="zuordnen"){
      const rechts=mische(b.paare.map((_,i)=>i), key+"r"); const m=L.m=L.m||{}; const farbe=i=>`hsl(${(i*67)%360} 60% 45%)`;
      const linksVon=r=>Object.keys(m).find(l=>m[l]===r);
      return `<p class="muted small">Tippe links, dann rechts.</p><div class="zo">${b.paare.map((p,i)=>{ const r=rechts[i]; const l2=linksVon(r);
        return `<button class="${L.sel===i?"sel":""} ${m[i]!==undefined?"paar":""}" ${m[i]!==undefined?`style="background:${farbe(i)}"`:""} data-zl="${key}|${i}">${esc(p[0])}</button>
                <button class="${l2!==undefined?"paar":""}" ${l2!==undefined?`style="background:${farbe(+l2)}"`:""} data-zr="${key}|${r}">${esc(b.paare[r][1])}</button>`; }).join("")}</div>`;
    }
    if(b.typ==="ordnen"){
      const seq=L.seq=L.seq||[]; let ord=mische(b.saetze.map((_,i)=>i), key); if(ord.every((v,i)=>v===i)) ord=ord.slice(1).concat(ord[0]);
      const audio = b.audio ? `<p>${hoerKnopf(s.stimme, b.saetze.join(" "), "Nachricht anhören")}</p>` : "";
      return audio+`<p class="muted small">Tippe die Sätze in der richtigen Reihenfolge an. (Antippen unten = zurücknehmen)</p>
        <div class="saetze">${ord.map(i=>`<button class="${seq.includes(i)?"gesetzt":""}" data-ord="${key}|${i}">${esc(b.saetze[i])}</button>`).join("")}</div>
        <ol class="seq">${seq.map(i=>`<li data-unord="${key}|${i}">${esc(b.saetze[i])}</li>`).join("")}</ol>`;
    }
    if(b.typ==="satz"){
      return b.items.map((it,i)=>{ const seq=(L.s=L.s||{})[i]=(L.s[i]||[]); const ord=mische(it.w.map((_,k)=>k), key+"s"+i);
        return `<div class="item ${cls(i)}"><div class="zeile">${seq.map(k=>`<button class="kachel" data-sz="${key}|${i}|${k}|weg">${esc(it.w[k])}</button>`).join("")}<b>${esc(it.p||"")}</b></div>
          <div class="kacheln">${ord.map(k=>`<button class="kachel ${seq.includes(k)?"weg":""}" data-sz="${key}|${i}|${k}|hin">${esc(it.w[k])}</button>`).join("")}</div></div>`; }).join("");
    }
    return "";
  }
  function pruefeBlock(s){
    const x=stand(s.id); const b=s.bloecke[x.b]; const key=`${s.id}:${x.b}`; const L=lokal[key]||{};
    let ok=true, falsch={}, richtig={}, text="";
    if(b.typ==="hoeren"||b.typ==="luecke"){
      if(b.items.some((_,i)=>L[i]===undefined)){ fb[key]={text:"Beantwortet zuerst alle Fragen."}; return zeichne(); }
      b.items.forEach((_,i)=>{ if(L[i]===0) richtig[i]=1; else { falsch[i]=1; ok=false; } });
      text = ok ? "" : `${Object.keys(falsch).length} ${Object.keys(falsch).length===1?"Antwort ist":"Antworten sind"} noch falsch (rot). Versucht es noch einmal!`;
      Object.keys(falsch).forEach(i=>delete L[i]);
    } else if(b.typ==="zuordnen"){
      const m=L.m||{}; if(Object.keys(m).length<b.paare.length){ fb[key]={text:"Verbindet zuerst alle Paare."}; return zeichne(); }
      const f=Object.keys(m).filter(l=>m[l]!==+l); ok=!f.length; f.forEach(l=>delete m[l]); text=ok?"":`${f.length} Paare passen nicht – sie sind wieder frei.`;
    } else if(b.typ==="ordnen"){
      const seq=L.seq||[]; if(seq.length<b.saetze.length){ fb[key]={text:"Ordnet zuerst alle Sätze."}; return zeichne(); }
      const r=seq.filter((v,i)=>v===i).length; ok=r===b.saetze.length; text=ok?"":`${r} von ${b.saetze.length} Sätzen stehen richtig. Hört noch einmal zu!`;
    } else if(b.typ==="satz"){
      b.items.forEach((it,i)=>{ const seq=(L.s||{})[i]||[]; const satz=seq.map(k=>it.w[k]).join(" ").toLowerCase();
        if(it.a.some(a=>a.toLowerCase()===satz)) richtig[i]=1; else { falsch[i]=1; ok=false; if(L.s) L.s[i]=[]; } });
      text=ok?"":"Ein Satz stimmt noch nicht (rot). Legt ihn noch einmal.";
    }
    if(ok){
      fb[key]={ok:true,text:"Richtig!"};
      J(`fort/${myTeam}/st/${s.id}`).transaction(cur=>{ cur=cur||{}; if((cur.b||0)!==x.b||cur.fertig) return; cur.b=x.b+1; if(cur.b>=s.bloecke.length) cur.fertig=Date.now(); return cur; });
    } else {
      fb[key]={ok:false,text,falsch,richtig};
      J(`fort/${myTeam}/st/${s.id}/f`).transaction(v=>(v||0)+1);
      zeichne();
    }
  }

  /* ---------- Finale ---------- */
  function finale(){
    if(!finaleOffen()) return `<div class="card" style="text-align:center"><div style="font-size:50px">🔒</div><h3>Noch geschlossen</h3><p class="muted">Helft zuerst allen Personen. Dann habt ihr alle Hinweise und alle Ziffern.</p>${ziffernHtml()}</div>`;
    const fin=fort().fin||{};
    let h=`<div class="card"><h2>🔒 ${esc(F.finale.titel)}</h2><p>${esc(F.finale.text)}</p>${ziffernHtml()}`;
    if(!fin.schloss){
      h+=`<form id="schloss" class="row"><input id="sc" class="pin-in" inputmode="numeric" maxlength="${F.schloss.code.length}" style="flex:1"><button class="btn gold">Öffnen</button></form>
        ${fb.schloss?`<div class="feedback bad">${esc(fb.schloss)}</div>`:""}<p class="muted small">Fehlversuche: ${fin.sf||0}</p></div>`;
      return h;
    }
    h+=`<div class="feedback ok">🔓 Das Schloss ist offen!</div></div><div class="card"><h3>Jetzt löst den Fall!</h3>`;
    F.finale.fragen.forEach((q,i)=>{ const a=fin.a&&fin.a[i]!==undefined?fin.a[i]:null; const ord=mische(q.o.map((_,k)=>k), "fin"+i);
      h+=`<div class="item ${a===null?"":(a===0?"richtig":"falsch")}"><div class="frage">${i+1}. ${esc(q.f)}</div><div class="opts">${ord.map(k=>`<button class="opt ${a===k?"gew":""}" ${a!==null?"disabled":""} data-fin="${i}|${k}">${esc(q.o[k])}${a!==null&&k===0?" ✓":""}</button>`).join("")}</div></div>`; });
    if(fin.fertig) h+=`<div class="hinweis" style="font-size:19px">${esc(F.finale.ende)}</div>${hoerKnopf(F.intro.stimme,F.finale.ende,"anhören")}`;
    else h+=`<p class="muted small">Achtung: Bei jeder Frage habt ihr nur <b>einen</b> Versuch. Besprecht euch zuerst!</p>`;
    return h+`</div>`;
  }

  /* ---------- Ende ---------- */
  function ende(){
    const w=teamWertung(F,S); const meinP=w.findIndex(x=>x.id===myTeam);
    app.innerHTML=`<div class="wrap"><div class="card" style="text-align:center;margin-top:4vh"><div style="font-size:60px">🏁</div><h2>Die Jagd ist vorbei!</h2>
      ${meinP>=0?`<p>Team <b>${esc(S.teams[myTeam].name)}</b>: Platz ${meinP+1} mit <b>${w[meinP].gesamt} Punkten</b>.</p>`:""}
      <p class="muted">Deine Lehrkraft gibt die Punkte jetzt für jede Person frei.</p></div>
      <div class="card"><h3>Ergebnis</h3><table>${w.map((x,i)=>`<tr><td>${i+1}.</td><td>${x.team.emoji} ${esc(x.team.name)}</td><td><b>${x.gesamt}</b></td></tr>`).join("")}</table></div>
      ${S.uebertragen&&S.uebertragen[me.pid]!==undefined?`<div class="card"><div class="feedback ok">✓ Für dich gespeichert: ${S.uebertragen[me.pid]} Punkte</div></div>`:""}
      <div class="card"><h3>Die Lösung</h3><p>${esc(F.finale.ende)}</p></div></div>`;
  }

  /* ---------- Klicks ---------- */
  app.addEventListener("click", e=>{
    const t=e.target.closest("button,li"); if(!t) return;
    const d=t.dataset;
    if(d.tab){ ansicht=d.tab; stopAudio(); zeichne(); scrollTo(0,0); return; }
    if(d.st){ ansicht=d.st; stopAudio(); J(`fort/${myTeam}/wo`).set({s:d.st, n:me.name}); zeichne(); scrollTo(0,0); return; }
    if(d.wahl){ const [k,i,o]=d.wahl.split("|"); lokal[k]=lokal[k]||{}; lokal[k][i]=+o; if(fb[k]){ fb[k].text=""; if(fb[k].falsch) delete fb[k].falsch[i]; } zeichne(); return; }
    if(d.zl){ const [k,i]=d.zl.split("|"); const L=lokal[k]; if(L.m[i]!==undefined){ delete L.m[i]; L.sel=null; } else L.sel=+i; zeichne(); return; }
    if(d.zr){ const [k,r]=d.zr.split("|"); const L=lokal[k]; const l=Object.keys(L.m).find(x=>L.m[x]===+r);
      if(l!==undefined){ delete L.m[l]; } else if(L.sel!==null&&L.sel!==undefined){ L.m[L.sel]=+r; L.sel=null; } zeichne(); return; }
    if(d.ord){ const [k,i]=d.ord.split("|"); const L=lokal[k]; if(!L.seq.includes(+i)) L.seq.push(+i); zeichne(); return; }
    if(d.unord){ const [k,i]=d.unord.split("|"); const L=lokal[k]; L.seq=L.seq.filter(v=>v!==+i); zeichne(); return; }
    if(d.sz){ const [k,i,w,wie]=d.sz.split("|"); const L=lokal[k]; const seq=L.s[i]; if(wie==="hin"&&!seq.includes(+w)) seq.push(+w); if(wie==="weg") L.s[i]=seq.filter(v=>v!==+w); if(fb[k]&&fb[k].falsch) delete fb[k].falsch[i]; zeichne(); return; }
    if(d.pruefe){ pruefeBlock(F.stationen.find(s=>s.id===d.pruefe)); return; }
    if(d.fin){ const [i,k]=d.fin.split("|").map(Number);
      J(`fort/${myTeam}/fin`).transaction(cur=>{ cur=cur||{}; cur.a=cur.a||{}; if(cur.a[i]!==undefined) return; cur.a[i]=k;
        if(F.finale.fragen.every((_,j)=>cur.a[j]!==undefined)) cur.fertig=Date.now(); return cur; });
      return; }
  });
  app.addEventListener("submit", e=>{
    if(e.target.id!=="schloss") return; e.preventDefault();
    const v=$("#sc").value.replace(/\D/g,"");
    if(v===F.schloss.code){ fb.schloss=""; J(`fort/${myTeam}/fin`).transaction(cur=>{ cur=cur||{}; if(!cur.schloss) cur.schloss=Date.now(); return cur; }); }
    else { fb.schloss="Klack … das Schloss bleibt zu. Prüft eure Ziffern im Notizbuch!"; J(`fort/${myTeam}/fin/sf`).transaction(x=>(x||0)+1); }
  });

  if(!db) { app.innerHTML=`<div class="wrap"><div class="card">Keine Verbindung.</div></div>`; return; }
  if(!PIN){ try{ PIN=sessionStorage.getItem("jagd_pin")||""; }catch(e){} }
  PIN ? pruefePin() : pinScreen();
}

/* =========================================================
   LEINWAND
   ========================================================= */
function leinwand(){
  document.body.classList.add("lw");
  const app=$("#app"); let S=null, F=null, qrFertig=false;
  if(!PIN){ app.innerHTML=`<div class="wrap"><div class="card">Öffne die Leinwand über die Leitung.</div></div>`; return; }
  J().on("value", async s=>{ S=s.val(); if(!S||!S.info){ app.innerHTML=`<div class="wrap"><div class="card">Keine Jagd mit PIN ${esc(PIN)}.</div></div>`; return; }
    if(!F) F=await ladeFall(S.info.fall); male(); });
  setInterval(()=>{ const u=$("#uhr"); if(u&&S) u.textContent=mmss(zeitRest(S)); }, 1000);
  function male(){
    const ph=S.info.phase, url=BASIS_URL+"?pin="+PIN;
    if(ph==="lobby"){
      const teams=S.teams||{};
      if(!$("#lw-lobby")){ qrFertig=false; app.innerHTML=`<div class="wrap weit" id="lw-lobby"><div style="display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start;margin-top:3vh">
        <div><h1 style="font-size:52px">${F.icon} ${esc(F.titel)}</h1><p style="font-size:22px;opacity:.85">${esc(F.intro.text)}</p></div>
        <div class="card" style="text-align:center"><div style="font-size:22px">Handy: <b>${esc(LIVE_URL.replace(/^https?:\/\//,""))}</b></div><div id="qr" style="display:flex;justify-content:center;margin:12px 0"></div><div>PIN</div><div class="lwpin">${PIN}</div></div></div>
        <div id="lw-teams"></div></div>`; }
      if(!qrFertig){ qrFertig=true; try{ new QRCode($("#qr"),{text:url,width:220,height:220}); }catch(e){} }
      $("#lw-teams").innerHTML=`<div class="lgrid" style="margin-top:16px">${Object.entries(teams).map(([t,T])=>`<div class="card" style="border-top:8px solid ${T.farbe}"><h3>${T.emoji} Team ${esc(T.name)}</h3>${Object.values(S.spieler||{}).filter(x=>x.team===t).map(x=>`<div style="font-size:20px">${esc(x.name)}</div>`).join("")}</div>`).join("")}</div>`
        + `<p style="opacity:.7;font-size:20px">Angemeldet: ${Object.values(S.spieler||{}).filter(x=>x.ts).map(x=>esc(x.name)).join(", ")||"–"}</p>`;
      return;
    }
    const w=teamWertung(F,S), max=Math.max(1,...w.map(x=>x.gesamt));
    if(ph==="ende"){
      app.innerHTML=`<div class="wrap weit"><h1 style="font-size:56px;text-align:center;margin-top:4vh">🏆 Ergebnis</h1>
        ${w.map((x,i)=>`<div class="bahn" style="--f:${x.team.farbe}"><div class="nm2">${["🥇","🥈","🥉"][i]||(i+1)+"."} ${x.team.emoji} ${esc(x.team.name)}</div><div class="spur"><i style="width:${x.gesamt/max*100}%"></i></div><div class="pk">${x.gesamt}</div></div>`).join("")}
        <div class="card" style="margin-top:20px;font-size:22px">${esc(F.finale.ende)}</div></div>`;
      return;
    }
    app.innerHTML=`<div class="wrap weit"><div class="row" style="justify-content:space-between;margin-top:2vh"><h1 style="font-size:44px">${F.icon} ${esc(F.titel)}</h1><div class="uhr">⏱️ <span id="uhr">${mmss(zeitRest(S))}</span></div></div>
      ${S.nachricht&&S.nachricht.ts>jetzt()-5*60000?`<div class="nachricht" style="font-size:24px">📣 ${esc(S.nachricht.text)}</div>`:""}
      ${w.map(x=>`<div class="bahn" style="--f:${x.team.farbe}"><div class="nm2">${x.team.emoji} ${esc(x.team.name)}</div><div class="spur"><i style="width:${x.gesamt/maxPunkte(F)*100}%"></i></div><div class="pk">${x.gesamt}</div></div>
        <div style="margin:-4px 0 10px 212px;opacity:.75">${F.stationen.map(s=>{ const st=(((S.fort||{})[x.id]||{}).st||{})[s.id]; return st&&st.fertig?s.emoji:"·"; }).join(" ")} ${x.ende?" · 🔓 gelöst!":""}</div>`).join("")}
      <p style="opacity:.6;margin-top:20px">Mitspielen: ${esc(LIVE_URL.replace(/^https?:\/\//,""))} · PIN <b>${PIN}</b></p></div>`;
  }
}

/* =========================================================
   LEITUNG
   ========================================================= */
function leitung(){
  const app=$("#app"); let S=null, F=null, pub={}, geoeffnet=null;
  if(!auth){ app.innerHTML="Keine Verbindung."; return; }
  auth.onAuthStateChanged(u=>{ if(!u) return login(); start(); });
  function login(fehler){
    app.innerHTML=`<div class="wrap"><div class="card" style="margin-top:8vh"><h2>🕵️ Schnitzeljagd leiten</h2><p class="muted">Anmeldung wie in der Konsole.</p>
      <form id="lf"><input id="lm" type="email" placeholder="E-Mail" style="width:100%;margin-bottom:8px"><input id="lp" type="password" placeholder="Passwort" style="width:100%;margin-bottom:8px"><button class="btn wide">Anmelden</button></form><div class="err">${esc(fehler||"")}</div></div></div>`;
    $("#lf").onsubmit=e=>{ e.preventDefault(); auth.signInWithEmailAndPassword($("#lm").value.trim(), $("#lp").value).catch(()=>login("E-Mail oder Passwort stimmt nicht.")); };
  }
  async function start(){
    pub=(await db.ref(`${BASE}/public`).once("value")).val()||{};
    if(!PIN){ try{ PIN=localStorage.getItem("jagd_leitung_pin")||""; }catch(e){} }
    if(PIN){ const i=(await J("info").once("value")).val(); if(i && i.phase!=="ende"){ verbinden(); return; } if(!P.get("pin")) PIN=""; else { verbinden(); return; } }
    menue();
  }
  function menue(){
    app.innerHTML=`<div class="wrap"><h2 style="margin-top:20px">🕵️ Neue Schnitzeljagd</h2>${arr(window.JAGD_LISTE).map(f=>`<div class="card"><h3>${f.icon} ${esc(f.titel)}</h3><p class="muted">${esc(f.kurz)}<br><span class="small">${esc(f.niveau)} · ${f.dauer} Min. · ${esc(f.themen)}</span></p><button class="btn" data-neu="${f.id}">Diese Jagd vorbereiten</button></div>`).join("")}</div>`;
    $$("[data-neu]").forEach(b=>b.onclick=()=>neueJagd(b.dataset.neu));
  }
  async function neueJagd(id){
    const F0=await ladeFall(id);
    for(let i=0;i<15;i++){ const c=String(1000+Math.floor(Math.random()*9000)); const ex=(await db.ref(`${JROOT}/${c}/info`).once("value")).val(); if(!ex){ PIN=c; break; } }
    await J().set({info:{fall:id, phase:"lobby", erstellt:TS(), pin:PIN, titel:F0.titel}, dauer:F0.dauer||90});
    verbinden();
  }
  function verbinden(){
    try{ localStorage.setItem("jagd_leitung_pin",PIN); }catch(e){}
    history.replaceState(null,"","?leitung=1&pin="+PIN);
    J().on("value", async s=>{ S=s.val()||{}; if(!S.info){ menue(); return; } if(!F) F=await ladeFall(S.info.fall); male(); });
    setInterval(()=>{ const u=$("#uhr"); if(u&&S) u.textContent=mmss(zeitRest(S)); }, 1000);
  }
  const namen = () => pub.names||{};
  const ligaTeam = pid => { const t=arr(pub.teams).find(x=>(pub.roster||{})[pid]===x.id); return t?t.name:""; };
  function kopf(){
    const lw=BASIS_URL+"?rolle=leinwand&pin="+PIN;
    return `<div class="topbar"><div class="in" style="max-width:1180px"><b>${F.icon} ${esc(F.titel)}</b><span class="chip" style="background:var(--gold)">PIN ${PIN}</span>
      <span class="sp"><a class="btn sm gold" href="${lw}" target="_blank">🖥️ Leinwand öffnen</a><span id="uhr">${mmss(zeitRest(S))}</span></span></div></div>`;
  }
  function male(){
    if(document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName) && document.activeElement.closest("#app")) { geoeffnet=true; return; }
    const ph=S.info.phase;
    app.innerHTML = kopf() + `<div class="wrap weit">` + (ph==="lobby"?lobby():ph==="spiel"?spiel():ende()) + `</div>`;
    binden();
  }
  function teamSelect(pid, cur){ return `<select data-team="${pid}"><option value="">–</option>${Object.entries(S.teams||{}).map(([t,T])=>`<option value="${t}" ${cur===t?"selected":""}>${T.emoji} ${esc(T.name)}</option>`).join("")}</select>`; }
  function lobby(){
    const sp=S.spieler||{}; const alle=Object.keys(namen()).sort((a,b)=>String(namen()[a]).localeCompare(namen()[b]));
    const da=alle.filter(p=>sp[p]&&sp[p].da).length;
    return `<div class="card"><h2>1 · Wer ist heute da?</h2>
      <p class="muted">Die Jugendlichen öffnen <b>${esc(LIVE_URL.replace(/^https?:\/\//,""))}</b> und geben die PIN <b>${PIN}</b> und ihren Code ein (oder QR auf der Leinwand). Wer sich anmeldet, ist automatisch „da“ (📱). Ohne Handy: Haken selbst setzen.</p>
      <div class="namen">${alle.map(p=>{ const x=sp[p]||{}; return `<label class="nm"><input type="checkbox" data-da="${p}" ${x.da?"checked":""}><span>${esc(namen()[p])} ${x.ts?(x.online===false?"📴":"📱"):""}</span><span class="small muted" style="flex:none">${esc(ligaTeam(p))}</span>${teamSelect(p,x.team)}</label>`; }).join("")}</div>
      <p class="muted small" style="margin-top:8px">${da} Personen da.</p></div>
      <div class="card"><h2>2 · Teams</h2><div class="row"><label>Teamgröße <select id="gr"><option value="3">3</option><option value="4" selected>4</option></select></label>
        <button class="btn" id="auslosen">🎲 Teams aus allen Anwesenden bilden</button><button class="btn ghost" id="plus">+ leeres Team</button></div>
        <p class="muted small">Die Teams werden gemischt (auch über die Liga-Teams hinweg). Danach kannst du jede Person oben per Auswahl umsetzen.</p>
        <div class="lgrid">${Object.entries(S.teams||{}).map(([t,T])=>`<div class="card tkarte" style="--f:${T.farbe};margin:0"><h3>${T.emoji} ${esc(T.name)} <button class="btn sm ghost" data-weg="${t}" style="float:right">✕</button></h3>${Object.entries(sp).filter(([,x])=>x.team===t).map(([,x])=>`<span class="chip">${esc(x.name)}</span>`).join(" ")||"<span class='muted'>leer</span>"}</div>`).join("")}</div></div>
      <div class="card"><h2>3 · Los geht's</h2><div class="row"><label>Dauer <input type="number" id="dauer" value="${Number(S.dauer)||90}" min="20" max="180" style="width:90px"> Min.</label>
        <button class="btn acc" id="start" ${Object.keys(S.teams||{}).length?"":"disabled"}>▶ Jagd starten</button>
        <button class="btn ghost sm" id="loesung">🔑 Lösungen</button><button class="btn ghost sm" id="neu">Andere Jagd</button></div><div id="loes"></div></div>`;
  }
  function spiel(){
    const w=teamWertung(F,S), sp=S.spieler||{};
    return `<div class="card"><div class="row"><b>⏱️ Rest: <span id="uhr2">${mmss(zeitRest(S))}</span></b><button class="btn sm ghost" data-plus="10">+10 Min.</button>
        <button class="btn sm ${S.info.finaleFrei?"ok":"ghost"}" id="fin">${S.info.finaleFrei?"✓ Finale für alle offen":"🔓 Finale für alle öffnen"}</button>
        <input type="text" id="msg" placeholder="Nachricht an alle …" style="flex:1;min-width:180px"><button class="btn sm" id="senden">📣 senden</button>
        <button class="btn sm acc" id="beenden">🏁 Jagd beenden</button></div>
        <div class="row small" style="margin-top:6px">${["Noch 10 Minuten!","Sprecht bitte Deutsch 🙂","Kommt bitte zurück in die Klasse."].map(t=>`<button class="btn sm ghost" data-schnell="${esc(t)}">${esc(t)}</button>`).join("")}</div></div>
      <div class="lgrid">${w.map((x,i)=>{ const f=(S.fort||{})[x.id]||{}; const st=f.st||{};
        return `<div class="card tkarte" style="--f:${x.team.farbe};margin:0"><h3>${i+1}. ${x.team.emoji} ${esc(x.team.name)} <span style="float:right;color:var(--pri)">${x.gesamt} P</span></h3>
          <div class="chips">${Object.entries(sp).filter(([,m])=>m.team===x.id).map(([,m])=>`<span class="chip ${m.online===false||!m.ts?"off":""}">${esc(m.name)}</span>`).join("")}</div>
          <div class="chips">${F.stationen.map(s=>{ const y=st[s.id]; return `<span class="chip ${y&&y.fertig?"ok":(y&&(y.b||y.f)?"lauf":"")}" title="${esc(s.name)}">${s.emoji} ${y&&y.fertig?stationPunkte(F,y):(y&&y.b?y.b+"/"+s.bloecke.length:"")}${y&&y.f?` <span style="color:var(--bad)">✗${y.f}</span>`:""}</span>`; }).join("")}</div>
          <div class="small muted">${f.wo&&F.stationen.find(s=>s.id===f.wo.s)?"📍 "+esc(F.stationen.find(s=>s.id===f.wo.s).name)+" · ":""}Finale: ${f.fin&&f.fin.fertig?"✅ gelöst":f.fin&&f.fin.schloss?"🔓 Schloss offen":"–"}</div>
          <div class="row" style="margin-top:8px"><select data-hilf="${x.id}"><option value="">Station lösen …</option>${F.stationen.filter(s=>!(st[s.id]&&st[s.id].fertig)).map(s=>`<option value="${s.id}">${s.emoji} ${esc(s.name)} (${F.punkte.min} P)</option>`).join("")}</select></div></div>`; }).join("")}</div>
      <details class="card" style="margin-top:14px"><summary><b>Teams ändern</b> (Zuspätkommende, Wechsel)</summary><div class="namen" style="margin-top:10px">${Object.keys(namen()).sort((a,b)=>String(namen()[a]).localeCompare(namen()[b])).map(p=>{ const x=sp[p]||{}; return `<label class="nm"><span>${esc(namen()[p])} ${x.ts?"📱":""}</span>${teamSelect(p,x.team)}</label>`; }).join("")}</div></details>
      <details class="card"><summary><b>🔑 Lösungen</b></summary>${loesungen()}</details>`;
  }
  function loesungen(){
    return `<p>Zahlenschloss: <b>${F.schloss.code}</b></p><ul>${F.stationen.map(s=>`<li><b>${s.emoji} ${esc(s.name)}</b>: ${s.bloecke.map(b=>b.typ==="ordnen"?b.saetze.map((x,i)=>(i+1)+". "+x).join(" "):b.typ==="zuordnen"?b.paare.map(p=>p.join(" = ")).join(" · "):b.typ==="satz"?b.items.map(i=>i.a[0]).join(" / "):b.items.map(i=>i.o[0]).join(" · ")).map(t=>esc(t)).join("<br>")}</li>`).join("")}</ul>
      <p>Finale: ${F.finale.fragen.map(q=>esc(q.o[0])).join(" · ")}</p>`;
  }
  function ende(){
    const w=teamWertung(F,S), sp=S.spieler||{}, max=maxPunkte(F), liga=Number(S.ligaMax)||F.punkte.liga||30;
    const ub=S.uebertragen||{};
    const zeilen=[]; w.forEach(x=>Object.entries(sp).filter(([,m])=>m.team===x.id).forEach(([pid,m])=>zeilen.push({pid, name:m.name, team:x.team, jp:x.gesamt, lp:Math.round(x.gesamt/max*liga)})));
    return `<div class="card"><h2>🏁 Ergebnis</h2><table>${w.map((x,i)=>`<tr><td>${i+1}.</td><td>${x.team.emoji} <b>${esc(x.team.name)}</b></td><td>Stationen ${x.stationen}</td><td>Finale ${x.finale}</td><td>Bonus ${x.bonus}</td><td><b>${x.gesamt}</b> / ${max}</td></tr>`).join("")}</table>
      <p class="row" style="margin-top:10px"><button class="btn sm ghost" id="weiter">↩ weiterspielen lassen</button></p></div>
      <div class="card"><h2>Punkte für jede Person</h2><p class="muted">Vorschlag = Teampunkte umgerechnet auf höchstens <input type="number" id="ligamax" value="${liga}" style="width:70px"> Punkte. Du kannst jede Zahl ändern (z. B. wer später kam oder wenig mitgemacht hat).</p>
      <table><tr><th>Name</th><th>Team</th><th>Jagd</th><th>Punkte</th><th></th></tr>${zeilen.map(z=>`<tr><td>${esc(z.name)}</td><td>${z.team.emoji} ${esc(z.team.name)}</td><td>${z.jp}</td><td><input type="number" min="0" max="100" data-lp="${z.pid}" value="${ub[z.pid]!==undefined?ub[z.pid]:z.lp}"></td><td>${ub[z.pid]!==undefined?"✓ gespeichert":""}</td></tr>`).join("")}</table>
      <p style="margin-top:12px"><button class="btn ok" id="uebertragen">⬆ Punkte speichern</button> <span id="ue-msg" class="muted"></span></p></div>`;
  }
  function binden(){
    const on=(id,f)=>{ const el=$("#"+id); if(el) el.onclick=f; };
    $$("[data-da]").forEach(c=>c.onchange=()=>{ const p=c.dataset.da; J(`spieler/${p}`).update({da:c.checked, name:namen()[p]||"?"}); if(!c.checked) J(`spieler/${p}/team`).remove(); });
    $$("[data-team]").forEach(c=>c.onchange=()=>{ const p=c.dataset.team; J(`spieler/${p}`).update({team:c.value||null, da:true, name:namen()[p]||"?"}); });
    on("auslosen", auslosen);
    on("plus", ()=>{ const n=Object.keys(S.teams||{}).length; const v=TEAMS_VORLAGE[n%TEAMS_VORLAGE.length]; J(`teams/t${Date.now().toString(36)}`).set({name:v[0],emoji:v[1],farbe:v[2]}); });
    $$("[data-weg]").forEach(b=>b.onclick=()=>{ const t=b.dataset.weg; const up={[`teams/${t}`]:null}; Object.entries(S.spieler||{}).forEach(([p,x])=>{ if(x.team===t) up[`spieler/${p}/team`]=null; }); J().update(up); });
    on("start", ()=>{ const d=Math.max(20,Math.min(180,Number($("#dauer").value)||90)); J().update({"info/phase":"spiel", start:TS(), dauer:d}); });
    on("loesung", ()=>{ $("#loes").innerHTML=loesungen(); });
    on("neu", ()=>{ if(confirm("Diese Jagd verlassen und eine andere vorbereiten?")){ J().off(); try{localStorage.removeItem("jagd_leitung_pin");}catch(e){} PIN=""; F=null; history.replaceState(null,"","?leitung=1"); menue(); } });
    $$("[data-plus]").forEach(b=>b.onclick=()=>J("dauer").set((Number(S.dauer)||90)+Number(b.dataset.plus)));
    on("fin", ()=>J("info/finaleFrei").set(!S.info.finaleFrei));
    on("senden", ()=>{ const t=$("#msg").value.trim(); if(t){ J("nachricht").set({text:t, ts:jetzt()}); $("#msg").value=""; } });
    $$("[data-schnell]").forEach(b=>b.onclick=()=>J("nachricht").set({text:b.dataset.schnell, ts:jetzt()}));
    on("beenden", ()=>{ if(confirm("Jagd jetzt beenden? Alle sehen dann das Ergebnis.")) J("info/phase").set("ende"); });
    on("weiter", ()=>J("info/phase").set("spiel"));
    $$("[data-hilf]").forEach(s=>s.onchange=()=>{ const sid=s.value; if(!sid) return; const st=F.stationen.find(x=>x.id===sid);
      if(confirm(`Station „${st.name}“ für dieses Team lösen? Sie bekommen nur ${F.punkte.min} Punkte, aber den Hinweis und die Ziffer.`)) J(`fort/${s.dataset.hilf}/st/${sid}`).set({b:st.bloecke.length, f:0, fertig:Date.now(), hilfe:true}); else s.value=""; });
    const lm=$("#ligamax"); if(lm) lm.onchange=()=>J("ligaMax").set(Math.max(1,Math.min(100,Number(lm.value)||30)));
    on("uebertragen", uebertragen);
    $$("#app input, #app select").forEach(el=>el.addEventListener("blur", ()=>{ if(geoeffnet){ geoeffnet=false; setTimeout(male,50); } }));
  }
  function auslosen(){
    const gr=Number($("#gr").value)||4; const sp=S.spieler||{};
    let da=Object.keys(sp).filter(p=>sp[p].da);
    if(da.length<2){ alert("Zuerst müssen Personen „da“ sein (Haken oder Anmeldung)."); return; }
    if(Object.keys(S.teams||{}).length && !confirm("Die bisherigen Teams werden ersetzt. Weiter?")) return;
    da=mische(da, Date.now()).sort((a,b)=>ligaTeam(a).localeCompare(ligaTeam(b)));
    const n=Math.max(1,Math.ceil(da.length/gr)); const up={teams:{}};
    for(let i=0;i<n;i++){ const v=TEAMS_VORLAGE[i%TEAMS_VORLAGE.length]; up.teams["t"+(i+1)]={name:v[0],emoji:v[1],farbe:v[2]}; }
    J("teams").set(up.teams).then(()=>{ const u={}; da.forEach((p,i)=>u[`spieler/${p}/team`]="t"+((i%n)+1)); return J().update(u); });
  }
  async function uebertragen(){
    const msg=$("#ue-msg"); msg.textContent="Speichere …";
    try{
      const pub2=(await db.ref(`${BASE}/public`).once("value")).val()||{};
      const runde=pub2.round&&pub2.round.id; const key=F.ligaKey||("live-jagd-"+F.id);
      const werte={}; $$("[data-lp]").forEach(i=>werte[i.dataset.lp]=Math.max(0,Math.min(100,Math.round(Number(i.value)||0))));
      const up={}; const ts=TS(); const ub=S.uebertragen||{};
      Object.entries(werte).forEach(([pid,p])=>{
        if(runde){ up[`live/${runde}/${pid}/${key}`]=p; up[`proof/${runde}/${pid}/${key}`]={code:"lehrkraft", points:p, ts}; }
        up[`log/${pid}/jagd-${PIN}`]={code:"lehrkraft", key:"jagd-"+F.id+"-"+PIN, titel:"Schnitzeljagd: "+F.titel, art:"team", p, max:Number(S.ligaMax)||F.punkte.liga||30, ts, pin:PIN};
      });
      await db.ref(BASE).update(up);
      await J("uebertragen").set(werte);
      msg.textContent=`✓ Gespeichert für ${Object.keys(werte).length} Personen.`;
    }catch(e){ console.warn(e); msg.textContent="Fehler beim Speichern: "+(e.message||e); }
  }
}

MODUS==="leitung" ? leitung() : MODUS==="leinwand" ? leinwand() : spieler();
</script>
