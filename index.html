<!DOCTYPE html>
<html lang="de" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2A44">
<meta name="robots" content="noindex, nofollow">
<title>Lernwelt Plön</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA; --card:#FFFFFF; --ink:#1E2A44; --ink-2:#2A3A5E; --muted:#6B7280; --line:#E5E0D5; --soft:#FAF8F3;
  --pri:#3B4FD8; --pri-2:#E8EBFF; --acc:#FF6B4A; --acc-2:#FFE9E3; --gold:#F5B82E; --gold-2:#FFF4D6; --ok:#14A37F; --ok-2:#E2F6EF; --bad:#E2483D;
  --head:"Outfit",system-ui,sans-serif; --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --schatten:0 1px 0 var(--line),0 8px 24px rgba(30,42,68,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;min-height:100vh}
button,input,select{font:inherit;color:inherit}
a{color:var(--pri)}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:0 0 8px;letter-spacing:-.01em}
h2{font-size:24px} h3{font-size:19px}
.muted{color:var(--muted)} .small{font-size:14px}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 110px}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--schatten);margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:0;background:var(--pri);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;font-family:var(--body)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:15px;border-radius:10px}
.btn.ghost{background:var(--pri-2);color:var(--pri)}
.btn.acc{background:var(--acc)} .btn.gold{background:var(--gold);color:var(--ink)} .btn.navy{background:var(--ink)}
.btn.wide{width:100%}
.err{color:var(--bad);font-weight:700;min-height:22px;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.sek{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sek h2{margin:0}
.sek a{font-weight:700;text-decoration:none;font-size:15px}
/* Kopf */
.kopf{background:var(--ink);color:#fff;position:sticky;top:0;z-index:30}
.kopf .in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:58px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:800;font-size:20px;color:#fff;text-decoration:none}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),#7C5CFF);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:18px;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.kopf .ich{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:999px;padding:4px 12px 4px 4px;font-weight:700;border:0;color:#fff;cursor:pointer}
.kopf .ich b{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--head)}
.kopf .ich .pk{color:var(--gold)}
/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:700}
.nav a span{font-size:22px;line-height:1;filter:grayscale(.6);opacity:.8}
.nav a.on{color:var(--pri)} .nav a.on span{filter:none;opacity:1}
@media (min-width:900px){
  .nav{position:sticky;top:58px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);z-index:29}
  .nav .in{max-width:980px;display:flex;gap:6px;padding:6px 16px}
  .nav a{flex-direction:row;gap:8px;font-size:15px;padding:8px 14px;border-radius:12px}
  .nav a.on{background:var(--pri-2)}
  .wrap{padding-bottom:60px}
}
/* Held */
.held{background:linear-gradient(135deg,var(--ink) 0%,var(--ink-2) 100%);color:#fff;border-radius:22px;padding:20px;display:grid;grid-template-columns:1fr;gap:16px;box-shadow:0 10px 30px rgba(30,42,68,.25);position:relative;overflow:hidden}
.held:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.35),transparent 70%)}
.held h1{font-size:30px;margin:2px 0 6px}
.held .lvl{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.1);border-radius:999px;padding:3px 12px;font-weight:700;font-size:15px}
.xp{height:10px;background:rgba(255,255,255,.14);border-radius:5px;overflow:hidden;margin:10px 0 4px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FFD978);border-radius:5px}
.held .zahlen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.held .zahlen div{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 8px;text-align:center}
.held .zahlen b{display:block;font-family:var(--head);font-size:28px;color:var(--gold);line-height:1.1}
.held .zahlen span{font-size:13px;opacity:.85}
@media (min-width:760px){ .held{grid-template-columns:1.2fr 1fr;align-items:center} }
/* PIN */
.pin{display:flex;gap:8px;align-items:center}
.pin input{flex:1;min-width:0;min-height:50px;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-family:var(--head);font-size:26px;letter-spacing:.3em;text-align:center}
.livekarte{background:linear-gradient(135deg,#FF6B4A,#FF8F5E);color:#fff}
.livekarte .pin input{border-color:transparent}
.livekarte h3{color:#fff}
/* Übungen */
.ue{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--schatten);text-decoration:none;color:var(--ink);border:2px solid transparent}
.ue:hover{border-color:var(--pri-2)}
.ue .ic{width:48px;height:48px;border-radius:14px;background:var(--pri-2);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.ue .tx{flex:1;min-width:0}
.ue b{display:block;font-family:var(--head);font-size:17px}
.ue .t{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ue .st{flex:none;text-align:right;font-family:var(--head);font-weight:800;font-size:18px;min-width:54px}
.ue .st small{display:block;font-family:var(--body);font-weight:600;font-size:11px;color:var(--muted)}
.ue.fertig .ic{background:var(--ok-2)}
.ue.voll .st{color:var(--ok)}
.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800;background:var(--gold-2);color:#8A5A00;margin-right:4px;vertical-align:1px}
.tag.neu{background:var(--acc-2);color:#B23A1F}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{border:0;flex:none;background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;box-shadow:0 1px 0 var(--line);font-size:15px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.bereich{margin:18px 0 8px;display:flex;gap:10px;align-items:center}
.bereich .ic{font-size:26px}
.bereich .bar{width:90px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bereich .bar i{display:block;height:100%;background:var(--ok)}
.liste{display:grid;gap:8px}
.pfad{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.pfadk{display:flex;gap:14px;align-items:center;text-align:left;border:0;background:#fff;border-radius:18px;padding:16px;box-shadow:var(--schatten);cursor:pointer}
.pfadk .ic{font-size:32px;width:58px;height:58px;border-radius:16px;background:var(--pri-2);display:flex;align-items:center;justify-content:center;flex:none}
.pfadk .tx{flex:1;display:flex;flex-direction:column;gap:3px}
.pfadk .tx>b{font-family:var(--head);font-size:18px}
.pfadk .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.pfadk .bar i{display:block;height:100%;background:var(--ok)}
.pfadk .pf{font-size:28px;color:var(--muted)}
@media (min-width:760px){ .liste{grid-template-columns:1fr 1fr} }
/* DTZ */
.dtz{background:linear-gradient(135deg,#0E7490,#14A37F);color:#fff;display:flex;gap:14px;align-items:center;text-decoration:none}
.dtz .gross{font-size:44px}
.dtz h3{color:#fff;margin:0 0 4px}
/* Arena */
.ak{display:flex;flex-direction:column;gap:8px;margin:0}
.ak .kopfzeile{display:flex;gap:12px;align-items:center}
.ak .ic{font-size:30px;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.ak h3{margin:0}
.ak p{margin:0;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--soft);border:1px solid var(--line)}
.tags span.live{background:var(--acc);color:#fff;border-color:transparent}
/* Rangliste */
.podest{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:6px 0 14px}
.podest div{background:#fff;border-radius:16px 16px 6px 6px;text-align:center;padding:12px 6px;box-shadow:var(--schatten)}
.podest .m{font-size:34px;display:block}
.podest b{display:block;font-family:var(--head);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.podest .p{font-family:var(--head);font-weight:800;color:var(--pri);font-size:22px}
.podest .p1{padding-top:22px;background:linear-gradient(180deg,var(--gold-2),#fff)}
.rang{display:grid;gap:6px}
.rz{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 1px 0 var(--line)}
.rz .n{font-family:var(--head);font-weight:800;color:var(--muted);text-align:center}
.rz b{font-weight:700}
.rz .pk{font-family:var(--head);font-weight:800;font-size:19px}
.rz.ich{background:var(--pri-2);box-shadow:inset 0 0 0 2px var(--pri)}
.rz .lv{font-size:12px;color:var(--muted);font-weight:600}
.seg{display:inline-flex;background:#fff;border-radius:12px;padding:4px;gap:4px;box-shadow:0 1px 0 var(--line)}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.ruhm{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ruhm:last-child{border:0}
.ruhm .kr{font-size:30px}
/* Ich */
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kachel{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--schatten)}
.kachel b{display:block;font-family:var(--head);font-size:28px;line-height:1.1}
.kachel span{font-size:13px;color:var(--muted)}
.balken{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:8px}
.balken i{flex:1;background:var(--pri);border-radius:4px 4px 0 0;min-height:3px;opacity:.85}
.balken i.nix{background:var(--line)}
.balken i.heute{background:var(--acc)}
.thema{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.thema .bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.thema .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--pri),#7C5CFF)}
.abz{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.abz div{background:#fff;border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--schatten)}
.abz div.nein{opacity:.45;filter:grayscale(1)}
.abz .e{font-size:34px;display:block}
.abz b{display:block;font-size:15px}
.abz span{font-size:12px;color:var(--muted)}
.verlauf div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.verlauf div:last-child{border:0}
.aufteilung{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:8px 0}
.aufteilung i{display:block;height:100%}
.legende{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.legende span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--f)}
/* Anmeldung */
.anmeldung{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 10%,#2A3A5E 0,var(--ink) 60%)}
.anmeldung .card{max-width:420px;width:100%;text-align:center;padding:28px 22px}
.anmeldung .logo{color:var(--ink);justify-content:center;font-size:26px;margin-bottom:6px}
.anmeldung .logo i{width:44px;height:44px;font-size:24px}
.anmeldung input{width:100%;min-height:58px;border:2px solid var(--line);border-radius:14px;font-family:var(--head);font-size:28px;letter-spacing:.2em;text-align:center;text-transform:uppercase;margin:14px 0 10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.leer{color:var(--muted);text-align:center;padding:16px}
.next{display:flex;gap:12px;align-items:center}
.next .e{font-size:40px}
</style>
</head>
<body>

<section class="anmeldung hidden" id="anmeldung">
  <div class="card">
    <div class="logo"><i>✦</i>Lernwelt Plön</div>
    <p class="muted" style="margin:0">Üben, Punkte sammeln, gewinnen – jeden Monat neu.</p>
    <form id="login-form" autocomplete="off"><input id="code" maxlength="8" placeholder="DEIN CODE" aria-label="Dein Code" autocapitalize="characters">
      <button class="btn wide" type="submit">Los geht's</button></form>
    <div class="err" id="login-err"></div>
    <p class="small muted" style="margin-top:14px">Live-Spiel im Unterricht? <a href="live.html"><b>PIN eingeben</b></a></p>
    <p class="small" style="margin-top:20px"><a href="lehrer.html" class="muted">Lehrkraft</a></p>
  </div>
</section>

<div id="app" class="hidden">
  <header class="kopf"><div class="in">
    <a class="logo" href="#start"><i>✦</i>Lernwelt</a>
    <button class="ich" id="kopf-ich" onclick="location.hash='#ich'"><b id="kopf-init">?</b><span id="kopf-name"></span><span class="pk" id="kopf-pk"></span></button>
  </div></header>
  <nav class="nav"><div class="in">
    <a href="#start" data-nav="start"><span>🏠</span>Start</a>
    <a href="#ueben" data-nav="ueben"><span>📚</span>Üben</a>
    <a href="#arena" data-nav="arena"><span>🏟️</span>Arena</a>
    <a href="#rang" data-nav="rang"><span>🏆</span>Rangliste</a>
    <a href="#ich" data-nav="ich"><span>👤</span>Ich</a>
  </div></nav>
  <main class="wrap" id="main"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script data-goatcounter="https://aguitoo.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<script src="katalog.js"></script>
<script src="lernwelt.js"></script>
<script>
/* =========================================================
   LERNWELT · Startseite für Jugendliche
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=LW.esc;
const KAT=window.LW_KATALOG||[], BER=window.LW_BEREICHE||[];
let me=null, E=[], logs={}, pub={}, ansicht="start", filter="alle", rangModus="monat", rangMonat=null, malTimer=null;

const ARENA=[
  {gruppe:"Live im Unterricht", icon:"🎮", farbe:"#FFE9E3", titel:"Live-Quiz", text:"Alle spielen gleichzeitig – wer ist am schnellsten? Platz 1–3 bekommen Bonus-Punkte.", tags:["live","ganze Klasse","bis 20 Punkte"], pin:true},
  {gruppe:"Live im Unterricht", icon:"⚔️", farbe:"#E8EBFF", titel:"Tafel-Duell", text:"Team gegen Team an der Leinwand – Sätze ordnen, Lücken füllen, klauen! Deine Lehrkraft leitet. Handy bleibt in der Tasche.", tags:["live","Teams","ohne Handy"], ohneHandy:true},
  {gruppe:"Live im Unterricht", icon:"🗳️", farbe:"#EDE7FF", titel:"Abstimmung", text:"Deine Lehrkraft fragt – alle stimmen am Handy ab. Das Ergebnis erscheint auf der Leinwand.", tags:["live","ganze Klasse"], pin:true},
  {gruppe:"Zusammen", icon:"🎭", farbe:"#FCE7F3", titel:"Wort-Party", text:"Pantomime, Malen oder Erklären – dein Team rät in einer Minute so viele Wörter wie möglich. Wer dran ist, sieht das Wort auf dem Handy.", tags:["live","Teams","1 Minute"], pin:true},
  {gruppe:"Zusammen", icon:"🕵️", farbe:"#FFF4D6", titel:"Schnitzeljagd", text:"Im Team einen Fall lösen: Hör-Aufgaben, Hinweise, Zahlenschloss. Punkte bekommt jede Person.", tags:["live","Team","90 Minuten"], pin:true},
  {gruppe:"Zusammen", icon:"💬", farbe:"#E2F6EF", titel:"Chat-Spiel", text:"Eine WhatsApp-Gruppe, 3–4 Leute an einem Tisch: Nachrichten aus Wort-Kacheln bauen.", tags:["live","Tisch","3–4 Personen"], pin:true},
  {gruppe:"Von zu Hause", icon:"⚔️", farbe:"#E8EBFF", titel:"Duell-Arena", text:"Fordere andere heraus – 1 gegen 1 oder in der Gruppe. Sieg +3 Punkte.", tags:["Duell","jederzeit"], link:"duell.html"}
];

LW.init();
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }

/* ---------- Anmeldung ---------- */
$("#login-form").addEventListener("submit", async e=>{
  e.preventDefault(); $("#login-err").textContent="Prüfe …";
  try{ me=await LW.anmelden($("#code").value); $("#login-err").textContent=""; starten(); }
  catch(err){ $("#login-err").textContent = err.message==="kurz"?"Der Code hat mindestens 4 Zeichen.":err.message==="unbekannt"?"Diesen Code gibt es nicht. Frag deine Lehrkraft.":"Keine Verbindung. Prüfe dein Internet."; }
});
async function init(){
  const q=new URLSearchParams(location.search).get("code"); if(q){ try{ me=await LW.anmelden(q); history.replaceState(null,"",location.pathname+location.hash); }catch(e){} }
  me = me || await LW.pruefen();
  if(!me){ $("#anmeldung").classList.remove("hidden"); $("#app").classList.add("hidden"); setTimeout(()=>$("#code").focus(),60); return; }
  starten();
}
function starten(){
  $("#anmeldung").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#kopf-init").textContent=(me.name||"?").charAt(0).toUpperCase(); $("#kopf-name").textContent=me.name;
  LW.nachsenden().then(n=>{ if(n) toast(`${n} gespeicherte Ergebnisse nachgesendet ✓`); });
  LW.ref(`log/${me.pid}`).on("value", s=>{ E=LW.eintraege(s.val()); mal(); });
  LW.ref("log").on("value", s=>{ logs=s.val()||{}; mal(); });
  LW.ref("public").on("value", s=>{ pub=s.val()||{}; mal(); });
  window.addEventListener("hashchange", ()=>{ route(); window.scrollTo(0,0); });
  route();
}
function route(){ const h=(location.hash||"#start").slice(1).split("?")[0]; ansicht=["start","ueben","arena","rang","ich"].includes(h)?h:"start"; jetztMalen(); }
function mal(){ clearTimeout(malTimer); malTimer=setTimeout(jetztMalen, 60); }

/* ---------- Hilfen ---------- */
const MONAT = () => LW.monatVon(LW.jetzt());
const namen = () => pub.names||{};
function meineWertung(){ return LW.monatsWertung(E, MONAT()); }
function rl(m){ return LW.rangliste(logs, namen(), m||MONAT()); }
function tageBisMonatsende(){ const [y,mo]=MONAT().split("-").map(Number); return Math.max(1, Math.ceil((new Date(y,mo,1)-new Date(LW.jetzt()))/864e5)); }
function ueKarte(u, W, alle){
  const mb=W.best[u.key], ab=alle[u.key];
  const status = mb!==undefined ? `${mb}<small>von ${u.max}</small>` : ab!==undefined ? `<span style="color:var(--muted)">–</span><small>diesen Monat</small>` : `<span class="tag neu">neu</span>`;
  return `<a class="ue ${mb!==undefined?"fertig":""} ${mb>=u.max?"voll":""}" href="${esc(u.datei)}"><span class="ic">${u.icon}</span><span class="tx"><b>${esc(u.titel)}</b><span class="t">${u.zeit?'<span class="tag">⏱️ Zeit</span>':""}${esc(u.text)}</span></span><span class="st">${status}</span></a>`;
}
function pinKarte(){
  return `<div class="card livekarte"><h3>🎮 Live im Unterricht</h3><p style="margin:0 0 10px;opacity:.95">PIN von der Leinwand eingeben – für Quiz, Abstimmung, Wort-Party, Schnitzeljagd und Chat-Spiel.</p>
    <form class="pin" data-pin><input inputmode="numeric" maxlength="4" placeholder="PIN" aria-label="PIN"><button class="btn navy">Los</button></form></div>`;
}

/* ---------- Ansichten ---------- */
function jetztMalen(){
  if(!me) return;
  $$("[data-nav]").forEach(a=>a.classList.toggle("on", a.dataset.nav===ansicht));
  const W=meineWertung(); $("#kopf-pk").textContent=`${W.gesamt} P`;
  const m=$("#main"); const y=window.scrollY;
  const ae=document.activeElement; if(ae && ae.tagName==="INPUT" && m.contains(ae) && ae.value) return; // nicht beim Tippen neu zeichnen
  m.innerHTML = ansicht==="ueben"?ueben(W):ansicht==="arena"?arena():ansicht==="rang"?rang():ansicht==="ich"?ichSeite(W):start(W);
  binden(); window.scrollTo(0,y);
}
function start(W){
  const st=LW.statistik(E), L=st.level, liste=rl(), platz=liste.findIndex(x=>x.pid===me.pid)+1;
  const aktuell=Object.keys(pub.aktuell||{}).filter(k=>pub.aktuell[k]).map(k=>KAT.find(u=>u.key===k)).filter(Boolean);
  const alle=st.bestAll;
  let vorschlag=[];
  if(!aktuell.length){ const offen=KAT.filter(u=>W.best[u.key]===undefined); const ord=["l11","l10","pt","lesen","l9","l8","grund"]; offen.sort((a,b)=>ord.indexOf(a.bereich)-ord.indexOf(b.bereich)); vorschlag=offen.slice(0,4); }
  const naechster=LW.meilensteine(E,{sieger:istSieger()}).find(x=>!x.ok);
  const tage=tageBisMonatsende();
  return `<section class="held">
      <div style="position:relative;z-index:1"><div class="small" style="opacity:.8">Hallo</div><h1>${esc(me.name)} 👋</h1>
        <span class="lvl">${L.icon} Level ${L.nr} · ${esc(L.name)}</span>
        <div class="xp"><i style="width:${Math.round(L.anteil*100)}%"></i></div>
        <div class="small" style="opacity:.85">${st.xp} XP${L.bis?` · noch ${L.bis-st.xp} bis ${esc(L.naechstes)}`:""}</div></div>
      <div class="zahlen"><div><b>${W.gesamt}</b><span>Punkte im ${esc(LW.monatName(MONAT()).split(" ")[0])}</span></div>
        <div><b>${platz?platz+".":"–"}</b><span>Platz von ${liste.length}</span></div>
        <div><b>${st.serie?"🔥"+st.serie:"0"}</b><span>Tage in Folge</span></div></div>
    </section>
    <div class="sek"><h2>${aktuell.length?"📌 Aktuell von deiner Lehrkraft":"✨ Vorschläge für dich"}</h2><a href="#ueben">Alle ›</a></div>
    <div class="liste">${(aktuell.length?aktuell:vorschlag).map(u=>ueKarte(u,W,alle)).join("")||`<div class="leer">Alles gemacht – stark! 💪</div>`}</div>
    <div class="grid2" style="margin-top:14px">
      ${pinKarte()}
      <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">🏆 ${esc(LW.monatName(MONAT()))}</h3><a href="#rang" class="small"><b>Rangliste ›</b></a></div>
        <div class="rang" style="margin-top:10px">${liste.slice(0,5).map((x,i)=>rangZeile(x,i)).join("")}${platz>5?`<div class="small muted" style="text-align:center">…</div>${rangZeile(liste[platz-1],platz-1)}`:""}</div>
        <p class="small muted" style="margin:10px 0 0">Noch <b>${tage} ${tage===1?"Tag":"Tage"}</b> – dann wird die Monats-Sieger:in gekürt! 👑</p></div>
    </div>
    <a class="card dtz" href="dtz.html"><span class="gross">🎓</span><span><h3>DTZ-Training</h3><span>Bereite dich Schritt für Schritt auf den Deutsch-Test für Zuwanderer vor: Hören, Lesen, Schreiben, Sprechen.</span></span></a>
    ${naechster?`<div class="card next"><span class="e">${naechster.icon}</span><div><div class="small muted">Nächster Meilenstein</div><b style="font-family:var(--head);font-size:19px">${esc(naechster.titel)}</b><div class="muted">${esc(naechster.text)}</div></div></div>`:""}`;
}
function rangZeile(x,i){ const L=LW.level(x.xp); return `<div class="rz ${x.pid===me.pid?"ich":""}"><span class="n">${["🥇","🥈","🥉"][i]||(i+1)}</span><span><b>${esc(x.name)}</b> <span class="lv">${L.icon} Lv ${L.nr}</span></span><span class="pk">${rangModus==="xp"&&ansicht==="rang"?x.xp+" XP":x.punkte}</span></div>`; }
function ueben(W){
  const alle=LW.statistik(E).bestAll;
  const chips=[["alle","Alle"],...BER.map(b=>[b.id,b.icon+" "+b.titel.replace(/^Lektion (\d+) · /,"L$1 · ")]),["zeit","⏱️ Gegen die Zeit"],["offen","Noch nicht gespielt"]];
  if(filter==="alle"){
    const pfad=BER.map(b=>{ const us=KAT.filter(u=>u.bereich===b.id); const f=us.filter(u=>W.best[u.key]!==undefined).length; const nie=us.filter(u=>alle[u.key]===undefined).length;
      return `<button class="pfadk" data-filter="${b.id}"><span class="ic">${b.icon}</span><span class="tx"><b>${esc(b.titel)}</b><span class="small muted">${esc(b.text)}</span>
        <span class="bar"><i style="width:${f/us.length*100}%"></i></span><span class="small muted">${f} von ${us.length} diesen Monat${nie?` · <span style="color:var(--acc);font-weight:800">${nie} neu</span>`:""}</span></span><span class="pf">›</span></button>`; }).join("");
    return `<a class="card dtz" href="dtz.html"><span class="gross">🎓</span><span><h3>DTZ-Training · Prüfungsvorbereitung</h3><span>Hören · Lesen · Schreiben · Sprechen – im Format der Prüfung.</span></span></a>
    <a class="card dtz" href="schreiben.html" style="background:linear-gradient(135deg,#5B21B6,#7C3AED)"><span class="gross">✍️</span><span><h3>Schreibwerkstatt B1</h3><span>E-Mails und Briefe wie im DTZ – deine Lehrkraft korrigiert persönlich. Bis 20 Punkte pro Text.</span></span></a>
      <div class="chips">${chips.map(([id,t])=>`<button class="chip ${filter===id?"on":""}" data-filter="${id}">${esc(t)}</button>`).join("")}</div>
      <div class="sek" style="margin-top:8px"><h2>📚 Lernpfad</h2></div><div class="pfad">${pfad}</div>`;
  }
  const teile=BER.map(b=>{ let us=KAT.filter(u=>u.bereich===b.id);
    if(filter==="zeit") us=us.filter(u=>u.zeit); else if(filter==="offen") us=us.filter(u=>W.best[u.key]===undefined); else if(filter!=="alle" && filter!==b.id) us=[];
    if(!us.length) return "";
    const alleB=KAT.filter(u=>u.bereich===b.id); const fertig=alleB.filter(u=>W.best[u.key]!==undefined).length;
    return `<div class="bereich"><span class="ic">${b.icon}</span><div style="flex:1"><h2 style="margin:0">${esc(b.titel)}</h2><div class="small muted">${esc(b.text)}</div></div><div class="small muted" style="text-align:right">${fertig}/${alleB.length}<div class="bar"><i style="width:${fertig/alleB.length*100}%"></i></div></div></div>
      <div class="liste">${us.map(u=>ueKarte(u,W,alle)).join("")}</div>`; }).join("");
  return `<a class="card dtz" href="dtz.html"><span class="gross">🎓</span><span><h3>DTZ-Training · Prüfungsvorbereitung</h3><span>Hören · Lesen · Schreiben · Sprechen – im Format der Prüfung.</span></span></a>
    <a class="card dtz" href="schreiben.html" style="background:linear-gradient(135deg,#5B21B6,#7C3AED)"><span class="gross">✍️</span><span><h3>Schreibwerkstatt B1</h3><span>E-Mails und Briefe wie im DTZ – deine Lehrkraft korrigiert persönlich. Bis 20 Punkte pro Text.</span></span></a>
    <div class="chips">${chips.map(([id,t])=>`<button class="chip ${filter===id?"on":""}" data-filter="${id}">${esc(t)}</button>`).join("")}</div>
    <p class="small muted" style="margin:4px 2px">Für die Monatswertung zählt bei jeder Übung dein <b>bester Versuch</b> in diesem Monat. Rechts siehst du deinen Monats-Bestwert.</p>
    ${teile||`<div class="leer">Hier ist nichts mehr offen – super! 🎉</div>`}`;
}
function arena(){
  const gruppen=[...new Set(ARENA.map(a=>a.gruppe))];
  const solo=KAT.filter(u=>u.zeit).slice(0,6), W=meineWertung(), alle=LW.statistik(E).bestAll;
  return `<h1 style="margin:6px 2px 4px">🏟️ Arena</h1><p class="muted" style="margin:0 2px 12px">Live gegen die ganze Klasse, zusammen im Team oder im Duell von zu Hause.</p>
    ${pinKarte()}
    ${gruppen.map(g=>`<div class="sek"><h2>${esc(g)}</h2></div><div class="grid2">${ARENA.filter(a=>a.gruppe===g).map(a=>`<div class="card ak"><div class="kopfzeile"><span class="ic" style="background:${a.farbe}">${a.icon}</span><div><h3>${esc(a.titel)}</h3></div></div>
      <p>${esc(a.text)}</p><div class="tags">${a.tags.map(t=>`<span class="${t==="live"?"live":""}">${t==="live"?"LIVE":esc(t)}</span>`).join("")}</div>
      ${a.link?`<a class="btn wide" href="${a.link}">⚔️ Duell-Arena öffnen</a>`:a.pin?`<div class="small muted">Mitmachen: PIN von der Leinwand oben eingeben.</div>`:`<div class="small muted">${a.ohneHandy?"📵 Kein Handy nötig – alles passiert an der Leinwand.":"Startet deine Lehrkraft im Unterricht."}</div>`}</div>`).join("")}</div>`).join("")}
    <div class="sek"><h2>⏱️ Allein gegen die Uhr</h2><a href="#ueben" data-filter-link="zeit">Alle ›</a></div>
    <p class="small muted" style="margin:0 2px 8px">Schlag deinen eigenen Rekord – jede Verbesserung bringt Punkte.</p>
    <div class="liste">${solo.map(u=>ueKarte(u,W,alle)).join("")}</div>`;
}
function istSieger(){ try{ return LW.sieger(logs, namen()).some(s=>s.sieger&&s.sieger.pid===me.pid); }catch(e){ return false; } }
function rang(){
  const ruhm=LW.sieger(logs, namen());
  const monate=[...new Set([MONAT(), ...ruhm.map(s=>s.monat)])].sort().reverse();
  const m=rangMonat||MONAT();
  const liste = rangModus==="xp" ? rl(m).sort((a,b)=>b.xp-a.xp) : rl(m);
  const top=liste.slice(0,3); const pod=[top[1],top[0],top[2]];
  return `<h1 style="margin:6px 2px 10px">🏆 Rangliste</h1>
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="seg"><button data-rmod="monat" class="${rangModus==="monat"?"on":""}">Monat</button><button data-rmod="xp" class="${rangModus==="xp"?"on":""}">Gesamt-XP</button></div>
      ${rangModus==="monat"&&monate.length>1?`<select id="rmonat" style="min-height:40px;border-radius:10px;border:1px solid var(--line);padding:4px 8px">${monate.map(x=>`<option value="${x}" ${x===m?"selected":""}>${esc(LW.monatName(x))}</option>`).join("")}</select>`:`<b>${rangModus==="monat"?esc(LW.monatName(m)):"seit Beginn"}</b>`}</div>
    <div class="podest">${pod.map((x,i)=>x?`<div class="${i===1?"p1":""}"><span class="m">${["🥈","🥇","🥉"][i]}</span><b>${esc(x.name)}</b><span class="p">${rangModus==="xp"?x.xp:x.punkte}</span></div>`:`<div style="visibility:hidden"></div>`).join("")}</div>
    <div class="rang">${liste.map((x,i)=>rangZeile(x,i)).join("")}</div>
    <div class="card" style="margin-top:16px"><h3>👑 Hall of Fame</h3>${ruhm.length?ruhm.map(r=>`<div class="ruhm"><span class="kr">👑</span><div><b>${esc(r.sieger.name)}</b> <span class="muted">· ${esc(r.name)} · ${r.sieger.punkte} Punkte</span><div class="small muted">${r.zweite?`🥈 ${esc(r.zweite.name)}`:""} ${r.dritte?`· 🥉 ${esc(r.dritte.name)}`:""}</div></div></div>`).join(""):`<p class="muted" style="margin:0">Die erste Monats-Sieger:in wird Ende ${esc(LW.monatName(MONAT()))} gekürt. Wer wird es? 👀</p>`}</div>
    <details class="card"><summary><b>So bekommst du Punkte</b></summary><ul style="margin:10px 0 0;padding-left:20px">
      <li><b>Übungen:</b> Bei jeder Übung zählt dein bester Versuch im Monat (bis 10 Punkte).</li>
      <li><b>DTZ-Training:</b> wie Übungen – dein bester Versuch pro Teil.</li>
      <li><b>Live-Quiz:</b> bis 15 Punkte, Platz 1–3 bekommen +5 / +3 / +1.</li>
      <li><b>Duelle:</b> Sieg +3, Platz 2 in der Gruppe +2.</li>
      <li><b>Schnitzeljagd, Chat-Spiel, Tafel-Duell:</b> Punkte für jede Person.</li>
      <li><b>Jeden Tag üben:</b> +${LW.TAGES_BONUS} Punkte für jeden Tag, an dem du übst.</li>
      <li>Am Monatsende gewinnt die Person mit den meisten Punkten. Dann startet alles neu – alle haben wieder eine Chance!</li></ul></details>`;
}
function ichSeite(W){
  const st=LW.statistik(E), L=st.level, ms=LW.meilensteine(E,{sieger:istSieger()}), th=LW.themenStand(E);
  const tage=[]; const heute=new Date(LW.jetzt()); for(let i=27;i>=0;i--){ const d=new Date(heute); d.setDate(d.getDate()-i); tage.push(LW.tagVon(d.getTime())); }
  const proTag={}; E.forEach(e=>{ const t=LW.tagVon(e.ts); proTag[t]=(proTag[t]||0)+1; }); const maxT=Math.max(1,...tage.map(t=>proTag[t]||0));
  const g=Math.max(1,W.gesamt);
  return `<section class="held"><div style="position:relative;z-index:1"><div class="small" style="opacity:.8">Mein Bereich</div><h1>${esc(me.name)}</h1>
      <span class="lvl">${L.icon} Level ${L.nr} · ${esc(L.name)}</span><div class="xp"><i style="width:${Math.round(L.anteil*100)}%"></i></div>
      <div class="small" style="opacity:.85">${st.xp} XP gesamt${L.bis?` · ${L.bis-st.xp} XP bis Level ${L.nr+1}`:""}</div></div>
      <div class="zahlen"><div><b>${W.gesamt}</b><span>Punkte im Monat</span></div><div><b>🔥${st.serie}</b><span>Tage in Folge</span></div><div><b>${ms.filter(x=>x.ok).length}</b><span>Abzeichen</span></div></div></section>
    <div class="sek"><h2>📊 ${esc(LW.monatName(MONAT()))}</h2></div>
    <div class="card"><div class="aufteilung"><i style="width:${W.uebungen/g*100}%;background:var(--pri)"></i><i style="width:${W.live/g*100}%;background:var(--acc)"></i><i style="width:${W.bonus/g*100}%;background:var(--gold)"></i></div>
      <div class="legende"><span style="--f:var(--pri)">Übungen ${W.uebungen}</span><span style="--f:var(--acc)">Live, Duelle & Teams ${W.live}</span><span style="--f:var(--gold)">Tages-Bonus ${W.bonus} (${W.tage} Tage)</span></div></div>
    <div class="kacheln"><div class="kachel"><b>${st.tage}</b><span>Lerntage</span></div><div class="kachel"><b>${st.runden}</b><span>Übungsrunden</span></div><div class="kachel"><b>${st.verschiedene}/${KAT.length}</b><span>verschiedene Übungen</span></div>
      <div class="kachel"><b>${Math.round(st.quote*100)} %</b><span>im Schnitt richtig</span></div><div class="kachel"><b>${st.voll}</b><span>× volle Punktzahl</span></div><div class="kachel"><b>${st.laengste}</b><span>längste Serie (Tage)</span></div></div>
    <div class="card" style="margin-top:14px"><h3>📈 Letzte 4 Wochen</h3><div class="balken">${tage.map((t,i)=>`<i class="${proTag[t]?"":"nix"} ${i===27?"heute":""}" style="height:${Math.max(4,(proTag[t]||0)/maxT*100)}%" title="${t}: ${proTag[t]||0}"></i>`).join("")}</div><div class="row small muted" style="justify-content:space-between;margin-top:4px"><span>vor 4 Wochen</span><span>heute</span></div></div>
    <div class="card"><h3>🧭 Meine Themen</h3><p class="small muted" style="margin:0 0 6px">Wie viel du in jedem Thema schon geschafft hast (beste Ergebnisse).</p>${th.map(t=>`<div class="thema"><span>${esc(t.name)}</span><span class="bar"><i style="width:${Math.round(t.stand*100)}%"></i></span><span class="small muted">${Math.round(t.stand*100)} %</span></div>`).join("")}</div>
    <div class="sek"><h2>🏅 Meilensteine</h2><span class="muted small">${ms.filter(x=>x.ok).length} von ${ms.length}</span></div>
    <div class="abz">${ms.map(x=>`<div class="${x.ok?"":"nein"}"><span class="e">${x.icon}</span><b>${esc(x.titel)}</b><span>${esc(x.text)}</span></div>`).join("")}</div>
    <div class="card" style="margin-top:14px"><h3>🕘 Zuletzt gespielt</h3><div class="verlauf">${E.slice(-12).reverse().map(e=>{ const d=new Date(e.ts); return `<div><span>${esc(e.titel||e.key)}</span><span><b>${e.p}</b>/${e.max} · <span class="muted">${d.getDate()}.${d.getMonth()+1}.</span></span></div>`; }).join("")||`<p class="muted">Noch nichts gespielt. Los geht's im Bereich „Üben“!</p>`}</div></div>
    <p style="text-align:center;margin-top:20px"><button class="btn ghost sm" id="abmelden">Abmelden</button></p>`;
}
function binden(){
  $$("[data-filter]").forEach(b=>b.onclick=()=>{ filter=b.dataset.filter; jetztMalen(); });
  $$("[data-filter-link]").forEach(a=>a.addEventListener("click",()=>{ filter=a.dataset.filterLink; }));
  $$("[data-rmod]").forEach(b=>b.onclick=()=>{ rangModus=b.dataset.rmod; jetztMalen(); });
  const rm=$("#rmonat"); if(rm) rm.onchange=()=>{ rangMonat=rm.value; jetztMalen(); };
  $$("[data-pin]").forEach(f=>f.onsubmit=e=>{ e.preventDefault(); const p=f.querySelector("input").value.replace(/\D/g,""); if(p.length===4) location.href="live.html?pin="+p; else toast("Die PIN hat 4 Ziffern."); });
  const ab=$("#abmelden"); if(ab) ab.onclick=()=>{ if(confirm("Wirklich abmelden?")){ LW.abmelden(); location.reload(); } };
}
init();
</script>
</body>
</html>
