<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14223B">
<title>Spielarena – Plöner Liga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --floor:#E3C690; --floor-line:#D5B57A; --paper:#FFFBF3; --ink:#1D1A17; --muted:#6E6358;
  --board:#14223B; --board-2:#1C2E4D; --led:#FFC53D; --line:#E8DCC6;
  --ok:#1E9E6A; --bad:#E4412F; --info:#1F6FD1;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--body);font-size:17.5px;line-height:1.45;color:var(--ink);min-height:100vh;
  background-color:var(--floor);
  background-image:repeating-linear-gradient(90deg,transparent 0 71px,var(--floor-line) 71px 73px),
                   repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 3px,transparent 3px 11px)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--board);outline-offset:3px}
.hidden{display:none!important}
.wrap{max-width:660px;margin:0 auto;padding:0 16px}

/* ---------- Kopf ---------- */
.bar{background:var(--board);color:#fff;box-shadow:0 3px 0 var(--led);position:sticky;top:0;z-index:30}
.bar-in{max-width:660px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px;min-height:54px}
.bar .logo{font-family:var(--display);font-weight:900;font-size:25px;line-height:1;letter-spacing:.01em}
.bar .dot{width:8px;height:8px;border-radius:50%;background:#7c8698;flex:none}
.bar .dot.on{background:#39d98a}
.bar .pts{margin-left:auto;display:flex;align-items:baseline;gap:5px;background:var(--board-2);border-radius:999px;padding:5px 14px}
.bar .pts b{font-family:var(--display);font-weight:900;font-size:23px;color:var(--led);line-height:1}
.bar .pts span{font-size:13px;color:#aebad0}

main{padding:16px 0 40px}
section{margin-bottom:16px}

/* ---------- Begrüßung ---------- */
.hallo{display:flex;align-items:center;gap:11px;background:var(--paper);border-radius:14px;padding:11px 15px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.hallo i{font-style:normal;width:11px;height:34px;border-radius:4px;flex:none;background:#b9ae9c}
.hallo b{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.05;display:block}
.hallo small{color:var(--muted);font-size:14.5px}
.hallo .ab{margin-left:auto;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13.5px;cursor:pointer;padding:6px 0}

/* ---------- Ferien-Streifen ---------- */
.ferien{background:var(--board);color:#fff;border-radius:14px;padding:13px 16px 14px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.ferien-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ferien b{font-family:var(--display);font-weight:900;font-size:25px;color:var(--led);line-height:1}
.ferien .rest{margin-left:auto;font-size:14.5px;color:#c9d2e3}
.balken{height:9px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:10px}
.balken i{display:block;height:100%;border-radius:5px;background:var(--led);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.ferien small{display:block;margin-top:7px;font-size:14px;color:#aebad0}

/* ---------- Hero ---------- */
.hero{background:var(--paper);border-radius:20px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.16)}
.hero-kopf{display:flex;align-items:center;gap:9px;padding:9px 18px;background:var(--board);color:var(--led);
  font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.04em}
.hero-kopf span{margin-left:auto;font-family:var(--body);font-weight:700;font-size:13.5px;color:#c9d2e3;letter-spacing:0}
.hero-body{padding:18px 18px 20px;display:flex;gap:16px;align-items:flex-start}
.hero-ic{width:74px;height:74px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:38px;flex:none;box-shadow:inset 0 -7px 0 rgba(0,0,0,.2);color:#fff}
.hero-txt{min-width:0;flex:1}
.hero-txt h2{font-family:var(--display);font-weight:900;font-size:clamp(30px,8vw,42px);line-height:.98;margin:0 0 4px;color:var(--board)}
.hero-txt p{margin:0 0 10px;color:var(--muted);font-size:16px}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px}
.hero-cta{display:block;margin:0 18px 18px;min-height:58px;border:0;border-radius:14px;background:var(--led);color:var(--board);
  font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.02em;cursor:pointer;text-decoration:none;
  display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.16);transition:transform .08s}
.hero-cta:active{transform:scale(.985)}
.hero-cta.ruhig{background:var(--board);color:#fff}
.hero.fertig .hero-ic{background:var(--ok)}
.hero.wartet .hero-ic{background:var(--info)}

/* Code-Eingabe im Hero */
.code-form{display:flex;gap:8px;margin:0 18px 8px}
.code-form input{flex:1;min-width:0;min-height:58px;border:3px solid var(--line);border-radius:14px;padding:6px 14px;background:#fff;
  font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.code-form input:focus{outline:none;border-color:var(--board)}
.code-form button{min-height:58px;padding:0 22px;border:0;border-radius:14px;background:var(--led);color:var(--board);
  font-family:var(--display);font-weight:900;font-size:24px;cursor:pointer;box-shadow:inset 0 -6px 0 rgba(0,0,0,.16)}
.err{color:var(--bad);font-weight:700;font-size:15px;min-height:22px;margin:0 18px 14px}

/* ---------- Ranking ---------- */
.rangkarte{background:var(--board);color:#fff;border-radius:16px;padding:12px 14px 13px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.rang-kopf{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.rang-kopf b{font-family:var(--display);font-weight:900;font-size:23px;color:var(--led);line-height:1;letter-spacing:.02em}
.rang-kopf em{font-style:normal;font-size:13.5px;color:#aebad0}
.rang-kopf button{margin-left:auto;border:0;background:var(--board-2);color:#fff;border-radius:999px;padding:7px 14px;
  font-weight:700;font-size:13.5px;cursor:pointer;flex:none}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pod{background:var(--board-2);border-radius:12px;padding:9px 7px 10px;text-align:center;min-width:0}
.pod i{font-style:normal;font-size:21px;line-height:1;display:block}
.pod .pn{display:block;font-size:14px;line-height:1.15;margin:5px 0 4px;padding-bottom:4px;border-bottom:3px solid;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod b{font-family:var(--display);font-weight:900;font-size:25px;color:var(--led);line-height:1}
.pod.ich{box-shadow:inset 0 0 0 2px var(--led)}
.rang-ich{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:2px solid rgba(255,255,255,.15)}
.rang-ich .r{font-family:var(--display);font-weight:900;font-size:25px;color:var(--led);line-height:1}
.rang-ich .n{font-weight:800;font-size:16.5px}
.rang-ich .p{font-family:var(--display);font-weight:900;font-size:25px;margin-left:auto;line-height:1}
.rang-ich .p u{text-decoration:none;font-family:var(--body);font-weight:700;font-size:12.5px;color:#aebad0;margin-left:4px}
.rang-ich small{flex-basis:100%;font-size:13.5px;color:#aebad0}
.geheim-txt{margin:0;font-size:15px;color:#c9d2e3}
.mehr{display:block;width:100%;margin-top:18px;border:0;border-radius:12px;background:var(--board);color:#fff;
  padding:14px;font-family:var(--display);font-weight:800;font-size:20px;cursor:pointer;text-align:center}

/* ---------- Schnellknöpfe ---------- */
.quick{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:9px}
.quick button{background:var(--paper);border:0;border-radius:14px;padding:11px 10px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12);
  display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.quick button i{font-style:normal;font-size:23px}
.quick button b{font-family:var(--display);font-weight:800;font-size:18px;color:var(--board)}
.quick button small{font-size:12.5px;color:var(--muted)}
.quick button:active{transform:scale(.98)}

/* ---------- Reiter ---------- */
.reiter{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:rgba(255,251,243,.75);padding:5px;border-radius:14px;margin-bottom:12px}
.reiter button{border:0;background:transparent;padding:9px 4px;border-radius:10px;cursor:pointer;color:var(--muted);
  font-weight:700;font-size:15.5px;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:1px}
.reiter button b{font-family:var(--display);font-weight:900;font-size:20px;line-height:1}
.reiter button[aria-pressed="true"]{background:var(--board);color:#fff}
.reiter button[aria-pressed="true"] b{color:var(--led)}

/* ---------- Aufgabenkarten ---------- */
.karten{display:grid;gap:10px}
.karte{display:grid;grid-template-columns:58px 1fr;background:var(--paper);border-radius:14px;overflow:hidden;
  text-decoration:none;color:inherit;box-shadow:0 2px 0 rgba(0,0,0,.13)}
.karte-ic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff;padding:8px 2px}
.karte-ic span{font-size:23px;line-height:1}
.karte-ic b{font-family:var(--display);font-weight:900;font-size:17px;line-height:1;opacity:.85}
.karte-body{padding:10px 13px 11px;min-width:0}
.karte-body h3{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.02;margin:0 0 2px;color:var(--board)}
.karte-body p{margin:0 0 6px;font-size:14.5px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.karte-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.karte.zu{opacity:.68}
.karte.fremd{opacity:.5}
a.karte:active{transform:scale(.99)}

.tag{font-size:12.5px;font-weight:700;padding:2.5px 9px;border-radius:999px;background:#efe5d3;color:var(--muted);white-space:nowrap}
.tag.mein{background:var(--board);color:var(--led)}
.tag.zeit{background:#fff3d1;color:#8a6200}
.tag.wartet{background:#dce8fb;color:#1a4f94}
.tag.neu{background:var(--led);color:var(--board)}
.tag.ergebnis{background:#d6f2e5;color:#12704a}
.tag.team{background:#e3ebf8;color:#1a4f94}
.go{margin-left:auto;font-weight:700;font-size:13.5px;padding:4px 11px;border-radius:9px;background:var(--board);color:#fff}

.leer{background:rgba(255,251,243,.72);border:3px dashed rgba(255,255,255,.65);border-radius:16px;padding:26px 18px;text-align:center;color:var(--muted)}
.leer b{display:block;font-family:var(--display);font-size:25px;color:var(--board);margin-bottom:4px}

/* ---------- Overlay ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.sheet.auf{pointer-events:auto}
.sheet-bg{position:absolute;inset:0;background:rgba(20,34,59,.5);opacity:0;transition:opacity .25s}
.sheet.auf .sheet-bg{opacity:1}
.sheet-box{position:relative;width:100%;max-width:660px;max-height:88vh;overflow-y:auto;background:var(--paper);
  border-radius:20px 20px 0 0;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.sheet.auf .sheet-box{transform:none}
.sheet-kopf{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;gap:10px;padding:16px 0 12px;z-index:2}
.sheet-kopf h2{font-family:var(--display);font-weight:900;font-size:31px;line-height:1;margin:0;color:var(--board)}
.sheet-kopf button{margin-left:auto;border:0;background:#efe5d3;width:40px;height:40px;border-radius:50%;font-size:19px;cursor:pointer;color:var(--muted)}

/* Tabelle im Overlay */
.trow{display:grid;grid-template-columns:30px 1fr auto;gap:11px;align-items:center;padding:10px 0;border-top:2px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow.meins{background:#fff;border-radius:11px;padding:10px 11px;box-shadow:inset 0 0 0 2px var(--led)}
.rang{font-family:var(--display);font-weight:900;font-size:25px;color:var(--muted);text-align:center}
.trow:first-of-type .rang{color:#C9951B}
.tname{font-family:var(--display);font-weight:800;font-size:21px;line-height:1;display:flex;align-items:center;gap:8px;min-width:0}
.tname em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatch{width:11px;height:22px;border-radius:3px;flex:none}
.meter{height:7px;border-radius:4px;background:#efe5d3;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tpts{font-family:var(--display);font-weight:900;font-size:27px;color:var(--board);font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right}
.hinweis{color:var(--muted);font-size:14.5px;margin:12px 0 0}

.top5{list-style:none;margin:14px 0 0;padding:0}
.top5 li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px solid var(--line)}
.top5 .r{font-family:var(--display);font-weight:900;font-size:21px;width:22px;text-align:center;color:var(--muted)}
.top5 .n{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top5 .p{font-family:var(--display);font-weight:900;font-size:23px}

.trikots{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media (max-width:420px){.trikots{grid-template-columns:1fr}}
.trikot{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.trikot-top{padding:10px 13px;color:#fff;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.1) 0 11px,transparent 11px 22px)}
.trikot-top b{font-family:var(--display);font-weight:900;font-size:22px;line-height:1;display:block}
.trikot-top small{font-size:13.5px;opacity:.9}
.mitglieder{display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px 12px}
.mitglieder span{background:#FFFBF3;border:2px solid var(--line);border-radius:999px;padding:2px 9px;font-size:14px}
.mitglieder span.ich{border-color:var(--board);font-weight:700}

.regeln{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.regeln li{background:#fff;border-left:5px solid var(--board);border-radius:10px;padding:11px 14px;font-size:16px}
.regeln li b{display:block;font-family:var(--display);font-weight:800;font-size:21px;color:var(--board);line-height:1.05;margin-bottom:2px}

footer{color:var(--board);opacity:.55;font-size:13.5px;text-align:center;padding:4px 0 26px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="bar"><div class="bar-in">
  <span class="dot" id="verbindung" title="Verbindung"></span>
  <span class="logo" id="logo">Plöner Liga</span>
  <span class="pts hidden" id="kopf-pts"><b id="kopf-zahl">0</b><span>Punkte</span></span>
</div></header>

<main class="wrap">
  <section id="hallo"></section>
  <section id="ferien" class="hidden"></section>
  <section id="hero"></section>
  <section id="rang" class="hidden"></section>
  <nav class="quick" id="quick"></nav>
  <section>
    <div class="reiter" id="reiter"></div>
    <div class="karten" id="karten"></div>
  </section>
  <footer id="fuss">Plöner Liga</footer>
</main>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-bg" data-zu></div>
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheet-titel">
    <div class="sheet-kopf"><h2 id="sheet-titel"></h2><button type="button" data-zu aria-label="Schließen">✕</button></div>
    <div id="sheet-inhalt"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script data-goatcounter="https://aguitoo.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

<script>
/* ==========================================================
   SPIELARENA – die Aufgaben verwaltest du in der Konsole.
   Diese Datei musst du nicht mehr ändern.
   ========================================================== */
const CONFIG = {
  ligaName: "Plöner Liga",
  kursName: "Jugendintegrationskurs Plön",
  kursCode: "ploen-jik"            // muss in der Konsole gleich sein
};

/* Regeln – Text frei anpassen */
const REGELN = [
  { titel: "Dein Code", text: "Du bekommst einen Code. Damit meldest du dich an. Gib ihn niemandem." },
  { titel: "Zufällige Teams", text: "Für jede Runde werden neue Teams ausgelost. Du spielst mit anderen Leuten zusammen." },
  { titel: "Punkte sammeln", text: "Jede Aufgabe bringt Punkte – für dich und für dein Team. Dein bestes Ergebnis zählt." },
  { titel: "Jedes Spiel hat seine Zeit", text: "Manche Spiele öffnen erst später und schließen wieder. Der Countdown zeigt dir, wie lange noch." },
  { titel: "Rundenende", text: "Am Ende der Runde gewinnt das Team mit den meisten Punkten." }
];

const firebaseConfig = {
  apiKey: "AIzaSyBDChXlm34Kr7Gg0Dw458GiiwoLnWJAnxM",
  authDomain: "lern-deutsch-arash.firebaseapp.com",
  databaseURL: "https://lern-deutsch-arash-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "lern-deutsch-arash",
  storageBucket: "lern-deutsch-arash.firebasestorage.app",
  messagingSenderId: "845503292114",
  appId: "1:845503292114:web:f76ab5fcde1e978d00c30b"
};
const FB_ROOT = "jugendliga";

/* ---------- Hilfen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => { if(!iso) return ""; const [y,m,d]=String(iso).split("-"); return `${d}.${m}.${y}`; };
const fmtScore = n => Number.isInteger(n) ? String(n) : Number(n).toFixed(1).replace(".",",");
const arr = v => Array.isArray(v) ? v.filter(Boolean) : (v && typeof v==="object" ? Object.values(v) : []);
const KURS = String(CONFIG.kursCode||"kurs").trim().replace(/[.#$\[\]\/\s]+/g,"-").toLowerCase();
const CODE_KEY = `liga_code_${KURS}`;
const FERN = 4102444800000;
const p2 = n => String(n).padStart(2,"0");
let tOffset=0;
const jetzt = () => Date.now() + tOffset;
function restLang(ms, dativ){
  if(ms<=0) return "gleich";
  const s=Math.floor(ms/1000), t=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  if(t>0) return `${t} ${t===1?"Tag":(dativ?"Tagen":"Tage")} ${h} Std`;
  if(h>0) return `${h} Std ${m} Min`;
  return `${m} Min`;
}
function wannText(ms){
  const d=new Date(ms), n=new Date(jetzt());
  const wd=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"][d.getDay()];
  const tage=Math.round((new Date(d).setHours(0,0,0,0)-new Date(n).setHours(0,0,0,0))/86400000);
  const uhr=`${p2(d.getHours())}:${p2(d.getMinutes())} Uhr`;
  if(tage===0) return `heute um ${uhr}`;
  if(tage===1) return `morgen um ${uhr}`;
  if(tage>1 && tage<7) return `${wd} um ${uhr}`;
  return `${p2(d.getDate())}.${p2(d.getMonth()+1)}. um ${uhr}`;
}

/* ---------- Zustand ---------- */
let pub = null;          // öffentlicher Stand aus der Konsole
let live = {};           // automatische Ergebnisse der laufenden Runde
let me = null;           // {code, pid, name}
let reiter = "jetzt";    // jetzt | bald | vorbei
let db = null, liveRef = null, liveRound = null, loaded = false;

try{ const c=JSON.parse(localStorage.getItem(CODE_KEY)||"null"); if(c&&c.code&&c.pid) me=c; }catch(e){}

document.title = `Spielarena – ${CONFIG.ligaName}`;
$("#logo").textContent = CONFIG.ligaName;
$("#fuss").textContent = CONFIG.kursName;

/* ---------- Berechnung ---------- */
function autoSum(pid){ const p=live[pid]; return p ? Object.values(p).reduce((a,v)=>a+(Number(v)||0),0) : 0; }
function playerPoints(pid){ return ((pub&&pub.manualPlayer&&pub.manualPlayer[pid])||0) + autoSum(pid); }
function teamRows(){
  if(!pub || !pub.round) return [];
  const roster=pub.roster||{};
  return arr(pub.teams).map(t=>{
    let sum=(pub.manualTeam&&pub.manualTeam[t.id])||0;
    Object.keys(roster).forEach(pid=>{ if(roster[pid]===t.id) sum+=autoSum(pid); });
    const score = pub.wertung==="schnitt" ? Math.round(sum/(t.size||1)*10)/10 : sum;
    return Object.assign({}, t, {sum, score});
  }).sort((a,b)=>b.score-a.score);
}
const meinTeam = () => (me && pub && pub.roster) ? arr(pub.teams).find(t=>t.id===pub.roster[me.pid]) || null : null;
/* Einzel-Rangliste: alle Spieler:innen der Runde, Gleichstand bekommt denselben Platz */
function spielerRows(){
  if(!pub || !pub.round) return [];
  const namen=pub.names||{}, teams=arr(pub.teams), ids=new Set();
  [pub.roster, namen, live, pub.manualPlayer].forEach(o=>{ if(o) Object.keys(o).forEach(p=>ids.add(p)); });
  const rows=[...ids].map(pid=>{
    const tm=teams.find(x=>x.id===(pub.roster||{})[pid]);
    return {pid, name:namen[pid]||"", punkte:playerPoints(pid), color:tm?tm.color:"#b9ae9c",
            team:tm?tm.name:"", ich:!!(me&&me.pid===pid)};
  }).sort((a,b)=> b.punkte-a.punkte || String(a.name).localeCompare(String(b.name),"de"));
  let platz=0, vorher=null;
  rows.forEach((r,i)=>{ if(r.punkte!==vorher){ platz=i+1; vorher=r.punkte; } r.rang=platz; });
  return rows;
}
const zeigtPunkte = () => !!(pub && pub.round && pub.showTable!==false);
const spielerName = r => r.name || (r.ich ? "Du" : "Spieler:in");
function assignedToMe(t){
  if(!me || !pub) return false;
  const a=t.assign||{};
  if(a.alle) return true;
  if(a.players && a.players[me.pid]) return true;
  const team=pub.roster && pub.roster[me.pid];
  return !!(team && a.teams && a.teams[team]);
}
function assignText(t){
  const a=t.assign||{};
  if(a.alle) return "Für alle";
  const names=arr(pub.teams).filter(tm=>a.teams&&a.teams[tm.id]).map(tm=>tm.name);
  const n=Object.keys(a.players||{}).length;
  if(names.length && n) return `Für ${names.join(", ")} und Spezialaufträge`;
  if(names.length) return `Für ${names.join(", ")}`;
  if(n) return "Spezialauftrag";
  return "";
}
/* jetzt | bald | vorbei */
function phase(t){
  if(t.status==="bald") return "bald";
  if(t.status==="fertig") return "vorbei";
  const von=Number(t.von)||0, bis=Number(t.bis)||FERN, n=jetzt();
  if(von && n<von) return "bald";
  if(bis<FERN && n>bis) return "vorbei";
  return "jetzt";
}
const meinErgebnis = t => (me && live[me.pid] && live[me.pid][t.key]!==undefined) ? Number(live[me.pid][t.key]) : null;
function alleAufgaben(){
  if(!pub) return [];
  return Object.entries(pub.tasks||{}).map(([key,t])=>Object.assign({key},t));
}
function meineAufgaben(ph){
  return alleAufgaben().filter(t=>phase(t)===ph && (!me || assignedToMe(t)));
}
function fortschritt(){
  const dran=alleAufgaben().filter(t=>(!me||assignedToMe(t)) && phase(t)!=="bald");
  const fertig=dran.filter(t=>meinErgebnis(t)!==null);
  return {ganz:dran.length, fertig:fertig.length};
}

/* ---------- Anmeldung ---------- */
function login(raw){
  const code=String(raw||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  const err=$("#code-err");
  if(code.length<4){ if(err) err.textContent="Der Code hat mindestens 4 Zeichen."; return; }
  if(!db){ if(err) err.textContent="Keine Verbindung. Bitte später nochmal."; return; }
  if(err) err.textContent="Prüfe …";
  db.ref(`${FB_ROOT}/${KURS}/codes/${code}`).once("value").then(s=>{
    const v=s.val();
    if(!v||!v.pid){ if($("#code-err")) $("#code-err").textContent="Diesen Code gibt es nicht. Frag deine Lehrkraft."; return; }
    me={code, pid:v.pid, name:v.name||""};
    localStorage.setItem(CODE_KEY, JSON.stringify(me));
    reiter="jetzt"; renderAll();
  }).catch(()=>{ if($("#code-err")) $("#code-err").textContent="Keine Verbindung. Bitte später nochmal."; });
}
function recheckCode(){
  if(!me||!db) return;
  db.ref(`${FB_ROOT}/${KURS}/codes/${me.code}`).once("value").then(s=>{
    const v=s.val();
    if(!v||v.pid!==me.pid){ me=null; localStorage.removeItem(CODE_KEY); renderAll(); }
    else if((v.name||"")!==me.name){ me.name=v.name||""; localStorage.setItem(CODE_KEY, JSON.stringify(me)); renderAll(); }
  }).catch(()=>{});
}

/* ---------- Ferien-Streifen ---------- */
function renderFerien(){
  const el=$("#ferien"), F=pub&&pub.ferien;
  if(!F){ el.classList.add("hidden"); return; }
  el.classList.remove("hidden");
  const n=jetzt();
  const ganz=Math.max(1, F.ende-F.start);
  const anteil=Math.max(0, Math.min(1, (n-F.start)/ganz));
  const tagAlle=Math.max(1, Math.floor(ganz/86400000)+1);
  const tagNun=Math.max(1, Math.min(tagAlle, Math.floor((n-F.start)/86400000)+1));
  const rest = n<F.start ? `startet in ${restLang(F.start-n, true)}`
    : n>F.ende ? "ist vorbei" : `noch ${restLang(F.ende-n)}`;
  const f=fortschritt();
  el.innerHTML=`<div class="ferien-top"><b>${esc(F.name||"Ferienliga")}</b>
      ${n>=F.start&&n<=F.ende?`<span style="color:#c9d2e3;font-size:15px">Tag ${tagNun} von ${tagAlle}</span>`:""}
      <span class="rest">${esc(rest)}</span></div>
    <div class="balken"><i style="width:${(anteil*100).toFixed(1)}%"></i></div>
    ${me&&f.ganz?`<small>${f.fertig} von ${f.ganz} Spielen geschafft${f.fertig===f.ganz?" – stark! 🎉":""}</small>`:`<small>Jeden Tag kommt ein neues Spiel dazu.</small>`}`;
}

/* ---------- Hero ---------- */
function farbeVon(t){
  const paletten=["#E4412F","#1F6FD1","#1E9E6A","#7B4BC9","#E9800E","#0E9FB0","#B45309","#DB2777","#0F766E","#7C3AED"];
  return paletten[(Number(t.nr)||0) % paletten.length];
}
function renderHero(){
  const box=$("#hero");
  if(!me){
    box.innerHTML=`<div class="hero">
      <div class="hero-kopf">⚡ Mitmachen</div>
      <div class="hero-body"><div class="hero-ic" style="background:var(--board)">🔑</div>
        <div class="hero-txt"><h2>Dein Code</h2><p>Tipp deinen Code ein. Dann siehst du deine Spiele und deine Punkte.</p></div></div>
      <form class="code-form" id="code-form" autocomplete="off">
        <input id="code-in" maxlength="8" placeholder="CODE" aria-label="Dein Code" inputmode="text" autocapitalize="characters">
        <button type="submit">Los</button></form>
      <div class="err" id="code-err" role="alert"></div></div>`;
    $("#code-form").addEventListener("submit", e=>{ e.preventDefault(); login($("#code-in").value); });
    return;
  }
  if(!pub){ box.innerHTML=`<div class="hero"><div class="hero-kopf">⏳ Lädt</div>
    <div class="hero-body"><div class="hero-ic" style="background:var(--board)">⏳</div>
    <div class="hero-txt"><h2>Einen Moment</h2><p>Deine Spiele werden geladen.</p></div></div></div>`; return; }

  const offen=meineAufgaben("jetzt");
  const neu=offen.filter(t=>meinErgebnis(t)===null);
  const kandidaten = neu.length?neu:offen;
  kandidaten.sort((a,b)=>{
    const ba=Number(a.bis)||FERN, bb=Number(b.bis)||FERN;
    if(ba!==bb) return ba-bb;
    return (Number(b.nr)||0)-(Number(a.nr)||0);
  });
  const t=kandidaten[0];

  if(!t){
    const naechste=meineAufgaben("bald").sort((a,b)=>(Number(a.von)||0)-(Number(b.von)||0))[0];
    const f=fortschritt();
    if(naechste){
      const von=Number(naechste.von)||0;
      box.innerHTML=`<div class="hero wartet">
        <div class="hero-kopf">🔒 Als Nächstes<span>${esc(wannText(von))}</span></div>
        <div class="hero-body"><div class="hero-ic">${esc(naechste.icon||"🎯")}</div>
          <div class="hero-txt"><h2>${esc(naechste.title)}</h2><p>${esc(naechste.text||"")}</p>
            <div class="hero-meta"><span class="tag wartet">öffnet in ${esc(restLang(von-jetzt(), true))}</span></div></div></div>
        <button class="hero-cta ruhig" type="button" disabled style="opacity:.6">Noch geschlossen</button></div>`;
    } else {
      box.innerHTML=`<div class="hero fertig">
        <div class="hero-kopf">✓ Geschafft</div>
        <div class="hero-body"><div class="hero-ic">🎉</div>
          <div class="hero-txt"><h2>Alles erledigt!</h2>
            <p>${f.ganz?`Du hast ${f.fertig} von ${f.ganz} Spielen gemacht.`:"Gerade ist kein Spiel offen."} Schau später wieder rein.</p></div></div></div>`;
    }
    return;
  }

  const erg=meinErgebnis(t);
  const bis=Number(t.bis)||FERN;
  const zeit = bis<FERN ? `<span class="tag zeit">⏳ noch ${esc(restLang(bis-jetzt()))}</span>` : "";
  const kopf = erg===null ? (t.status==="neu"?"🔥 Neu für dich":"🎮 Jetzt dran") : "🔁 Nochmal probieren";
  const cta  = erg===null ? "Spielen" : `Besser als ${erg} werden`;
  box.innerHTML=`<div class="hero">
    <div class="hero-kopf">${kopf}${bis<FERN?`<span>bis ${esc(wannText(bis))}</span>`:""}</div>
    <div class="hero-body"><div class="hero-ic" style="background:${farbeVon(t)}">${esc(t.icon||"🎯")}</div>
      <div class="hero-txt"><h2>${esc(t.title)}</h2>${t.text?`<p>${esc(t.text)}</p>`:""}
        <div class="hero-meta">${zeit}
          ${erg!==null?`<span class="tag ergebnis">Dein Ergebnis: ${erg}/${t.max}</span>`:`<span class="tag">bis ${t.max} Punkte</span>`}
          ${t.art==="Team"?`<span class="tag team">Team</span>`:""}</div></div></div>
    ${t.file?`<a class="hero-cta" href="${esc(t.file)}">${esc(cta)} ›</a>`:""}</div>`;
}

/* ---------- Ranking ---------- */
const MEDAILLE=["🥇","🥈","🥉"];
function renderRang(){
  const el=$("#rang");
  if(!pub || !pub.round){ el.classList.add("hidden"); return; }
  el.classList.remove("hidden");
  if(pub.showTable===false){
    el.innerHTML=`<div class="rangkarte"><div class="rang-kopf"><b>Ranking</b></div>
      <p class="geheim-txt">🤫 Noch geheim – der Stand wird später aufgedeckt. Jedes Spiel zählt trotzdem!</p></div>`;
    return;
  }
  const rows=spielerRows();
  if(!rows.length){
    el.innerHTML=`<div class="rangkarte"><div class="rang-kopf"><b>Ranking</b></div>
      <p class="geheim-txt">Noch keine Punkte – das erste Spiel entscheidet. 🚀</p></div>`;
    return;
  }
  const top=rows.slice(0,3), ich=rows.find(r=>r.ich);
  let unten="";
  if(ich){
    const vorn=rows.filter(r=>r.rang<ich.rang);
    const ziel=vorn.length ? vorn[vorn.length-1] : null;
    const diff=ziel ? ziel.punkte-ich.punkte : 0;
    const gleich=rows.filter(r=>r.rang===ich.rang && !r.ich).length;
    const hinweis = ich.rang===1 ? (gleich?`ganz oben, aber punktgleich – zieh weg! 👑`:"ganz oben – halte die Führung! 👑")
      : diff>0 ? `${fmtScore(diff)} ${diff===1?"Punkt":"Punkte"} bis Platz ${ziel.rang}`
      : ziel ? `gleichauf mit Platz ${ziel.rang} – das nächste Spiel entscheidet` : "";
    unten=`<div class="rang-ich"><span class="r">${ich.rang}.</span><span class="n">Dein Platz</span>
      <span class="p">${fmtScore(ich.punkte)}<u>Punkte</u></span><small>${esc(hinweis)}</small></div>`;
  }
  el.innerHTML=`<div class="rangkarte">
    <div class="rang-kopf"><b>Ranking</b><em>${rows.length} Spieler:innen</em>
      <button type="button" data-sheet="ranking">alle ansehen ›</button></div>
    <div class="podium">${top.map(r=>`<div class="pod${r.ich?" ich":""}"><i>${MEDAILLE[Math.min(2,r.rang-1)]}</i>
        <span class="pn" style="border-color:${esc(r.color)}">${esc(r.name||(r.ich?"Du":"Platz "+r.rang))}</span>
        <b>${fmtScore(r.punkte)}</b></div>`).join("")}</div>
    ${unten}</div>`;
}

/* ---------- Reiter & Karten ---------- */
function renderReiter(){
  const z=["jetzt","bald","vorbei"].map(p=>meineAufgaben(p).length);
  if(z[["jetzt","bald","vorbei"].indexOf(reiter)]===0){
    const ersterMit=["jetzt","bald","vorbei"].find((p,i)=>z[i]>0);
    if(ersterMit) reiter=ersterMit;
  }
  const label=[["jetzt","Jetzt"],["bald","Bald"],["vorbei","Vorbei"]];
  $("#reiter").innerHTML=label.map(([k,l],i)=>
    `<button type="button" data-r="${k}" aria-pressed="${reiter===k}"><b>${z[i]}</b>${l}</button>`).join("");
}
function karte(t, ph){
  const erg=meinErgebnis(t);
  const mein=!me||assignedToMe(t);
  const von=Number(t.von)||0, bis=Number(t.bis)||FERN;
  const tags=[];
  if(ph==="jetzt"){
    if(t.status==="neu" && erg===null) tags.push(`<span class="tag neu">Neu</span>`);
    if(bis<FERN) tags.push(`<span class="tag zeit">⏳ noch ${esc(restLang(bis-jetzt()))}</span>`);
    if(me && mein && erg===null) tags.push(`<span class="tag mein">Für dich</span>`);
  }
  if(ph==="bald" && von) tags.push(`<span class="tag wartet">🔒 ${esc(wannText(von))}</span>`);
  if(ph==="vorbei") tags.push(`<span class="tag">${t.status==="fertig"?"Abgeschlossen":"Zeit vorbei"}</span>`);
  if(erg!==null) tags.push(`<span class="tag ergebnis">${erg}/${t.max}</span>`);
  else if(ph==="jetzt") tags.push(`<span class="tag">bis ${t.max} Punkte</span>`);
  else if(ph==="vorbei" && me) tags.push(`<span class="tag">nicht gespielt</span>`);
  if(t.art==="Team") tags.push(`<span class="tag team">Team</span>`);
  if(!me && assignText(t)) tags.push(`<span class="tag">${esc(assignText(t))}</span>`);

  const offen = ph==="jetzt" && t.file && mein;
  const inner=`<div class="karte-ic" style="background:${offen?farbeVon(t):"#8a8f9c"}">
      <span>${esc(t.icon||"🎯")}</span><b>${esc(t.nr||"")}</b></div>
    <div class="karte-body"><h3>${esc(t.title)}</h3>${t.text?`<p>${esc(t.text)}</p>`:""}
      <div class="karte-meta">${tags.join("")}${offen?`<span class="go">${erg!==null?"Nochmal":"Spielen"} ›</span>`:""}</div></div>`;
  const klassen = `karte ${ph!=="jetzt"?"zu":""} ${me&&!mein?"fremd":""}`;
  return offen ? `<a class="${klassen}" href="${esc(t.file)}">${inner}</a>` : `<div class="${klassen}" aria-disabled="true">${inner}</div>`;
}
function renderKarten(){
  const box=$("#karten");
  if(!pub){ box.innerHTML=`<div class="leer"><b>${loaded?"Noch keine Spiele":"Lädt …"}</b>${loaded?"Sobald deine Lehrkraft Spiele freischaltet, erscheinen sie hier.":"Einen Moment."}</div>`; return; }
  let liste=alleAufgaben().filter(t=>phase(t)===reiter);
  if(me) liste=liste.filter(t=>assignedToMe(t)).concat(liste.filter(t=>!assignedToMe(t)));
  if(reiter==="jetzt") liste.sort((a,b)=>{
    const ea=meinErgebnis(a)===null?0:1, eb=meinErgebnis(b)===null?0:1;
    if(ea!==eb) return ea-eb;
    return (Number(a.bis)||FERN)-(Number(b.bis)||FERN);
  });
  if(reiter==="bald") liste.sort((a,b)=>(Number(a.von)||0)-(Number(b.von)||0));
  if(reiter==="vorbei") liste.sort((a,b)=>(Number(b.nr)||0)-(Number(a.nr)||0));
  if(!liste.length){
    const msg = reiter==="jetzt" ? ["Gerade nichts offen","Schau im Reiter „Bald“, was als Nächstes kommt."]
      : reiter==="bald" ? ["Nichts in Sicht","Im Moment ist kein weiteres Spiel geplant."]
      : ["Noch nichts vorbei","Hier landen Spiele, deren Zeit abgelaufen ist."];
    box.innerHTML=`<div class="leer"><b>${msg[0]}</b>${msg[1]}</div>`; return;
  }
  box.innerHTML=liste.map(t=>karte(t, reiter)).join("");
}

  if(welches==="regeln"){
    titel.textContent="So läuft die Liga";
    inhalt.innerHTML=`<ul class="regeln">${REGELN.map(r=>`<li><b>${esc(r.titel)}</b>${esc(r.text)}</li>`).join("")}</ul>`;
  }
  s.classList.add("auf"); s.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
}
function sheetZu(){
  const s=$("#sheet"); s.classList.remove("auf"); s.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
}
document.addEventListener("click", e=>{
  const q=e.target.closest("[data-sheet]"); if(q){ sheetAuf(q.dataset.sheet); return; }
  if(e.target.closest("[data-zu]")){ sheetZu(); return; }
  const r=e.target.closest("[data-r]"); if(r){ reiter=r.dataset.r; renderReiter(); renderKarten(); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") sheetZu(); });

/* ---------- Alles zeichnen ---------- */
function renderAll(){ renderHallo(); renderFerien(); renderHero(); renderRang(); renderQuick(); renderReiter(); renderKarten(); }

/* ---------- Firebase ---------- */
renderAll();
try{
  if(!window.firebase) throw new Error("Firebase nicht geladen");
  firebase.initializeApp(firebaseConfig);
  db=firebase.database();
  db.ref(".info/connected").on("value", s=>{ $("#verbindung").classList.toggle("on", !!s.val()); });
  db.ref(".info/serverTimeOffset").on("value", s=>{ tOffset=Number(s.val())||0; });
  db.ref(`${FB_ROOT}/${KURS}/public`).on("value", s=>{
    pub=s.val(); loaded=true;
    if(pub&&pub.liga) $("#logo").textContent=pub.liga;
    if(pub&&pub.kurs) $("#fuss").textContent=pub.kurs;
    const rid=pub&&pub.round?pub.round.id:null;
    if(rid!==liveRound){
      if(liveRef) liveRef.off();
      live={}; liveRound=rid; liveRef=null;
      if(rid){ liveRef=db.ref(`${FB_ROOT}/${KURS}/live/${rid}`); liveRef.on("value", ls=>{ live=ls.val()||{}; renderAll(); }); }
    }
    renderAll();
  }, err=>{ console.warn(err); loaded=true; renderAll(); });
  setInterval(()=>{ if(pub){ renderFerien(); renderHero(); renderReiter(); renderKarten(); } }, 30000);
  recheckCode();
  setTimeout(()=>{ if(!loaded){ loaded=true; renderAll(); } }, 8000);
}catch(e){
  console.warn(e); loaded=true; renderAll();
}

</script>
</body>
</html>
