<style>

.anl.steh{background:var(--steh-2)} .anl.steh>b:first-child{color:var(--steh)}

.fortschritt i.ok{background:var(--ok)} .fortschritt i.jetzt{background:var(--pri)}

.opts{display:grid;gap:8px}

.wkarte{background:#FFF7E0;border:2px dashed var(--gold);border-radius:12px;padding:8px 12px;margin:6px 0}
.linie-a{background:#2F6FDB} .linie-b{background:var(--steh)}
.hilfe{margin:6px 0 0;padding-left:18px} .hilfe li{margin:3px 0}
#statBox{position:fixed;inset:60px 0 0 0;background:rgba(30,42,68,.96);z-index:30;overflow:auto;padding:14px}

#statBox th,#statBox td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}

details.anl{padding:8px 12px} details.anl summary{cursor:pointer;font-weight:800;color:var(--pri);list-style:none} details.anl.steh summary{color:var(--steh)} details.anl[open] summary{margin-bottom:4px}
.gross-btn{display:block;width:100%;min-height:84px;border:0;border-radius:18px;font-family:var(--head);font-weight:900;font-size:24px;color:#fff;cursor:pointer;margin:8px 0}
.zwei-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px} .zwei-btn .gross-btn{min-height:110px;margin:0}
.mitte{text-align:center} .zeile-klein{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--muted);font-size:14px;margin:2px 0 8px}

const KURS="ploen-jik", ROOT=`ligaunterricht/${KURS}`;

let db=null, offset=0; try{ if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(cfg); db=firebase.database(); db.ref(".info/serverTimeOffset").on("value",s=>offset=Number(s.val())||0); }catch(e){}

/* gleiche Reihenfolge für alle mit gleichem Schlüssel (Handy, Spiegel, Leinwand) */
function hash(s){ let h=2166136261; for(const c of String(s)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function mischS(a, key){ let x=hash(key)||1; const r=()=>{ x^=x<<13; x^=x>>>17; x^=x<<5; return (x>>>0)/4294967296; }; a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const mmss=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const norm=s=>String(s||"").toLowerCase().replace(/[.,!?;:"„“]/g,"").replace(/\s+/g," ").trim();

const TYP={wahl:"✅ Auswählen", sortieren:"🧺 Sortieren", bauen:"🧩 Sätze bauen", quiz:"⚡ Quiz für alle", sprechen:"🎤 Blitzrunde", bewegung:"🤫 Bewegungsspiel", bingo:"🚶 Bingo im Raum", kugellager:"🚶 Kugellager", haelften:"🚶 Satzhälften", theater:"🎭 Theater", partner:"🗣️ Partner-Karten", schlange:"🚶 Schlangen-Puzzle"};

function aufgabe(id){ for(const B of PLAN.bloecke) for(const A of B.aufgaben) if(A.id===id) return A; return null; }
function blockVon(id){ return PLAN.bloecke.findIndex(B=>B.aufgaben.some(A=>A.id===id)); }
/* Lücken {richtig|falsch} */
function teile(text){ const out=[]; const re=/\{([^}]+)\}/g; let m, last=0; while((m=re.exec(text))){ out.push(text.slice(last,m.index)); out.push(m[1].split("|")); last=re.lastIndex; } out.push(text.slice(last)); return out; }
const loesung=text=>teile(text).map(t=>Array.isArray(t)?t[0]:t).join("");
const itemsVon=A=>A.typ==="sortieren"?A.items:A.items||[];
const okVon=(A,item,v)=>A.typ==="sortieren"?v===item.k:A.typ==="bauen"?true:v===item.o[0];
/* Timer */
function tRest(T){ if(!T) return null; if(T.pause) return Math.max(0,Number(T.rest)||0); return Math.max(0,Math.ceil(((Number(T.ende)||0)-jetzt())/1000)); }
function timerHtml(T){ const r=tRest(T); if(r===null) return ""; return `<span class="timer ${T.pause?"pause":r===0?"aus":""}" data-timer>${r===0&&!T.pause?"⏰ Zeit!":(T.pause?"⏸ ":"⏱ ")+mmss(r)}</span>`; }
let TIMER=null;
setInterval(()=>{ $$("[data-timer]").forEach(el=>{ const r=tRest(TIMER); if(r===null) return; el.textContent=r===0&&!TIMER.pause?"⏰ Zeit!":(TIMER.pause?"⏸ ":"⏱ ")+mmss(r); el.classList.toggle("aus", r===0&&!TIMER.pause); }); }, 500);
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),900); }

/* =========================================================
   GEMEINSAME AUFGABEN-ANSICHTEN (Handy live + allein)
   ctx = {pid, ant:{i:{ok,v,n}}, setze(i,val), lokal, neu()}
   ========================================================= */
function anleitung(A, steh){ return A.anleitung?`<details class="anl ${steh?"steh":""}" ${window.__anlOffen?"open":""}><summary>❓ So geht es</summary>${esc(A.anleitung)}</details>`:""; }
document.addEventListener("toggle", e=>{ if(e.target.matches && e.target.matches("details.anl")) window.__anlOffen=e.target.open; }, true);
function fortschritt(n, ok){ return `<div class="fortschritt">${Array.from({length:n},(_,i)=>`<i class="${i<ok?"ok":i===ok?"jetzt":""}"></i>`).join("")}</div>`; }
/* Jede Person bekommt ihre eigene Reihenfolge. Falsch beantwortete Aufgaben kommen später noch einmal –
   mit neu gemischten Antworten. So gibt es kein Muster und kein „Durchtippen“. */
function reihenfolge(A, ctx){ return mischS(itemsVon(A).map((_,i)=>i), A.id+"|ord|"+((ctx&&(ctx.seed||ctx.pid))||"")); }
function aktuellerIndex(A, ant, ctx){ const ord=reihenfolge(A, ctx);
  for(const i of ord) if(!ant[i]) return i;
  let best=-1; for(const i of ord) if(!ant[i].ok && (best<0 || (ant[i].n||0)<(ant[best].n||0))) best=i; return best; }
function ersteVersuche(A, ant){ return itemsVon(A).filter((_,i)=>ant[i]&&ant[i].ok&&ant[i].n===1).length; }
function loesungVon(A, it){ return A.typ==="sortieren"?(A.koerbe.find(k=>k.k===it.k)||{}).t:A.typ==="bauen"?(it.a[0].charAt(0).toUpperCase()+it.a[0].slice(1)+(it.p||"")):it.o[0]; }
function uebungHtml(A, ctx){
  const L=itemsVon(A), ant=ctx.ant||{}; const okN=L.filter((_,k)=>ant[k]&&ant[k].ok).length;
  let h=`<h2>${esc(A.titel)}</h2>`+anleitung(A);
  const fb=ctx.lokal.fb; if(fb && fb.aid===A.id){ const it=L[fb.i];
    return h+fortschritt(L.length,okN)+`<div class="card"><div class="frage">${esc(it.f||it.t||"Bau den Satz:")}</div>
      <div class="opt falsch" style="text-decoration:none;opacity:1">❌ Deine Antwort: ${esc(fb.v)}</div>
      <div class="opt ok" style="margin-top:8px">✅ Richtig ist: ${esc(loesungVon(A,it))}</div>
      ${(()=>{ const t=it.tipp||A.hinweis||(A.typ==="sortieren"?(A.koerbe[0].k==="haben"?"Bewegung von A nach B oder Veränderung → sein. Sonst → haben.":"Bewegung → Wohin? (Akkusativ). Keine Bewegung → Wo? (Dativ)."):""); return t?`<div class="tipp">💡 ${esc(t)}</div>`:""; })()}
      <p class="small muted">Diese Aufgabe kommt später noch einmal.</p><button class="btn wide" id="fbweiter">Verstanden – weiter ▶</button></div>`; }
  const i=aktuellerIndex(A, ant, ctx);
  if(i<0){ const e=ersteVersuche(A,ant); return h+fortschritt(L.length,L.length)+`<div class="card fertig"><div class="e">✅</div><h2>Fertig!</h2><p>${e} von ${L.length} beim ersten Versuch richtig.</p><p class="muted">${ctx.weiterText||"Schau zur Tafel oder hilf deinem Nachbarn."}</p>${ctx.weiterKnopf||""}</div>`; }
  const it=L[i], a=ant[i]||{}; const nochmal=a.n&&!a.ok;
  h+=fortschritt(L.length,okN)+`<div class="small muted" style="font-weight:800">${nochmal?"🔁 Noch einmal":`${okN+1} von ${L.length}`}</div>`;
  const misch=A.id+"|"+i+"|"+(ctx.seed||ctx.pid)+"|"+(a.n||0);
  if(A.typ==="wahl"||A.typ==="quiz"){ h+=`<div class="card"><div class="frage">${esc(it.f)}</div><div class="opts">${mischS(it.o, misch).map(o=>`<button class="opt" data-wahl="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`; }
  if(A.typ==="sortieren"){ h+=`<div class="card"><div class="sortkarte">${esc(it.t)}</div><div class="korb2">${A.koerbe.map(k=>`<button data-wahl="${esc(k.k)}">${esc(k.t)}</button>`).join("")}</div></div>`; }
  if(A.typ==="bauen"){ const L2=ctx.lokal; const key=A.id+"|"+i+"|"+(a.n||0); if(L2.bauKey!==key){ L2.bauKey=key; L2.gelegt=[]; }
    const pool=mischS(it.w.map((w,j)=>({w,j})), misch);
    h+=`<div class="card"><p class="small muted" style="margin:0">Tippe die Wörter in der richtigen Reihenfolge:</p><div class="linie">${L2.gelegt.map((j,k)=>`<button class="kachel" data-raus="${k}">${esc(it.w[j])}</button>`).join("")}<b style="font-size:22px">${L2.gelegt.length===it.w.length?esc(it.p||""):""}</b></div>
      <div class="pool">${pool.map(x=>`<button class="kachel ${L2.gelegt.includes(x.j)?"weg":""}" data-rein="${x.j}">${esc(x.w)}</button>`).join("")}</div>
      <div class="row"><button class="btn ok" id="pruef" ${L2.gelegt.length===it.w.length?"":"disabled"}>Prüfen</button><button class="btn ghost" id="leeren">↺ Neu</button></div></div>`; }
  return h;
}
function uebungBinden(A, ctx){
  const fw=$("#fbweiter"); if(fw){ fw.onclick=()=>{ ctx.lokal.fb=null; ctx.neu(); window.scrollTo(0,0); }; return; }
  const L=itemsVon(A), ant=ctx.ant||{}; const i=aktuellerIndex(A, ant, ctx); if(i<0) return; const it=L[i]; const a=ant[i]||{};
  const antwort=(ok, v, zeige)=>{ const n=(a.n||0)+1; if(ok) toast(n===1?"✓ Richtig!":"✓ Jetzt richtig!"); else ctx.lokal.fb={aid:A.id, i, v:zeige}; ctx.setze(i, {ok, v, n}); };
  $$("[data-wahl]").forEach(b=>b.onclick=()=>{ const v=b.dataset.wahl; antwort(okVon(A,it,v), v, A.typ==="sortieren"?(A.koerbe.find(k=>k.k===v)||{}).t:v); });
  if(A.typ==="bauen"){ const L2=ctx.lokal;
    $$("[data-rein]").forEach(b=>b.onclick=()=>{ L2.gelegt.push(Number(b.dataset.rein)); ctx.neu(); });
    $$("[data-raus]").forEach(b=>b.onclick=()=>{ L2.gelegt.splice(Number(b.dataset.raus),1); ctx.neu(); });
    const le=$("#leeren"); if(le) le.onclick=()=>{ L2.gelegt=[]; ctx.neu(); };
    const pr=$("#pruef"); if(pr) pr.onclick=()=>{ const roh=L2.gelegt.map(j=>it.w[j]).join(" "); const ok=it.a.map(norm).includes(norm(roh));
      L2.gelegt=[]; L2.bauKey=null; antwort(ok, norm(roh), roh+(it.p||"")); };
  }
}
/* Schlangen-Puzzle: Bild */
function bildHtml(PZ, ok){ return `<div class="zbild">${PZ.orte.map(o=>{ const da=PZ.teile.filter(t=>t.ort===o.id && ok.has(t.id));
  return `<div class="${PZ.art==="woche"&&da.length?"voll":""}">${o.e?`<span class="m">${o.e}</span>`:""}<b>${esc(o.n)}</b>${da.map(t=>`<span class="stk">${t.e}</span>${esc(t.o[0])}`).join("")}</div>`; }).join("")}</div>`; }
/* Theater: Rollen in der Gruppe */
function rollenVon(mitglieder, pid){ const i=mitglieder.indexOf(pid); if(i<0) return []; const n=mitglieder.length;
  if(n===1) return [0,1,2,-1]; if(n===2) return i===0?[0,2,-1]:[1]; if(i<3) return i===0&&n===3?[0,-1]:[i]; return [-2]; }
function dialogHtml(SZ, meine, modus, wahl, setzbar){
  /* modus: "luecken" (eigene Lücken wählen) | "voll" (alles ausgefüllt) */
  return `<div class="dialog">${SZ.zeilen.map(([r,text],zi)=>{ const mein=meine.includes(r)||(meine.includes(-1)&&r===-1); const wer=r<0?"Alle":SZ.rollen[r];
    const inhalt=teile(text).map((t,gi)=>{ if(!Array.isArray(t)) return esc(t); const key=zi+"_"+gi; const ok=t[0];
      if(modus==="voll") return `<span class="gefuellt">${esc(ok)}</span>`;
      if(!mein&&!setzbar) return `<span class="leer">…</span>`;
      const g=(wahl||{})[key]; if(g===ok) return `<span class="gefuellt">${esc(ok)}</span>`;
      return `<span class="luecke">${mischS(t, key).map(o=>`<button data-luecke="${key}" data-v="${esc(o)}" class="${g===o?"falsch":""}">${esc(o)}</button>`).join("")}</span>`; }).join("");
    return `<div class="z ${mein?"mein":""}"><span class="wer">${esc(wer)}${mein?" – du":""}</span>${inhalt}</div>`; }).join("")}</div>`;
}
function lueckenStand(SZ, meine, wahl, alle){ let n=0, ok=0; SZ.zeilen.forEach(([r,text],zi)=>{ if(!alle && !meine.includes(r)) return; teile(text).forEach((t,gi)=>{ if(Array.isArray(t)){ n++; if((wahl||{})[zi+"_"+gi]===t[0]) ok++; } }); }); return {n, ok}; }
function szeneVon(A, id){ return (A.szenen||[]).find(s=>s.id===id)||A.szenen[0]; }

   HANDY
   ========================================================= */
function handy(){
  const SPIEGEL=P.get("spiegel")==="1"; let me=null, S={}, namen={}, lokal={gelegt:[]}, sig="", gesehen=false, abgemeldet=false;
  const MEKEY=()=>`unt_me_${PIN}`;
  const DEMO=P.get("demo")==="1";

  function pinScreen(f){ app.innerHTML=`<div class="wrap"><div class="card" style="margin-top:8vh;text-align:center"><div style="font-size:56px">🎓</div><h2>Live-Unterricht</h2><p class="muted">Gib die PIN von der Tafel ein.</p>

  async function pruefe(){ if(PIN.length!==4) return pinScreen(PIN?"Die PIN hat 4 Ziffern.":"");

      male(); });

      app.innerHTML=h+`<div class="card fertig"><div class="e">👀</div><h2>Schau zur Tafel</h2><p class="muted">${B?esc(B.icon+" "+B.titel):""}</p></div></div>`; return; }
    const steh=!!(PLAN.bloecke[blockVon(A.id)]||{}).steh;
    if(steh) h+=`<div class="small" style="font-weight:800;margin-bottom:4px;color:var(--steh)">🚶 Steh auf!</div>`;

  }
  let binder=()=>{};
  function ctxFuer(A){ return {pid:me.pid, ant:((S.ant||{})[A.id]||{})[me.pid]||{}, lokal, setze:(i,v)=>schreib(`ant/${A.id}/${me.pid}/${i}`, v), neu:()=>male(true)}; }
  function uebung(A){ const c=ctxFuer(A); binder=()=>uebungBinden(A,c); return uebungHtml(A,c); }

      <table><tr><th>Name</th><th>Mitmachen</th><th>Richtig beim 1. Versuch</th><th>Übungen</th><th>Quiz</th><th>Bingo</th><th>Hälften</th><th>Puzzle</th><th>Partner-Karten</th><th>Theater</th><th></th><th></th></tr>
      ${Z.map(z=>{ const stark=z.quote!==null&&z.quote>=85&&z.akt>=med&&z.akt>0; const wenig=z.on&&med>0&&z.akt<med*0.4;
        return `<tr class="${z.on?"":"off"}"><td><b>${esc(z.name)}</b>${z.on?"":" <span class='muted small'>(offline)</span>"}</td>
        <td><div class="bz" style="grid-template-columns:1fr 40px"><div class="bal"><i style="width:${z.akt/max*100}%;background:var(--pri)"></i></div><b>${z.akt}</b></div></td>
        <td>${z.quote===null?"–":z.quote+" %"}</td><td>${z.ueb}</td><td>${z.qa?`${z.qr}/${z.qa}`:"–"}</td><td>${z.bingo||"–"}</td><td>${z.paare||"–"}</td><td>${z.puzzle||"–"}</td><td>${z.karten||"–"}</td><td>${z.theater||"–"}</td>
        <td>${stark?"⭐ stark":wenig?"⚠️ wenig dabei":""}</td><td><button class="btn sm ghost" data-ab="${z.p}" title="Handy abmelden – Person wählt den Namen neu">↺ abmelden</button></td></tr>`; }).join("")}</table>
      <p class="small" style="color:#fff;opacity:.8">Mitmachen = gelöste Aufgaben + Quiz-Antworten + Bingo-Felder + Puzzle-Teile + Theater-Lücken (Satzhälften und Partner-Karten zählen doppelt, weil dort gesprochen wird). ⭐ = mindestens 85 % beim 1. Versuch und viel dabei. ⚠️ = deutlich weniger als die Hälfte der Gruppe.</p>`;
    $("#szu").onclick=()=>{ statOffen=false; statMalen(); };
    $$("[data-ab]").forEach(b=>b.onclick=()=>{ if(confirm("Dieses Handy abmelden? Die Person tippt dann ihren Namen neu an.")) I(`spieler/${b.dataset.ab}`).remove(); }); }
  /* Einsicht: Handys der Lernenden als Spiegel */
  let einsichtSig="";
  function einsichtMalen(force){ let box=$("#einsichtBox"); if(!einsicht){ if(box) box.remove(); einsichtSig=""; return; }
    const L=online(); const sg=L.map(([p])=>p).join(); if(box && sg===einsichtSig && !force) return; einsichtSig=sg;
    if(!box){ box=document.createElement("div"); box.id="einsichtBox"; document.body.appendChild(box); }
    const base=location.pathname;
    box.innerHTML=`<div class="row" style="color:#fff;margin-bottom:10px"><h2 style="margin:0">👁 Einsicht – so sehen die Handys aus</h2><button class="btn sm gold" id="ezu" style="margin-left:auto">✕ schließen</button></div><div class="eg">${L.map(([p,x])=>`<div class="ef"><b>${esc(x.name)}</b><iframe loading="lazy" src="${base}?pin=${PIN}&spiegel=1&als=${encodeURIComponent(p)}"></iframe></div>`).join("")||'<p style="color:#fff">Noch niemand online.</p>'}</div>`;
    $("#ezu").onclick=()=>{ einsicht=false; einsichtMalen(); }; }
  start();
}

/* =========================================================
   ALLEIN ÜBEN (jederzeit, mit Lernwelt-Punkten)
   ========================================================= */
function solo(){
  const KEY=`unt_solo_${PLAN.id}`; let st={}; try{ st=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){}
  const merke=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} };
  const lokal={gelegt:[]}; let pos=null; /* {b, schritt} */
  try{ if(window.LW) LW.init(); }catch(e){}
  const soloAufgaben=B=>B.aufgaben.filter(A=>!LIVE_NUR.includes(A.typ));
  const bloecke=()=>PLAN.bloecke.map((B,bi)=>({B,bi})).filter(x=>soloAufgaben(x.B).length);
  function schritteVon(B){ return [...B.tafel.map((F,i)=>({art:"tafel", i})), ...soloAufgaben(B).map(A=>({art:"auf", A}))]; }
  function uebersicht(){ pos=null;
    app.innerHTML=`<div class="kopf"><div class="in"><b>🔁 ${esc(PLAN.titel)}</b><a class="r btn sm hell" href="index.html">Lernwelt</a></div></div><div class="wrap">
      <p class="muted">Wähle ein Thema. Zuerst kommt die Tafel, dann die Übungen. Jede Übung hat eine kleine Anleitung.</p>
      ${bloecke().map(({B,bi})=>{ const s=st["p_"+B.id]; return `<button class="soloblk" data-b="${bi}"><span class="e">${B.icon}</span><span><b>${esc(B.id==="theater"?"Dialoge: Party, Picknick, Weg fragen":B.titel)}</b><br><span class="small muted">${soloAufgaben(B).map(A=>({quiz:"⚡ Quiz", theater:"🎭 Dialog: Lücken & laut lesen"})[A.typ]||TYP[A.typ]).join(" · ")}</span></span>${s!==undefined?`<span class="s">✓ ${s}/10</span>`:""}</button>`; }).join("")}
      <div class="anl steh" style="margin-top:14px"><b>🚶 Nur im Unterricht</b>Bingo, Kugellager, Satzhälften und das Bewegungsspiel machen wir zusammen im Raum.</div></div>`;
    $$("[data-b]").forEach(b=>b.onclick=()=>{ pos={b:Number(b.dataset.b), s:0}; male(); }); }
  function male(){ if(!pos) return uebersicht(); const B=PLAN.bloecke[pos.b]; const S=schritteVon(B); const X=S[pos.s];
    let h=`<div class="kopf"><div class="in"><b>${B.icon} ${esc(B.titel)}</b><span class="small" style="opacity:.8">${X?`${pos.s+1}/${S.length}`:"✓"}</span><button class="r btn sm hell" id="zurueck">✕</button></div></div><div class="wrap">`;
    if(!X) return ende(B, h);
    const weiter=`<button class="btn wide" id="weiter" style="margin-top:12px">Weiter ▶</button>`;
    if(X.art==="tafel"){ const F=B.tafel[X.i]; app.innerHTML=h+`<div class="card"><div class="small muted" style="font-weight:800">📋 Tafel</div><h2>${esc(F.titel)}</h2><div class="tafelinhalt">${F.html}</div></div>${weiter}</div>`; }
    else { const A=X.A; st.a=st.a||{};
      if(A.typ==="theater") return theaterSolo(A, h);
      const ant=st.a[A.id]||{}; const fertig=aktuellerIndex(A,ant)<0;
      st.seed=st.seed||{}; if(!st.seed[A.id]){ st.seed[A.id]=String(Math.random()).slice(2,10); merke(); }
      const ctx={pid:"solo", seed:st.seed[A.id], ant, lokal, setze:(i,v)=>{ st.a[A.id]=Object.assign({}, st.a[A.id]||{}, {[i]:v}); merke(); setTimeout(male, v.ok?500:0); }, neu:male, weiterText:"Super gemacht!", weiterKnopf:`<button class="btn" id="weiter">Weiter ▶</button> <button class="btn ghost" id="nochmal">↺ noch einmal</button>`};
      const A2=A.typ==="quiz"?Object.assign({}, A, {typ:"wahl"}):A;
      app.innerHTML=h+uebungHtml(A2, ctx)+`</div>`; uebungBinden(A2, ctx);
      const n=$("#nochmal"); if(n) n.onclick=()=>{ delete st.a[A.id]; if(st.seed) delete st.seed[A.id]; merke(); male(); }; if(fertig){} }
    bind(); }
  function bind(){ const w=$("#weiter"); if(w) w.onclick=()=>{ pos.s++; male(); window.scrollTo(0,0); }; const z=$("#zurueck"); if(z) z.onclick=uebersicht; }
  function theaterSolo(A, h){ st.th=st.th||{}; const sz=st.thSz;
    if(!sz){ app.innerHTML=h+`<h2>🎭 ${esc(A.titel)}</h2><div class="anl">Wähle eine Szene. Du liest <b>alle Rollen</b>. 1. Fülle die Lücken. 2. Lies den Dialog laut – mit verschiedenen Stimmen!</div>${A.szenen.map(s=>`<button class="soloblk" data-sz="${s.id}"><span class="e">${s.icon}</span><span><b>${esc(s.titel)}</b><br><span class="small muted">${esc(s.situation)}</span></span></button>`).join("")}</div>`;
      $$("[data-sz]").forEach(b=>b.onclick=()=>{ st.thSz=b.dataset.sz; merke(); male(); }); bind(); return; }
    const SZ=szeneVon(A, sz); const wahl=st.th[sz]||{}; const s=lueckenStand(SZ,[0,1,2,-1],wahl,true); const voll=s.ok===s.n;
    app.innerHTML=h+`<div class="card"><h2>${SZ.icon} ${esc(SZ.titel)}</h2><p>${esc(SZ.situation)}</p></div>
      <div class="anl"><b>${voll?"Schritt 2 · Laut lesen":"Schritt 1 · Lücken"}</b>${voll?"Lies den ganzen Dialog laut. Jede Rolle mit einer anderen Stimme!":`Tippe bei jeder Lücke das richtige Wort. ${s.ok}/${s.n} richtig.`}</div>
      ${dialogHtml(SZ,[0,1,2,-1], voll?"voll":"luecken", wahl, true)}
      ${voll?`<button class="btn wide" id="weiter" style="margin-top:12px">Fertig ▶</button>`:""}<button class="btn ghost sm" id="andere" style="margin-top:10px">Andere Szene</button></div>`;
    $$("[data-luecke]").forEach(b=>b.onclick=()=>{ const k=b.dataset.luecke; const alt=wahl[k]; wahl[k]=b.dataset.v; st.th[sz]=wahl; st.thF=st.thF||{}; if(alt!==undefined && alt!==b.dataset.v){} if(alt===undefined && b.dataset.v!==teile(SZ.zeilen[Number(k.split("_")[0])][1])[Number(k.split("_")[1])][0]) { st.thF[sz]=(st.thF[sz]||0)+1; } merke(); male(); });
    const an=$("#andere"); if(an) an.onclick=()=>{ st.thSz=null; merke(); male(); }; bind(); }
  async function ende(B, h){ let ok=0, n=0;
    soloAufgaben(B).forEach(A=>{ if(A.typ==="theater"){ const sz=st.thSz; if(!sz) return; const SZ=szeneVon(A,sz); const s=lueckenStand(SZ,[0,1,2,-1],(st.th||{})[sz]||{},true); const f=(st.thF||{})[sz]||0; n+=s.n; ok+=Math.max(0,Math.min(s.ok, s.n-f)); return; }
      const L=itemsVon(A); n+=L.length; ok+=ersteVersuche(A,(st.a||{})[A.id]||{}); });
    const p=n?Math.round(ok/n*10):0; st["p_"+B.id]=p; merke();
    app.innerHTML=h+`<div class="card fertig"><div class="e">🏁</div><h2>${esc(B.titel)}: fertig!</h2><p><b>${ok} von ${n}</b> beim ersten Versuch richtig.</p><div id="lwmeld" class="muted">Speichern …</div>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="zurueck2">Zur Übersicht</button><button class="btn ghost" id="nochmalB">↺ Thema noch einmal</button></div></div></div>`;
    $("#zurueck2").onclick=uebersicht; $("#nochmalB").onclick=()=>{ B.aufgaben.forEach(A=>{ if(st.a) delete st.a[A.id]; }); if(B.id==="theater"){ st.th={}; st.thF={}; st.thSz=null; } merke(); pos.s=0; male(); };
    const z=$("#zurueck"); if(z) z.onclick=uebersicht;
    const m=$("#lwmeld"); try{ if(window.LW && LW.ich()){ const r=await LW.speichern({key:`${PLAN.id}-${B.id}`, titel:`Wiederholung: ${B.titel}`, p, max:10}); m.textContent=r.ok?`✓ ${p} von 10 Punkten in der Lernwelt gespeichert.`:r.wartet?"Offline – die Punkte werden später gesendet.":""; } else m.innerHTML=`Melde dich in der <a href="index.html">Lernwelt</a> an, dann werden deine Punkte gespeichert.`; }catch(e){ m.textContent=""; } }
  const b0=P.get("block"); if(b0){ const bi=PLAN.bloecke.findIndex(B=>B.id===b0); if(bi>=0){ pos={b:bi, s:0}; return male(); } } uebersicht();
}

if(P.get("solo")) solo(); else if(P.get("demo")==="1") handy(); else if(!db) app.innerHTML=`<div class="wrap"><div class="card">Keine Verbindung. Bitte Seite neu laden.</div></div>`; else if(P.get("leitung")) leitung(); else handy();
</script>
