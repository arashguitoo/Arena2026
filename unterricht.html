<!DOCTYPE html>
<html lang="de" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2A44">
<meta name="robots" content="noindex, nofollow">
<title>Live-Unterricht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA; --card:#FFFFFF; --ink:#1E2A44; --muted:#6B7280; --line:#E5E0D5; --soft:#FAF8F3;
  --nacht:#1E2A44; --nacht-2:#2B3958; --pri:#2F6FDB; --pri-2:#E3EDFF; --acc:#FF6B4A; --gold:#F5B82E; --ok:#14A37F; --ok-2:#E2F6EF; --bad:#E2483D; --bad-2:#FDE8E6; --steh:#F97316; --steh-2:#FFEDD5;
  --head:"Outfit",system-ui,sans-serif; --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --schatten:0 1px 0 var(--line),0 8px 24px rgba(30,42,68,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
input,select{color:#1E2A44;background-color:#fff}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:14px}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px 60px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--schatten);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:0;background:var(--pri);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn.sm{min-height:34px;padding:4px 12px;font-size:15px;border-radius:10px}
.btn.ghost{background:var(--pri-2);color:var(--pri)} .btn.hell{background:rgba(255,255,255,.14);color:#fff}
.btn.acc{background:var(--acc)} .btn.ok{background:var(--ok)} .btn.gold{background:var(--gold);color:var(--ink)} .btn.steh{background:var(--steh)}
.btn.wide{width:100%} .btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--bad);font-weight:700;min-height:22px;margin-top:8px}
input[type=text]{min-height:44px;border:2px solid var(--line);border-radius:12px;padding:6px 12px}
.pin-in{width:100%;font-family:var(--head);font-size:34px;letter-spacing:.3em;text-align:center;min-height:56px;border:2px solid var(--line);border-radius:12px}
.namen{display:flex;flex-wrap:wrap;gap:6px}
.namen button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}
.namen button:disabled{opacity:.35;text-decoration:line-through}
/* Timer */
.timer{font-family:var(--head);font-weight:900;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:2px 12px;background:var(--gold);color:var(--ink)}
.timer.pause{background:#CBD5E1}
.timer.aus{background:var(--bad);color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
/* Handy */
.kopf{color:#fff;position:sticky;top:0;z-index:5;background:var(--nacht)}
.kopf .in{max-width:640px;margin:0 auto;padding:8px 12px;display:flex;gap:10px;align-items:center;min-height:58px}
.kopf b{font-family:var(--head);font-size:18px} .kopf .r{margin-left:auto}
.kopf .timer{font-size:28px}
.anl{background:var(--pri-2);border-radius:14px;padding:10px 12px;font-size:15.5px;margin-bottom:10px}
.anl>b:first-child{display:block;font-family:var(--head);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--pri)}
.anl.steh{background:var(--steh-2)} .anl.steh>b:first-child{color:var(--steh)}
.fortschritt{display:flex;gap:4px;margin:6px 0 12px}
.fortschritt i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.fortschritt i.ok{background:var(--ok)} .fortschritt i.jetzt{background:var(--pri)}
.frage{font-family:var(--head);font-weight:800;font-size:clamp(22px,6vw,28px);line-height:1.25;margin:4px 0 10px}
.opts{display:grid;gap:8px}
.opt{border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;min-height:58px;padding:8px 14px;text-align:left;cursor:pointer;font-weight:700;font-size:19px}
.opt.falsch{background:var(--bad-2);border-color:var(--bad);text-decoration:line-through;opacity:.7}
.opt.ok{background:var(--ok-2);border-color:var(--ok)}
.tipp{background:#FFF7E0;border-left:5px solid var(--gold);border-radius:10px;padding:8px 12px;margin-top:10px;font-size:16px}
.korb2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.korb2 button{min-height:100px;border-radius:18px;border:3px solid var(--line);background:#fff;font-family:var(--head);font-weight:800;font-size:22px;cursor:pointer}
.sortkarte{background:#fff;border:3px solid var(--pri);border-radius:18px;padding:18px;text-align:center;font-family:var(--head);font-weight:800;font-size:clamp(20px,5.5vw,26px)}
.linie{min-height:58px;border:3px dashed var(--line);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.kachel{min-height:46px;padding:6px 12px;border-radius:10px;border:0;background:var(--pri);color:#fff;font-weight:700;font-size:19px;cursor:pointer}
.kachel.weg{visibility:hidden}
.pool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.fertig{text-align:center;padding:20px 10px} .fertig .e{font-size:64px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#fff;font-weight:800;padding:10px 22px;border-radius:999px;z-index:50;font-size:20px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.qopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qopts button{min-height:96px;border:0;border-radius:16px;color:#fff;font-weight:800;font-size:19px;cursor:pointer;padding:8px}
.qopts button.gewaehlt{outline:5px solid var(--ink)}
.q0{background:#E2483D}.q1{background:#2F6FDB}.q2{background:#D69E00}.q3{background:#14A37F}
.dran{background:linear-gradient(135deg,#FF6B4A,#F5B82E);color:#1E2A44;border-radius:18px;padding:18px;margin-bottom:12px;text-align:center}
.bingo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bingo button{min-height:96px;hyphens:auto;overflow-wrap:anywhere;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:14.5px;font-weight:700;cursor:pointer;padding:6px;line-height:1.25;color:var(--ink)}
.bingo button.voll{background:var(--ok-2);border-color:var(--ok)}
.bingo button small{display:block;margin-top:4px;color:var(--ok);font-weight:900;font-size:15px}
.kreis{font-family:var(--head);font-weight:900;font-size:30px;text-align:center;border-radius:18px;padding:14px;color:#fff}
.kreis.i{background:#2F6FDB} .kreis.a{background:var(--steh)}
.satzkarte{background:#fff;border:4px solid var(--steh);border-radius:20px;padding:26px 14px;text-align:center;font-family:var(--head);font-weight:900;font-size:clamp(26px,7vw,34px);line-height:1.2}
.dialog .z{padding:8px 10px;border-radius:12px;margin:5px 0;background:var(--soft);font-size:17px}
.dialog .z.mein{background:var(--pri-2);border-left:6px solid var(--pri)}
.dialog .z .wer{font-weight:800;display:block;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dialog .z.mein .wer{color:var(--pri)}
.luecke{display:inline-flex;gap:4px;vertical-align:middle;flex-wrap:wrap}
.luecke button{border:2px solid var(--pri);background:#fff;border-radius:8px;padding:2px 9px;font-weight:800;cursor:pointer;color:var(--pri);font-size:16px}
.luecke button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.luecke button.falsch{background:var(--bad-2);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.gefuellt{background:var(--ok-2);border-radius:6px;padding:0 4px;font-weight:800}
.leer{border-bottom:3px dotted var(--muted);padding:0 14px}
/* Tafel-Inhalte (Leinwand + Handy) */
.tafelinhalt{font-size:clamp(17px,1.9vw,30px);line-height:1.45}
.tafelinhalt table{border-collapse:collapse;margin:8px 0;width:100%}
.tafelinhalt th,.tafelinhalt td{border:1px solid var(--line);padding:4px 10px;text-align:left}
.tafelinhalt th{background:var(--soft)}
.tafelinhalt .bsp{background:var(--pri-2);border-radius:12px;padding:10px 14px;margin:10px 0}
.tafelinhalt .rot{color:var(--bad);font-weight:900}
.tafelinhalt .hinweis{background:#FFF7E0;border-radius:10px;padding:8px 12px}
.tafelinhalt .klein{font-size:.8em;color:var(--muted)}
.tafelinhalt .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tafelinhalt .chips span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 14px}
.tafelinhalt .zwei-sp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tafelinhalt .box-gruen{background:var(--ok-2);border-radius:14px;padding:10px 14px} .tafelinhalt .box-blau{background:var(--pri-2);border-radius:14px;padding:10px 14px}
.tafelinhalt .box-gruen .bsp,.tafelinhalt .box-blau .bsp{background:#fff}
.tafelinhalt .klammer{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;font-family:var(--head);font-weight:800}
.tafelinhalt .klammer span{background:var(--soft);border:2px solid var(--line);border-radius:10px;padding:4px 12px}
.tafelinhalt .klammer .v{background:var(--gold);border-color:var(--gold)}
.tafelinhalt ol.schritte li{margin:6px 0}
@media (max-width:700px){ .tafelinhalt .zwei-sp{grid-template-columns:1fr} .tafelinhalt{font-size:16px} .tafelinhalt th,.tafelinhalt td{padding:3px 5px} }
.zbild{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}
.zbild>div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:5px 3px;text-align:center;min-height:84px;font-size:12px;line-height:1.2;overflow-wrap:anywhere}
.zbild>div.voll{background:var(--ok-2);border-color:var(--ok)}
.zbild .m{font-size:28px;display:block} .zbild .stk{font-size:22px;display:block;margin-top:2px}
.fragen{display:grid;gap:6px} .fragen button{border:2px solid var(--pri);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;font-weight:800;font-size:17px;cursor:pointer;color:var(--ink)}
.wkarte{background:#FFF7E0;border:2px dashed var(--gold);border-radius:12px;padding:8px 12px;margin:6px 0}
.linie-a{background:#2F6FDB} .linie-b{background:var(--steh)}
.hilfe{margin:6px 0 0;padding-left:18px} .hilfe li{margin:3px 0}
#statBox{position:fixed;inset:60px 0 0 0;background:rgba(30,42,68,.96);z-index:30;overflow:auto;padding:14px}
#statBox table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:16px}
#statBox th,#statBox td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
#statBox th{background:var(--soft);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
#statBox tr.off td{opacity:.5}
details.anl{padding:8px 12px} details.anl summary{cursor:pointer;font-weight:800;color:var(--pri);list-style:none} details.anl.steh summary{color:var(--steh)} details.anl[open] summary{margin-bottom:4px}
.gross-btn{display:block;width:100%;min-height:84px;border:0;border-radius:18px;font-family:var(--head);font-weight:900;font-size:24px;color:#fff;cursor:pointer;margin:8px 0}
.zwei-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px} .zwei-btn .gross-btn{min-height:110px;margin:0}
.mitte{text-align:center} .zeile-klein{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--muted);font-size:14px;margin:2px 0 8px}
.sprech{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:18px}
.zurueck{background:none;border:0;color:var(--pri);font-weight:800;font-size:16px;cursor:pointer;padding:10px 0}
#demoBox{position:fixed;inset:60px 0 0 0;background:var(--nacht);z-index:1000;display:flex;gap:30px;padding:20px 30px;align-items:flex-start;overflow:auto}
#demoBox .rahmen{flex:none;border:10px solid #000;border-radius:36px;overflow:hidden;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#demoBox iframe{width:390px;height:760px;border:0;display:block}
#demoBox .r{color:#fff;flex:1;min-width:300px}
#demoBox ol{font-size:clamp(20px,2.2vw,34px);line-height:1.35;padding-left:1.2em} #demoBox li{margin:12px 0}
.warte{background:#EEF2FF;border:3px dashed #93A8E8;border-radius:20px;padding:24px 16px;text-align:center;margin:10px 0}
.warte .e{font-size:60px;display:inline-block;animation:sanduhr 2.4s ease-in-out infinite}
@keyframes sanduhr{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
.warte h2{font-size:25px;margin:6px 0} .warte p{margin:4px 0;font-size:17px}
.dranband{border-radius:16px;padding:12px;text-align:center;color:#fff;font-family:var(--head);font-weight:900;font-size:24px;margin-bottom:10px}
.wbi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.wbi button{border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px 6px;font-weight:800;font-size:17px;cursor:pointer;color:var(--ink)}
.wbi button span{display:block;font-size:40px} .wbi button.an{border-color:var(--pri);background:var(--pri-2)}
.wa{background:#ECE5DD;border-radius:16px;overflow:hidden;margin-bottom:10px} .wa .wk{background:#075E54;color:#fff;padding:10px 14px;font-weight:800;display:flex;gap:10px;align-items:center}
.wa .wl{padding:10px;display:flex;flex-direction:column;gap:6px;max-height:none} .wa .bl{max-width:82%;padding:7px 10px;border-radius:12px;font-size:16px;line-height:1.35;box-shadow:0 1px 1px rgba(0,0,0,.12);background:#fff;align-self:flex-start}
.wa .bl.ich{background:#DCF8C6;align-self:flex-end} .wa .bl b{display:block;font-size:13px} .wa .wahl{display:grid;gap:8px;padding:10px;background:#F7F7F7;border-top:1px solid #ddd}
.wa .wahl button{border:2px solid #25D366;background:#fff;border-radius:22px;padding:10px 14px;text-align:left;font-size:16px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:8px} .wa .wahl button.an{background:#25D366;color:#fff}
.zweifeld{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center} .zweifeld .plus{font-family:var(--head);font-weight:900;font-size:34px;color:var(--muted)}
.malflaeche.leer{opacity:.35}
.herzen{font-size:22px;letter-spacing:2px} .lebenraster{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:12px}
.lebenraster div{border:3px solid var(--line);border-radius:14px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:clamp(15px,1.4vw,22px)} .lebenraster div.raus{opacity:.35;text-decoration:line-through}
.malflaeche{width:100%;aspect-ratio:1/1;background:#fff;border:3px solid var(--line);border-radius:16px;touch-action:none;display:block}
.drei{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px} .drei .gross-btn{min-height:96px;font-size:34px;margin:0} .drei .gross-btn.an{outline:5px solid var(--ink)}
.opt.an{border-color:var(--pri);background:var(--pri-2)}
/* Leinwand */
body.board{background:#E9E5DC}
.bkopf{display:flex;gap:10px;align-items:center;flex-wrap:nowrap;padding:8px 16px;background:var(--nacht);color:#fff;position:sticky;top:0;z-index:20}
.bkopf h1{margin:0;font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nz{top:auto!important;bottom:14px}
.planzeit{background:var(--nacht);color:#fff;border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:700;background:rgba(255,255,255,.12);font-size:15px}
.chip.gold{background:var(--gold);color:var(--ink)}
.bkopf .timer{font-size:44px;padding:0 16px;line-height:1.15}
.tsteuer{display:flex;gap:4px;flex-wrap:wrap}
.tsteuer button{border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;font-weight:800;padding:4px 9px;cursor:pointer;font-size:14px}
.layout{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px;align-items:start}
body.beamer .layout{grid-template-columns:1fr} body.beamer .seite{display:none}
.seite{position:sticky;top:76px;max-height:calc(100vh - 90px);overflow:auto}
.blk{background:#fff;border-radius:14px;margin-bottom:8px;box-shadow:var(--schatten);overflow:hidden}
.blk .bh{display:flex;gap:8px;align-items:center;padding:9px 12px;cursor:pointer;font-weight:800}
.blk .bh .m{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.blk.steh .bh{background:var(--steh-2)}
.blk.an{outline:3px solid var(--pri)}
.blk.vorbei .bh{opacity:.55}
.blk .bi{padding:4px 12px 10px;border-top:1px solid var(--line)}
.blk .bi h4{margin:8px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.li{display:flex;gap:6px;align-items:center;padding:5px 6px;border-radius:9px;font-size:15px;cursor:pointer}
.li:hover{background:var(--soft)} .li.an{background:var(--pri-2);font-weight:800}
.li .r{margin-left:auto;display:flex;gap:4px}
.haupt{background:#fff;border-radius:22px;padding:26px 30px;box-shadow:var(--schatten);min-height:70vh;position:relative}
.haupt h2{font-size:clamp(28px,3vw,46px)}
.haupt .ecke{position:absolute;top:16px;right:20px}
.haupt .ecke .timer{font-size:clamp(40px,4.5vw,72px);padding:0 18px}
.balkenliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 16px;margin-top:12px}
.bz{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;font-size:16px}
.bz .bal{height:16px;border-radius:8px;background:var(--line);overflow:hidden} .bz .bal i{display:block;height:100%;background:var(--ok)}
.bz.off{opacity:.45}
.qboard{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.qboard div{border-radius:18px;color:#fff;font-weight:800;font-size:clamp(20px,2.4vw,36px);padding:16px 20px;display:flex;justify-content:space-between;gap:10px}
.qboard div.richtig{outline:8px solid var(--ok)} .qboard div.daneben{opacity:.35}
.grossname{font-family:var(--head);font-weight:900;font-size:clamp(50px,7vw,110px);color:var(--steh);text-align:center;line-height:1.05}
.grossfrage{font-family:var(--head);font-weight:800;font-size:clamp(28px,3.4vw,54px);text-align:center;margin:12px 0}
.gruppen{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.gruppe{border:3px solid var(--line);border-radius:16px;padding:10px 12px}
.gruppe.buehne{border-color:var(--steh);background:var(--steh-2)}
.lobbygrid{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
.lwpin{font-family:var(--head);font-weight:900;font-size:84px;letter-spacing:.08em;color:var(--pri);line-height:1}
.namenwolke{display:flex;flex-wrap:wrap;gap:6px}
.namenwolke span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700}
.namenwolke span.off{opacity:.4}
#einsichtBox{position:fixed;inset:60px 0 0 0;background:rgba(30,42,68,.96);z-index:30;overflow:auto;padding:14px}
#einsichtBox .eg{display:grid;grid-template-columns:repeat(auto-fill,262px);gap:12px}
#einsichtBox .ef{background:#fff;border-radius:14px;overflow:hidden}
#einsichtBox .ef b{display:block;padding:4px 10px;font-size:14px}
#einsichtBox .ef{width:262px;overflow:hidden}
#einsichtBox iframe{width:375px;height:700px;border:0;transform:scale(.7);transform-origin:0 0;margin-bottom:-210px;margin-right:-113px;pointer-events:none;display:block}

function uebungBinden(A, ctx){

      Object.entries(S.kv||{}).forEach(([nr,st])=>Object.entries(st||{}).forEach(([step,an])=>{ const v=(an||{})[p]; const r=((S.kr||{})[nr]||{})[step]; if(v!==undefined && r!==undefined){ z.qa++; if(v===r) z.qr++; } }));
      z.karten+=Number(((S.stat||{})[p]||{}).kette)||0;
      Object.entries(S.lv||{}).forEach(([nr,an])=>{ const v=(an||{})[p]; if(v!==undefined){ z.qa++; if(v===(S.lg||{})[nr]) z.qr++; } });
      Object.values(S.du||{}).forEach(fr=>Object.values(fr||{}).forEach(an=>{ const a=(an||{})[p]; if(a){ z.qa++; if(a.o===0) z.qr++; } }));
      Object.values(S.bingo||{}).forEach(b=>{ z.bingo+=Object.keys((b||{})[p]||{}).length; });
      z.paare=(Number(((S.stat||{})[p]||{}).paare)||0)+(S.hael&&S.hael.ok&&S.hael.ok[p]?1:0);
      Object.values(S.sp||{}).forEach(a=>{ Object.values((a||{})[p]||{}).forEach(v=>{ if(v&&v.ok){ z.puzzle++; if(v.n===1) z.erst++; } }); });
      z.karten=(Number(((S.stat||{})[p]||{}).karten)||0); if(S.paar&&S.paar.gr) Object.values(S.paar.gr).forEach(G=>{ if(Object.values(G.m||{}).includes(p)) z.karten+=Number(G.k)||0; });
      Object.entries(S.th||{}).forEach(([aid,pro])=>{ const A=aufgabe(aid); if(!A) return; Object.entries((pro||{})[p]||{}).forEach(([key,v])=>{ const [zi,gi]=key.split("_").map(Number); for(const SZ of A.szenen){ const t=teile((SZ.zeilen[zi]||[])[1]||"")[gi]; if(Array.isArray(t)&&t[0]===v){ z.theater++; break; } } }); });
      z.akt=z.ueb+z.qa+z.bingo+2*z.paare+z.puzzle+2*z.karten+z.theater; const basis=z.vers+z.qa; z.quote=(z.ueb+z.qa+z.puzzle)?Math.round((z.erst+z.qr)/(z.ueb+z.qa+z.puzzle)*100):null; return z; }); }
  function statMalen(){ let box=$("#statBox"); if(!statOffen){ if(box) box.remove(); return; }
    if(!box){ box=document.createElement("div"); box.id="statBox"; document.body.appendChild(box); }
    const Z=statZeilen().sort((a,b)=>b.akt-a.akt); const med=(()=>{ const v=Z.filter(z=>z.on).map(z=>z.akt).sort((a,b)=>a-b); return v.length?v[Math.floor(v.length/2)]:0; })(); const max=Math.max(1,...Z.map(z=>z.akt));
    box.innerHTML=`<div class="row" style="color:#fff;margin-bottom:10px"><h2 style="margin:0">📊 Wer macht mit? Wer ist gut?</h2><span class="small" style="opacity:.8">Nur für dich – nicht am Beamer zeigen.</span><button class="btn sm gold" id="szu" style="margin-left:auto">✕ schließen</button></div>

      ${Z.map(z=>{ const stark=z.quote!==null&&z.quote>=85&&z.akt>=med&&z.akt>0; const wenig=z.on&&med>0&&z.akt<med*0.4;
        return `<tr class="${z.on?"":"off"}"><td><b>${esc(z.name)}</b>${z.on?"":" <span class='muted small'>(offline)</span>"}</td>

        <td>${z.quote===null?"–":z.quote+" %"}</td><td>${z.ueb}</td><td>${z.qa?`${z.qr}/${z.qa}`:"–"}</td><td>${z.bingo||"–"}</td><td>${z.paare||"–"}</td><td>${z.puzzle||"–"}</td><td>${z.karten||"–"}</td><td>${z.theater||"–"}</td>
        <td>${stark?"⭐ stark":wenig?"⚠️ wenig dabei":""}</td><td><button class="btn sm ghost" data-ab="${z.p}" title="Handy abmelden – Person wählt den Namen neu">↺ abmelden</button></td></tr>`; }).join("")}</table>

  /* Einsicht: Handys der Lernenden als Spiegel */

/* =========================================================

function solo(){
  const KEY=`unt_solo_${PLAN.id}`; let st={}; try{ st=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){}

  const soloAufgaben=B=>B.aufgaben.filter(A=>!LIVE_NUR.includes(A.typ));
  const bloecke=()=>PLAN.bloecke.map((B,bi)=>({B,bi})).filter(x=>soloAufgaben(x.B).length);
  function schritteVon(B){ return [...B.tafel.map((F,i)=>({art:"tafel", i})), ...soloAufgaben(B).map(A=>({art:"auf", A}))]; }

      <div class="anl steh" style="margin-top:14px"><b>🚶 Nur im Unterricht</b>Bingo, Kugellager, Satzhälften und das Bewegungsspiel machen wir zusammen im Raum.</div></div>`;
    $$("[data-b]").forEach(b=>b.onclick=()=>{ pos={b:Number(b.dataset.b), s:0}; male(); }); }
  function male(){ if(!pos) return uebersicht(); const B=PLAN.bloecke[pos.b]; const S=schritteVon(B); const X=S[pos.s];
    let h=`<div class="kopf"><div class="in"><b>${B.icon} ${esc(B.titel)}</b><span class="small" style="opacity:.8">${X?`${pos.s+1}/${S.length}`:"✓"}</span><button class="r btn sm hell" id="zurueck">✕</button></div></div><div class="wrap">`;
    if(!X) return ende(B, h);
    const weiter=`<button class="btn wide" id="weiter" style="margin-top:12px">Weiter ▶</button>`;
    if(X.art==="tafel"){ const F=B.tafel[X.i]; app.innerHTML=h+`<div class="card"><div class="small muted" style="font-weight:800">📋 Tafel</div><h2>${esc(F.titel)}</h2><div class="tafelinhalt">${F.html}</div></div>${weiter}</div>`; }
    else { const A=X.A; st.a=st.a||{};
      if(A.typ==="theater") return theaterSolo(A, h);
      const ant=st.a[A.id]||{}; const fertig=aktuellerIndex(A,ant)<0;
      st.seed=st.seed||{}; if(!st.seed[A.id]){ st.seed[A.id]=String(Math.random()).slice(2,10); merke(); }
      const ctx={pid:"solo", seed:st.seed[A.id], ant, lokal, setze:(i,v)=>{ st.a[A.id]=Object.assign({}, st.a[A.id]||{}, {[i]:v}); merke(); setTimeout(male, v.ok?500:0); }, neu:male, weiterText:"Super gemacht!", weiterKnopf:`<button class="btn" id="weiter">Weiter ▶</button> <button class="btn ghost" id="nochmal">↺ noch einmal</button>`};
      const A2=A.typ==="quiz"?Object.assign({}, A, {typ:"wahl"}):A;
      app.innerHTML=h+uebungHtml(A2, ctx)+`</div>`; uebungBinden(A2, ctx);
      const n=$("#nochmal"); if(n) n.onclick=()=>{ delete st.a[A.id]; if(st.seed) delete st.seed[A.id]; merke(); male(); }; if(fertig){} }
    bind(); }
  function bind(){ const w=$("#weiter"); if(w) w.onclick=()=>{ pos.s++; male(); window.scrollTo(0,0); }; const z=$("#zurueck"); if(z) z.onclick=uebersicht; }
  function theaterSolo(A, h){ st.th=st.th||{}; const sz=st.thSz;

      $$("[data-sz]").forEach(b=>b.onclick=()=>{ st.thSz=b.dataset.sz; merke(); male(); }); bind(); return; }
    const SZ=szeneVon(A, sz); const wahl=st.th[sz]||{}; const s=lueckenStand(SZ,[0,1,2,-1],wahl,true); const voll=s.ok===s.n;
    app.innerHTML=h+`<div class="card"><h2>${SZ.icon} ${esc(SZ.titel)}</h2><p>${esc(SZ.situation)}</p></div>

    const z=$("#zurueck"); if(z) z.onclick=uebersicht;
    const m=$("#lwmeld"); try{ if(window.LW && LW.ich()){ const r=await LW.speichern({key:`${PLAN.id}-${B.id}`, titel:`Wiederholung: ${B.titel}`, p, max:10}); m.textContent=r.ok?`✓ ${p} von 10 Punkten in der Lernwelt gespeichert.`:r.wartet?"Offline – die Punkte werden später gesendet.":""; } else m.innerHTML=`Melde dich in der <a href="index.html">Lernwelt</a> an, dann werden deine Punkte gespeichert.`; }catch(e){ m.textContent=""; } }
  const b0=P.get("block"); if(b0){ const bi=PLAN.bloecke.findIndex(B=>B.id===b0); if(bi>=0){ pos={b:bi, s:0}; return male(); } } uebersicht();
}

if(P.get("solo")) solo(); else if(P.get("demo")==="1") handy(); else if(!db) app.innerHTML=`<div class="wrap"><div class="card">Keine Verbindung. Bitte Seite neu laden.</div></div>`; else if(P.get("leitung")) leitung(); else handy();
